<style id="mobile-fit-pass">
/* ------------------------------------------------------------------ *
 * 手机适配收尾。修的是三件独立的事：
 *   1) 标题描边把字吃掉      -webkit-text-stroke 默认画在填充之上，
 *                            字号一小，3px 描边就把笔画糊成一团黑。
 *   2) 票价印章压住头奖文字  原来在 ≤560px 用 absolute 定位硬塞，
 *                            换回文档流里排。
 *   3) 竖屏要滚动才够到「购买」 把票面收进一屏，记录抽屉留在下面。
 * ------------------------------------------------------------------ */

/* 1) 描边先画、填充后画，笔画就不会被自己的描边糊掉；
      手机上再把描边宽度改成随字号走的 em。 */
.cat-word,.dream-word,.jackpot-value,.jackpot-label,.win-amount{paint-order:stroke fill}
@media(max-width:600px),(orientation:landscape) and (max-height:520px){
  .cat-word{-webkit-text-stroke-width:.075em}
  .dream-word{-webkit-text-stroke-width:.07em}
  .jackpot-value{-webkit-text-stroke-width:.055em}
}

/* 2) 票价印章回到文档流：规则卡整行，头奖和印章并排收底。 */
@media(max-width:850px){
  .info-side{
    display:grid!important;grid-template-columns:minmax(0,1fr) auto;
    align-items:end;column-gap:10px;row-gap:8px;
  }
  .rules-card{grid-column:1/-1;grid-row:1}
  .jackpot-block{grid-column:1;grid-row:2;margin:0}
  .price-stamp{
    position:static!important;right:auto!important;top:auto!important;
    grid-column:2;grid-row:2;align-self:end;
  }
}

/* 3) 票档不再横向藏起来：三档平铺，名称和票价上下排。 */
@media(max-width:600px){
  .tier-switch{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    gap:5px;overflow:visible;padding:0;
  }
  .tier-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;min-width:0;min-height:44px;padding:5px 4px;
    font-size:11px;line-height:1.2;
  }
  .tier-btn b{margin-left:0;font-size:11px}
}
@media(max-width:430px){
  /* 名称和票价上下排之后，三档 + 音乐 + 余额在 320px 里也是一行装得下的，
     所以不必换行 —— 换行会白吃掉 34px 高，320x568 的机器上正好差这一点。 */
  .control-strip{gap:6px}
  .tier-btn{font-size:10px;padding:5px 2px}
  .tier-btn b{font-size:10px}
  .wallet{padding:5px 4px 5px 8px}
  .wallet b{font-size:14px}
}

/* 4) 竖屏一屏放下整张票，「购买」不用滚动。
      用 svh 而不是 dvh：地址栏收放不会改变 svh，
      否则每次收放都触发 resize 重画涂层，刮开的进度会被抹掉。 */
@media (orientation: portrait) and (max-width: 600px){
  body{padding:4px}
  .scene{
    display:flex;flex-direction:column;
    min-height:calc(100vh - 8px);min-height:calc(100svh - 8px);
  }
  .control-strip{flex:0 0 auto}
  .ledger{flex:0 0 auto}
  .ticket{
    /* 基础样式里的 min-height:570px 比 320x568 的整个视口还高，
       是这一档「必须滚动才够到购买键」的根因。 */
    flex:1 1 auto;min-height:0!important;
    display:flex;flex-direction:column;
  }
  .ticket-head{flex:0 0 auto}
  .ticket-body{
    flex:1 1 auto;min-height:0;
    grid-template-columns:minmax(0,1fr)!important;
    grid-template-rows:auto minmax(0,1fr);
    align-items:stretch!important;
  }
  .info-side{min-height:0}
  .scratch-side{min-height:0}
  .cloud-frame{height:100%;min-height:120px!important}
  .prize-grid{inset:14% 10%}
  .ticket-foot{flex:0 0 auto}
}
/* 矮竖屏（<=740px 高）再把标题和规则收一档，给刮奖区留面积。 */
@media (orientation: portrait) and (max-width: 600px) and (max-height: 760px){
  .ticket-head{min-height:0;gap:7px}
  .cat-word{font-size:34px}
  .dream-word{font-size:23px}
  .mascot{width:46px;height:46px;flex-basis:46px}
  .cat-svg{width:32px;height:32px}
  .rules-card{padding:8px 9px}
  .rules-title{margin-bottom:6px;padding:4px 9px;font-size:12px}
  .rules-copy{padding:0 4px 2px;font-size:11px;line-height:1.45}
  .jackpot-label{font-size:19px}
  .jackpot-value{font-size:38px}
  .jackpot-unit{font-size:14px;margin-left:6px}
  .price-stamp{padding:5px 9px;font-size:11px}
  .ticket{padding:12px 13px 11px}
  .ticket-foot{margin-top:9px;gap:8px}
  .result{min-height:38px;padding:6px 11px;font-size:12px}
  .buy-btn,.reveal-btn{min-height:44px}
}

/* 5) 横屏：info-side 原来 overflow:auto，票价印章被裁在下沿。
      改成不裁切，并按高度把头奖收小。 */
@media (orientation: landscape) and (max-height: 520px){
  .info-side{overflow:visible!important;justify-content:flex-start}
  .jackpot-block{margin:0;padding-left:4px}
  .jackpot-label{font-size:clamp(12px,3.4vh,16px)}
  .jackpot-value{font-size:clamp(21px,6.4vh,30px)}
  .jackpot-unit{font-size:clamp(11px,2.8vh,14px);margin-left:5px}
  .price-stamp{align-self:flex-start;padding:4px 9px;font-size:10px}
  .cat-word{font-size:clamp(19px,7vh,28px)}
  .dream-word{font-size:clamp(13px,4.6vh,18px)}
}
@media (orientation: landscape) and (max-height: 430px){
  /* 430px 高以下，标题那一行只剩被描边糊住的一条黑边，收掉换刮奖面积。
     票价在顶部票档按钮上已经写着了，印章也一起收。
     头奖金额没有别处显示，留下来。 */
  .ticket-head,.series-mark,.price-stamp{display:none!important}
  .info-side{grid-template-columns:minmax(0,1fr)!important}
  .rules-card{grid-row:auto}
  .jackpot-block{grid-column:1!important;grid-row:auto!important}
  .jackpot-label{font-size:clamp(11px,3vh,14px)}
  .jackpot-value{font-size:clamp(19px,5.6vh,26px)}
  .jackpot-unit{font-size:11px;margin-left:4px}
}
@media (orientation: landscape) and (max-height: 300px){
  .jackpot-block{display:none!important}
}

/* 6) 触摸目标：音乐键和票档键原来只有 21~34px 高。 */
.scratch-audio-dock button,.reveal-btn,.win-close{position:relative}
.scratch-audio-dock button:after,.win-close:after{
  content:"";position:absolute;left:50%;top:50%;
  min-width:44px;min-height:44px;width:100%;height:100%;
  transform:translate(-50%,-50%);
}
@media (hover:hover) and (pointer:fine){
  .scratch-audio-dock button:after,.win-close:after{display:none}
}
@media(max-width:600px){
  .scratch-audio-dock button{height:44px}
  .reveal-btn{min-height:44px}
}
/* 横屏：票档键 34px、购买/全部刮开 36px，都不够指尖。
   标题行收掉之后腾出的高度正好补给它们。 */
@media (orientation: landscape) and (max-height: 520px){
  .tier-btn{min-height:44px}
  .scratch-audio-dock button{height:38px}
  .buy-btn,.reveal-btn{min-height:44px!important}
  .ticket-foot .result{min-height:44px}
}

/* 可读性下限：手机上被压到 9px 以下的标签抬回 9px。 */
@media(max-width:600px),(orientation:landscape) and (max-height:520px){
  .wallet span{font-size:9px}
  .mini-title{font-size:10px}
  .stat small{font-size:9px}
  .history-row{font-size:10px}
  .odds{font-size:10px}
  .empty-cloud span{font-size:10px}
}
</style>

function renderTicket(){const tk=state.currentTicket;if(!tk){const t=tier();appearance(t);E.empty.hidden=false;E.grid.hidden=true;E.canvas.hidden=true;E.canvas.classList.remove('cleared');E.result.className='result';E.result.textContent='\u9009\u62e9\u7968\u6863\uff0c\u7136\u540e\u8d2d\u4e70\u4e00\u5f20\u5f69\u7968';E.reveal.disabled=true;E.buy.disabled=state.balance<t.price;return}const t=tier(tk.tierId);appearance(t);E.empty.hidden=true;E.grid.hidden=false;const rows=[tk.cells.slice(0,2),tk.cells.slice(2,6),tk.cells.slice(6,10),tk.cells.slice(10,12)];E.grid.innerHTML=rows.map(row=>`<div class="prize-row${row.length===2?' short':''}">${row.map(c=>`<div class="prize-cell${c.paw?' paw-cell':''}">${iconHtml(c)}<span class="prize-amount">${fm(c.amount)}</span></div>`).join('')}</div>`).join('');E.canvas.hidden=false;E.reveal.disabled=!!tk.settled;E.buy.disabled=!tk.settled||state.balance<tier().price;if(tk.settled){E.canvas.classList.add('cleared');renderResult(tk)}else{E.canvas.classList.remove('cleared');E.result.className='result';E.result.textContent='\u5f69\u7968\u5df2\u51c6\u5907\u597d\uff0c\u7528\u9f20\u6807\u6216\u624b\u6307\u522e\u5f00\u7070\u8272\u533a\u57df';requestAnimationFrame(drawFoil)}}
function renderResult(tk){if(tk.payout>0){E.result.className='result win';E.result.textContent=`发现 ${tk.paws} 枚猫爪！本张奖金 ${fm(tk.payout)}`}else{E.result.className='result lose';E.result.textContent='这场梦里没有出现猫爪，本张未中奖'}}
function renderHistory(){E.history.innerHTML=state.history.length?state.history.map(x=>{const hasPrize=money(x.payout)>0,result=hasPrize?`奖金 ${fm(x.payout)}`:'未中奖';return`<div class="history-row"><span class="history-name">${tier(x.tierId).name} · ${x.paws||0}爪</span><span class="history-cost">-${fm(x.price)}</span><span class="history-prize${hasPrize?'':' zero'}">${result}</span></div>`}).join(''):'<div style="color:var(--muted);font-size:10px;padding:18px 0;text-align:center">尚无开奖记录</div>'}
function renderStats(){const count=+state.stats.count||0,wins=+state.stats.wins||0,maxPayout=Math.max(money(state.stats.maxPayout),...state.history.map(x=>money(x.payout)));E.count.textContent=count.toLocaleString('zh-CN');E.returns.textContent=wins.toLocaleString('zh-CN');E.winRate.textContent=count?((wins/count)*100).toFixed(1)+'%':'0%';E.maxPayout.textContent=fm(maxPayout);E.spent.textContent=fm(state.stats.spent);E.paid.textContent=fm(state.stats.paid)}
function render(){renderTiers();renderFortune();renderOdds();renderBalance();renderTicket();renderHistory();renderStats()}
function selectTier(id){if(!TIERS.some(t=>t.id===id))return;if(state.currentTicket&&!state.currentTicket.settled){toast('请先刮开当前梦境券');return}selected=id;state.currentTicket=null;save();renderTiers();renderTicket()}
function buy(){const t=tier();if(state.currentTicket&&!state.currentTicket.settled){toast('请先刮开当前梦境券');return}if(state.balance<t.price){toast(`角色资金还差 ${fm(t.price-state.balance)}`);return}const before=state.balance;state.balance=money(state.balance-t.price);state.currentTicket=newTicket(t);state.stats.count=(+state.stats.count||0)+1;state.stats.spent=money((+state.stats.spent||0)+t.price);save();render();emit('airp-scratch:transaction',{kind:'purchase',tierId:t.id,ticketId:state.currentTicket.id,delta:-t.price,before,after:state.balance})}
function quickReveal(){if(!state.currentTicket||state.currentTicket.settled)return false;settle('quick-reveal');return true}
 function settle(source='scratch'){const tk=state.currentTicket;if(!tk||tk.settled)return;const before=state.balance;tk.settled=true;state.balance=money(state.balance+tk.payout);const net=money(tk.payout-tk.price),hasReturn=tk.payout>0,profitable=net>0,breakEven=net===0,result=profitable?'profit':breakEven?'break-even':hasReturn?'partial-loss':'loss';if(hasReturn)state.stats.wins=(+state.stats.wins||0)+1;if(profitable)state.stats.profitWins=(+state.stats.profitWins||0)+1;else if(breakEven)state.stats.breakEven=(+state.stats.breakEven||0)+1;state.stats.paid=money((+state.stats.paid||0)+tk.payout);state.stats.maxPayout=Math.max(money(state.stats.maxPayout),tk.payout);state.history.unshift({tierId:tk.tierId,ticketId:tk.id,price:tk.price,payout:tk.payout,net,result,paws:tk.paws,timestamp:Date.now()});state.history=state.history.slice(0,LIMIT);save();E.canvas.classList.add('cleared');renderBalance();renderHistory();renderStats();renderResult(tk);E.reveal.disabled=true;E.buy.disabled=state.balance<tier().price;if(hasReturn){toast(`${tk.paws}枚猫爪，奖金 ${fm(tk.payout)}`);showWinModal(tk)}emit('airp-scratch:settled',{source,tierId:tk.tierId,ticketId:tk.id,price:tk.price,payout:tk.payout,net,result,hasReturn,profitable,breakEven,paws:tk.paws,multiplier:tk.multiplier,delta:tk.payout,before,after:state.balance})}
function cloudPath(c,w,h){c.beginPath();c.moveTo(.12*w,.18*h);c.bezierCurveTo(.08*w,.08*h,.18*w,.02*h,.27*w,.08*h);c.bezierCurveTo(.33*w,0,.43*w,.02*h,.49*w,.09*h);c.bezierCurveTo(.57*w,.01*h,.68*w,.02*h,.73*w,.09*h);c.bezierCurveTo(.84*w,.04*h,.95*w,.10*h,.94*w,.22*h);c.bezierCurveTo(w,.28*h,.99*w,.39*h,.94*w,.45*h);c.bezierCurveTo(w,.53*h,.98*w,.66*h,.91*w,.70*h);c.bezierCurveTo(.94*w,.82*h,.82*w,.91*h,.72*w,.86*h);c.bezierCurveTo(.65*w,.98*h,.53*w,.94*h,.48*w,.88*h);c.bezierCurveTo(.38*w,.98*h,.28*w,.91*h,.25*w,.83*h);c.bezierCurveTo(.13*w,.88*h,.04*w,.80*h,.08*w,.68*h);c.bezierCurveTo(0,.61*h,.01*w,.49*h,.07*w,.44*h);c.bezierCurveTo(0,.35*h,.03*w,.23*h,.12*w,.18*h);c.closePath()}
function countOpaque(c,w,h){const d=c.getImageData(0,0,w,h).data,step=32;let n=0;for(let p=0;p<w*h;p+=step)if(d[p*4+3]>=64)n++;return n}
function drawFoil(){const tk=state.currentTicket;if(!tk||tk.settled||E.canvas.hidden)return;const r=E.scratch.getBoundingClientRect();if(r.width<=0)return;const d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);E.canvas.width=w;E.canvas.height=h;E.canvas.style.width=r.width+'px';E.canvas.style.height=r.height+'px';const c=E.canvas.getContext('2d',{willReadFrequently:true});c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,r.width,r.height);c.save();cloudPath(c,r.width,r.height);c.clip();const style=getComputedStyle(E.ticket),cv=(n,f)=>style.getPropertyValue(n).trim()||f,g=c.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,cv('--foil-1','#8b8b8f'));g.addColorStop(.32,cv('--foil-2','#5f6065'));g.addColorStop(.55,cv('--foil-3','#929296'));g.addColorStop(.78,cv('--foil-4','#55565d'));g.addColorStop(1,cv('--foil-5','#85858a'));c.fillStyle=g;c.fillRect(0,0,r.width,r.height);c.globalAlpha=.22;for(let i=0;i<150;i++){c.strokeStyle=i%2?cv('--foil-text','#fff'):cv('--foil-line','#16161d');c.lineWidth=rf()*1.1+.2;const x=rf()*r.width,y=rf()*r.height;c.beginPath();c.moveTo(x,y);c.lineTo(x+18+rf()*55,y-8+rf()*12);c.stroke()}c.globalAlpha=.5;c.strokeStyle=cv('--foil-line','#22222d');c.lineWidth=1.4;c.setLineDash([6,5]);const scratchRect=E.scratch.getBoundingClientRect();E.grid.querySelectorAll('.prize-cell').forEach(cell=>{const box=cell.getBoundingClientRect(),x=box.left-scratchRect.left,y=box.top-scratchRect.top;c.strokeRect(x,y,box.width,box.height)});c.setLineDash([]);c.globalAlpha=.83;c.fillStyle=cv('--foil-text','#e7e4e9');c.textAlign='center';c.textBaseline='middle';c.font=`1000 ${Math.max(17,Math.min(28,r.width/22))}px system-ui`;c.fillText('\u627e\u5230\u732b\u722a\u5373\u53ef\u83b7\u5f97\u5956\u91d1',r.width/2,r.height/2+23);c.restore();opaqueBase=countOpaque(E.canvas.getContext('2d',{willReadFrequently:true}),w,h)}
function point(e){const r=E.canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(r.width,e.clientX-r.left)),y:Math.max(0,Math.min(r.height,e.clientY-r.top))}}
function scratchLine(x1,y1,x2,y2){const tk=state.currentTicket;if(!tk||tk.settled)return;const r=E.canvas.getBoundingClientRect(),d=E.canvas.width/Math.max(1,r.width),c=E.canvas.getContext('2d',{willReadFrequently:true}),width=Math.max(28,Math.min(48,r.width/13));c.save();c.setTransform(d,0,0,d,0,0);c.globalCompositeOperation='destination-out';c.lineCap=c.lineJoin='round';c.lineWidth=width;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.beginPath();c.arc(x2,y2,width/2,0,Math.PI*2);c.fill();c.restore()}
function clearedRatio(){if(!opaqueBase)return 0;const c=E.canvas.getContext('2d',{willReadFrequently:true}),now=countOpaque(c,E.canvas.width,E.canvas.height);return Math.max(0,1-now/opaqueBase)}
function down(e){if(!state.currentTicket||state.currentTicket.settled)return;e.preventDefault();const p=point(e);pointer={down:true,x:p.x,y:p.y,moves:0};try{E.canvas.setPointerCapture(e.pointerId)}catch(_){}scratchLine(p.x,p.y,p.x+.1,p.y+.1)}
function move(e){if(!pointer.down)return;e.preventDefault();const p=point(e);scratchLine(pointer.x,pointer.y,p.x,p.y);pointer.x=p.x;pointer.y=p.y;if(++pointer.moves%10===0&&clearedRatio()>=THRESHOLD){pointer.down=false;settle()}}
function up(e){if(!pointer.down)return;pointer.down=false;try{E.canvas.releasePointerCapture(e.pointerId)}catch(_){}if(clearedRatio()>=THRESHOLD)settle()}
function setBalance(v,opt={}){const next=money(v,state.balance);if(next<0)return false;const before=state.balance;state.balance=next;save();renderBalance();E.buy.disabled=!!(state.currentTicket&&!state.currentTicket.settled)||state.balance<tier().price;if(!opt.silent)emit('airp-scratch:balance-set',{before,after:next,delta:money(next-before)});return true}
function reset(opt={}){const balance=opt.keepBalance?state.balance:DEFAULT_BALANCE;state=fresh();state.balance=balance;selected=TIERS[0].id;save();render();emit('airp-scratch:reset',{keepBalance:!!opt.keepBalance})}
function theme(v){document.body.dataset.theme=THEMES.has(v)?v:'dark'}
function initTheme(){let v='dark';try{const s=localStorage.getItem('kivotos-theme')||localStorage.getItem('theme');if(THEMES.has(s))v=s;const p=parent!==window&&parent.document?.body?.dataset?.theme;if(THEMES.has(p))v=p}catch(_){}theme(v)}
E.winAccept.onclick=hideWinModal;E.winClose.onclick=hideWinModal;E.winOverlay.addEventListener('click',e=>{if(e.target===E.winOverlay)hideWinModal()});addEventListener('keydown',e=>{if(e.key==='Escape'&&!E.winOverlay.hidden)hideWinModal()});E.music.onclick=()=>setMusicEnabled(!audioPrefs.music);document.addEventListener('pointerdown',unlockAudio,{once:true,capture:true});document.addEventListener('keydown',unlockAudio,{once:true});
E.buy.onclick=buy;E.reveal.onclick=quickReveal;E.canvas.onpointerdown=down;E.canvas.onpointermove=move;E.canvas.onpointerup=up;E.canvas.onpointercancel=up;E.canvas.oncontextmenu=e=>e.preventDefault();addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(state.currentTicket&&!state.currentTicket.settled)drawFoil()},120)});addEventListener('storage',e=>{if([WALLET_KEY,SLOT_KEY,FISH_KEY].includes(e.key)){const next=readSharedBalance();if(Number.isFinite(next)){state.balance=next;renderBalance();E.buy.disabled=!!(state.currentTicket&&!state.currentTicket.settled)||state.balance<tier().price}}if(e.key===FORTUNE_KEY){renderFortune();renderOdds()}});
addEventListener('message',e=>{const d=e.data||{};if(d.type==='kivotos-theme-change'||d.type==='airp-scratch:set-theme')theme(d.theme);if(d.type==='airp-scratch:set-balance')setBalance(d.balance,{silent:true});if(d.type==='airp-scratch:reset-command')reset({keepBalance:d.keepBalance===true})});
window.AIRPScratchCard=Object.freeze({version:VERSION,getBalance:()=>state.balance,setBalance,getState:()=>JSON.parse(JSON.stringify(state)),getRtp:currentRtp,getTiers:()=>TIERS.map(t=>({...t,metrics:effectiveMetrics(t)})),selectTier,buy,reveal:()=>settle('api'),reset});
initTheme();syncAudioUI();render();emit('airp-scratch:ready',{rtp:currentRtp(),tiers:TIERS.map(t=>({id:t.id,name:t.name,price:t.price,...effectiveMetrics(t)}))});
})();
