<style id="mobile-fit-pass">
/* ------------------------------------------------------------------ *
 * 手机适配收尾。原来的问题：
 *   1) 「直播幸运机」在手机上是一团黑     字号收到 16~22px，描边还是 2~4px，
 *                                        描边画在填充之上，笔画被自己糊平。
 *   2) 竖屏转轮压到 46px，屏幕下方却空着  压缩规则绑在 max-height:760px 上，
 *                                        740px 高的机器全中招。
 *   3) 横屏转轮被裁掉一截                 reel 的 1fr 没有确定高度可参照，
 *                                        解析成 max-content 就撑出去了。
 *   4) 320px 宽时 ¥500 筹码盖住「启动转轮」
 *   5) 灯带压住「余额」，中奖线标签露在柜体外
 * ------------------------------------------------------------------ */

/* 1) 描边先画、填充后画；手机上描边宽度跟着字号走。 */
.marquee-title{paint-order:stroke fill}
@media(max-width:720px),(orientation:landscape) and (max-height:520px){
  .marquee-title{-webkit-text-stroke-width:.055em}
}

/* 2+3) 一条 flex 链，从 body 一直传到 reel。
        只有每一层都是「确定高度的 flex 项」，
        reel 里的 minmax(0,1fr) 才有东西可以除。 */
@media (orientation: portrait) and (max-width: 640px),
       (max-width: 480px) and (orientation: portrait) {
  body{padding:3px!important}
  .arcade-stage{
    min-height:calc(100vh - 6px);min-height:calc(100svh - 6px);
    display:flex;flex-direction:column;
    padding:7px 8px 8px!important;
  }
  /* min-height 只能让柜体长满一屏，不能逼它收进一屏 —— 弹性项要收缩
     需要一个确定的上界。抽屉展开时这个上界就该让开，所以绑在 :has 上。 */
  .arcade-stage:has(.info-drawer:not([open])){
    max-height:calc(100vh - 6px);max-height:calc(100svh - 6px);
  }
  .slot-cabinet{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .info-drawer{flex:0 0 auto;display:block!important;margin-top:8px}

  .cabinet-marquee,.jackpot-lamps,.score-panel,.control-deck,.cabinet-footer{flex:0 0 auto}
  .machine-face{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .reel-bezel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .reel-window{flex:1 1 auto;min-height:0}
  .reel{grid-template-rows:repeat(3,minmax(42px,1fr))!important}

  /* 有了余量就不必把转轮压到最小，图案跟着格子长。 */
  .symbol-art{width:clamp(34px,12vw,58px);height:clamp(32px,11.5vw,55px)}
  .symbol-placeholder{width:clamp(30px,10vw,48px);height:clamp(30px,10vw,48px)}
  .symbol-name{display:block;font-size:8px}
  .cabinet-footer{display:block!important;margin:6px 8px 10px;padding:7px 10px}
  .footer-status{font-size:11px}
  .footer-sub{font-size:8px}
  /* 招牌是 overflow:hidden 的，标题的双层投影原来按桌面的 4px/8px 偏移
     画，在 27px 高的招牌里上下都被切掉。投影和内边距一起收。 */
  .cabinet-marquee{padding:7px 8px 9px!important}
  .marquee-title{
    font-size:clamp(20px,7vw,30px)!important;line-height:1.25;
    text-shadow:2px 3px 0 #55dfe3,4px 5px 0 #19152c;
  }
}
@media (orientation: portrait) and (max-width: 640px) and (max-height: 620px){
  /* 真的很矮的机器（横屏折叠、老 SE）才收掉次要信息。 */
  .cabinet-footer{display:none!important}
  .symbol-name{display:none}
}

@media (orientation: landscape) and (max-height: 480px) {
  .machine-face{display:flex;flex-direction:column}
  .reel-bezel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .reel-window{flex:1 1 auto;min-height:0}
  .reel{grid-template-rows:repeat(3,minmax(0,1fr))!important}
  .symbol-art{width:clamp(24px,7vh,42px);height:clamp(22px,6.6vh,40px)}
  .symbol-placeholder{width:clamp(20px,6vh,36px);height:clamp(20px,6vh,36px)}

  /* 招牌只有一条，标题居中就会被右上角的声音坞压住。
     标题左对齐、右边留出坞的宽度，并把福运徽标收掉。 */
  .slot-fortune-badge{display:none!important}
  .cabinet-marquee{text-align:left;padding:5px 8px 7px!important}
  /* 招牌只剩 41px 高，inset:5px 的虚线内框正好横穿标题。
     招牌本身还有霓虹描边，去掉这层内框不影响观感。 */
  .cabinet-marquee:after{display:none}
  .marquee-title{
    padding-left:6px;padding-right:104px;
    line-height:1.3;letter-spacing:-.02em;
    text-shadow:2px 3px 0 #55dfe3,3px 4px 0 #19152c;
  }
  /* 「选择筹码」原来压在筹码上；「投币区/代币已连接」在 720px 以上宽度
     才显示，横屏手机正好落在这一档，把操作区挤成三栏。 */
  .chip-caption{display:none!important}
  .credit-slot{display:none!important}
  .control-deck{grid-template-columns:minmax(0,1fr) auto!important}
}

/* 4) 筹码槽横向滚动，不再溢出到「启动转轮」上。
      顶部留白是给选中筹码抬起的 5px 和 6px 描边环的，
      padding 在滚动盒之内，所以不会被裁掉。 */
@media(max-width:640px){
  .chip-rack{
    overflow-x:auto;overflow-y:hidden;
    padding:13px 8px 4px;margin-top:-8px;
    scrollbar-width:none;
  }
  .chip-rack::-webkit-scrollbar{display:none}
}

/* 5) 窄屏收窄灯带、收掉中奖线标签，它们原来盖在「余额」和柜体外沿上。 */
@media(max-width:470px){
  .slot-cabinet:before,.slot-cabinet:after{width:11px;top:74px;bottom:18px}
  .slot-cabinet:before{left:3px}
  .slot-cabinet:after{right:3px}
}
/* 「中奖线」竖排标签是 8px 的，横屏也一样露在柜体外边，一律收掉；
   中奖线本身有那条发光横条表示。 */
@media(max-width:470px),(orientation:landscape) and (max-height:520px){
  .payline-label{display:none}
}

/* 6) 触摸目标。音乐/音效键只有 21~25px 高，筹码最小 30px。
      用 ::after 把命中区撑到 44px，绘制尺寸不动 ——
      筹码是排成一列的圆片，真放大成 44px 就挤出滚动条了。 */
.audio-dock button,.chip-btn{position:relative}
.audio-dock button:after{
  content:"";position:absolute;left:50%;top:50%;
  min-width:44px;min-height:44px;width:100%;height:100%;
  transform:translate(-50%,-50%);
}
/* 筹码只撑高不撑宽：横向撑开会和相邻筹码的命中区重叠，容易点错。 */
.chip-btn:after{
  content:"";position:absolute;left:0;right:0;top:50%;
  min-height:44px;height:100%;
  transform:translateY(-50%);
}
@media (hover:hover) and (pointer:fine){
  .audio-dock button:after,.chip-btn:after{display:none}
}
@media(max-width:720px){
  .push-spin{min-height:46px}
}

/* 7) 可读性下限。手机上这些标签被压到 6~8px —— 汉字到这个尺寸
      只剩一团灰，不如换成图标或者抬回 9px。 */
@media(max-width:720px),(orientation:landscape) and (max-height:520px){
  /* 「♫ 音乐」在 6px 下完全读不出来，改成纯图标。 */
  .audio-dock button{
    min-width:40px;height:30px;padding:0;
    font-size:0;letter-spacing:0;
  }
  .audio-dock button:before{font-size:15px;line-height:1}
  #slotMusicToggle:before{content:"♫"}
  #slotSfxToggle:before{content:"◉"}

  .jackpot-lamp small{font-size:9px}
  .score-cell small{font-size:9px}
  .footer-sub{font-size:9px}
  .symbol-name{font-size:9px}
  .chip-caption{font-size:9px}
  .bet-display small,.credit-copy small{font-size:9px}
  .info-drawer summary{font-size:11px}
  .drawer-title{font-size:10px}
  .drawer-title span{font-size:9px}
  .stat small{font-size:9px}
  .symbol-item span,.symbol-item b{font-size:9px}
  .history-row{font-size:10px}
  /* 筹码上的金额原来 9px，是玩家唯一能确认下注额的地方。 */
  .chip-btn span{font-size:11px}
}
@media (orientation: portrait) and (max-width: 640px){
  .chip-btn{width:40px!important;height:40px!important;flex-basis:40px!important}
  .chip-btn:before{inset:6px}
  /* 5 枚 40px 筹码和「启动转轮」并排放不进 360px，第 5 枚会被滚到看不见
     —— 和票档藏起来是同一类问题。竖屏有富余高度，改成上下两行：
     筹码整行摊开，转轮键整行铺满，两个都变大。 */
  .control-deck{
    grid-template-columns:minmax(0,1fr)!important;
    row-gap:8px;
  }
  .chip-area{grid-column:1}
  .push-spin{grid-column:1;width:100%;min-width:0}

@media (orientation: landscape) and (max-height: 480px){
  .chip-btn{width:34px!important;height:34px!important;flex-basis:34px!important}
  .chip-btn:before{inset:5px}
  .chip-btn span{font-size:10px}
}

<script>

const $=id=>document.getElementById(id),E={cabinet:$('slotCabinet'),machine:$('machineFace'),reels:$('reelWindow'),credit:$('creditDisplay'),score:$('scoreMessage'),bet:$('betTop'),mini:$('jpMini'),major:$('jpMajor'),mega:$('jpMega'),chips:$('chipRack'),push:$('pushSpin'),lever:$('leverUnit'),leverArm:$('leverArm'),leverKnob:$('leverKnob'),status:$('footerStatus'),history:$('history'),count:$('statCount'),returns:$('statReturns'),winRate:$('statWinRate'),maxPayout:$('statMaxPayout'),spent:$('statSpent'),paid:$('statPaid'),symbolGrid:$('symbolGrid'),toast:$('cabinetToast'),fortune:$('slotFortuneBadge'),music:$('slotMusicToggle'),sfx:$('slotSfxToggle')};
let arcadeProfile={已解锁:{}},state=load(),spinning=false,currentGrid=createIdleGrid(),toastTimer=0,leverDrag=false,leverStartY=0,leverProgress=0,leverMoved=false;
const BGM_TRACKS=["https://cdn1.suno.ai/8d02bddc-e04b-4cd1-9095-e28b37919ac9.mp3","https://cdn1.suno.ai/99f10a76-d569-44c9-b7c5-8e472985765d.mp3"];const SFX_AUDIO={"lever":"assets/games/slots-lever.mp3","reelSpin":"assets/games/slots-reelspin.mp3","reelStop":"assets/games/slots-reelstop.mp3","lose":"assets/games/slots-lose.mp3","smallWin":"assets/games/slots-smallwin.mp3","win":"assets/games/slots-win.mp3","bigWin":"assets/games/slots-bigwin.mp3","superWin":"assets/games/slots-superwin.mp3","noCredit":"assets/games/slots-nocredit.mp3","chip":"assets/games/slots-chip.mp3"};
const AUDIO_PREF_KEY='airp_slot_audio_v1';let audioPrefs=loadAudioPrefs(),audioUnlocked=false,bgmIndex=0,bgmErrors=0,spinAudio=null,leverAudio=null;const bgmAudio=new Audio();bgmAudio.preload='auto';bgmAudio.volume=1;bgmAudio.setAttribute('playsinline','');
function loadAudioPrefs(){try{return{music:true,sfx:true,...JSON.parse(localStorage.getItem(AUDIO_PREF_KEY)||'null')}}catch(_){return{music:true,sfx:true}}}function saveAudioPrefs(){try{localStorage.setItem(AUDIO_PREF_KEY,JSON.stringify(audioPrefs))}catch(_){}}function syncAudioUI(){E.music.setAttribute('aria-pressed',String(audioPrefs.music));E.music.textContent=audioPrefs.music?'♫ 音乐':'♫ 静音';E.sfx.setAttribute('aria-pressed',String(audioPrefs.sfx));E.sfx.textContent=audioPrefs.sfx?'◉ 音效':'○ 音效'}function setBgmTrack(i){bgmIndex=(i+BGM_TRACKS.length)%BGM_TRACKS.length;bgmAudio.src=BGM_TRACKS[bgmIndex];bgmAudio.load()}function playBgm(){if(!audioUnlocked||!audioPrefs.music)return;if(!bgmAudio.src)setBgmTrack(bgmIndex);bgmAudio.volume=1;const p=bgmAudio.play();if(p&&p.catch)p.catch(()=>{})}function nextBgm(){setBgmTrack(bgmIndex+1);playBgm()}function unlockAudio(){audioUnlocked=true;playBgm()}function playSfx(name,volume=.72,loop=false){if(!audioPrefs.sfx||!SFX_AUDIO[name])return null;const a=new Audio(SFX_AUDIO[name]);a.volume=Math.max(0,Math.min(1,volume));a.loop=loop;a.play().catch(()=>{});return a}function stopAudio(a){if(!a)return;try{a.pause();a.currentTime=0}catch(_){}}function winSfx(m){playSfx(m>=1000?'superWin':m>=100?'bigWin':m>=10?'win':'smallWin',.86)}function setMusicEnabled(v){audioPrefs.music=!!v;saveAudioPrefs();syncAudioUI();if(audioPrefs.music){audioUnlocked=true;playBgm()}else bgmAudio.pause()}function setSfxEnabled(v){audioPrefs.sfx=!!v;saveAudioPrefs();syncAudioUI();if(!audioPrefs.sfx){stopAudio(spinAudio);stopAudio(leverAudio)}}bgmAudio.addEventListener('ended',()=>{bgmErrors=0;nextBgm()});bgmAudio.addEventListener('canplay',()=>{if(audioUnlocked&&audioPrefs.music)bgmAudio.play().catch(()=>{})});bgmAudio.addEventListener('error',()=>{if(audioUnlocked&&audioPrefs.music&&++bgmErrors<BGM_TRACKS.length)nextBgm()});

function fresh(){return{version:VERSION,balance:DEFAULT_BALANCE,betIndex:0,history:[],stats:{count:0,wins:0,profitWins:0,breakEven:0,spent:0,paid:0,maxPayout:0}}}
function money(v,f=0){v=Number(v);return Number.isFinite(v)?Math.round(v*100)/100:f}
function readJSON(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch(_){return null}}
const FORTUNE_RTP={great_misfortune:.94,misfortune:.96,small_luck:.98,middle_luck:1,upper_luck:1.02,great_luck:1.04,'\u5e73':.94,'\u672b\u5409':.96,'\u5c0f\u5409':.98,'\u4e2d\u5409':1,'\u4e0a\u5409':1.02,'\u5927\u5409':1.04};
function dateKey(){const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function currentFortune(){const x=readJSON(FORTUNE_KEY);return x&&x.date===dateKey()&&(FORTUNE_RTP[x.tierId]!=null||FORTUNE_RTP[x.tierName]!=null||Number.isFinite(+x.rtp))?x:null}
function currentRtp(){const x=currentFortune();if(!x)return DEFAULT_RTP;const mapped=FORTUNE_RTP[x.tierId]??FORTUNE_RTP[x.tierName]??Number(x.rtp);return Math.max(MIN_RTP,Math.min(MAX_RTP,mapped))}
function readSharedBalance(){const w=readJSON(WALLET_KEY);if(w&&Number.isFinite(+w.balance))return money(w.balance,DEFAULT_BALANCE);for(const key of [FISH_KEY,SCRATCH_KEY,KEY]){const x=readJSON(key);if(x&&Number.isFinite(+x.balance))return money(x.balance,DEFAULT_BALANCE)}return DEFAULT_BALANCE}
function writeSharedBalance(value){value=money(value);try{localStorage.setItem(WALLET_KEY,JSON.stringify({balance:value,updatedAt:Date.now(),source:'slot'}));for(const key of [FISH_KEY,SCRATCH_KEY]){const x=readJSON(key);if(x&&typeof x==='object'){x.balance=value;localStorage.setItem(key,JSON.stringify(x))}}}catch(_){}return value}
function load(){const f=fresh();try{const p=JSON.parse(localStorage.getItem(KEY)||'null');if(!p)return{...f,balance:readSharedBalance()};return{...f,...p,version:VERSION,balance:readSharedBalance(),betIndex:Math.max(0,Math.min(BETS.length-1,Number(p.betIndex)||0)),history:Array.isArray(p.history)?p.history.slice(0,HISTORY_LIMIT):[],stats:{...f.stats,...(p.stats||{})}}}catch(e){return f}}
function save(){state.version=VERSION;state.balance=money(state.balance);try{localStorage.setItem(KEY,JSON.stringify(state));writeSharedBalance(state.balance)}catch(e){}}
function fm(v,plus=false){v=money(v);const a=Math.abs(v),d=Number.isInteger(a)?0:2;return(v<0?'-¥':plus&&v>0?'+¥':'¥')+a.toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:2})}
function ri(limit){if(!Number.isSafeInteger(limit)||limit<=0)throw RangeError('bad random limit');if(!globalThis.crypto||!crypto.getRandomValues)return Math.floor(Math.random()*limit);const range=0x100000000,max=range-range%limit,a=new Uint32Array(1);do crypto.getRandomValues(a);while(a[0]>=max);return a[0]%limit}
function pick(arr){return arr[ri(arr.length)]}
function isUnlocked(id){return !!arcadeProfile?.已解锁?.[id]}
function activeIds(){return SYMBOLS.filter(x=>x.pool!==false&&(!x.unlock||isUnlocked(x.unlock))).map(x=>x.id)}
function setProfile(value){arcadeProfile=value&&typeof value==='object'?value:{已解锁:{}};renderSymbols()}
function pickMysteryTarget(){const total=MYSTERY_TARGETS.reduce((a,x)=>a+x.w,0);let roll=ri(total);for(const x of MYSTERY_TARGETS){if(roll<x.w)return x;roll-=x.w}return MYSTERY_TARGETS[0]}
function rollMilestoneOutcome(){if(isUnlocked('slot_golden_grape')&&ri(100000)<250)return{kind:'gold-grape',symbol:'gold-grape',multiplier:3};if(isUnlocked('slot_mystery_cloud')&&ri(100000)<500){const target=pickMysteryTarget();return{kind:'mystery',symbol:target.id,multiplier:target.m}}return null}
function drawOutcome(positiveOnly=false){const pool=positiveOnly?OUTCOMES.filter(x=>x.m>0):OUTCOMES,total=pool.reduce((s,x)=>s+x.w,0);let roll=ri(total);for(const x of pool){if(roll<x.w)return x.m;roll-=x.w}return 0}
function weightedOutcome(){const target=currentRtp();if(target<POOL_RTP&&ri(1000000)>=Math.round(target/POOL_RTP*1000000))return 0;let result=drawOutcome();if(target>POOL_RTP&&result===0){const zero=OUTCOMES.find(x=>x.m===0)?.w||0,positive=OUTCOMES.reduce((sum,x)=>sum+(x.m>0?x.w:0),0),retry=zero>0?(target-POOL_RTP)*positive/(POOL_RTP*zero):0;if(ri(1000000)<Math.round(retry*1000000))result=drawOutcome(true)}return result}
function emit(name,detail={}){const payload={...detail,version:VERSION,balance:state.balance};try{dispatchEvent(new CustomEvent(name,{detail:payload}))}catch(e){}try{if(parent&&parent!==window)parent.postMessage({type:name,detail:payload},'*')}catch(e){}}
function showToast(text){clearTimeout(toastTimer);E.toast.textContent=text;E.toast.classList.add('show');toastTimer=setTimeout(()=>E.toast.classList.remove('show'),1800)}

function createResult(multiplier,forcedId=null){const ids=activeIds(),grid=Array.from({length:3},()=>Array(3));for(let c=0;c<3;c++){grid[0][c]=pick(ids);grid[2][c]=pick(ids)}if(multiplier>0){const id=forcedId||pick(WIN_SYMBOLS[String(multiplier)]);grid[1]=[id,id,id]}else{const pool=ids.slice();while(pool.length<3)pool.push(...ids);const a=pool.splice(ri(pool.length),1)[0],b=pool.splice(ri(pool.length),1)[0],c=pool.splice(ri(pool.length),1)[0];grid[1]=[a,b,c]}return grid}
function createMysteryResult(targetId){const grid=createResult(0),line=[targetId,targetId,'mystery'];for(let i=line.length-1;i>0;i--){const j=ri(i+1);[line[i],line[j]]=[line[j],line[i]]}grid[1]=line;return grid}
function symbolMarkup(id,winner=false){const s=MAP[id]||SYMBOLS[0],classes=[winner?'winner':'',s.variant?`is-${s.variant}`:''].filter(Boolean).join(' '),art=s.variant==='mystery'?'<span class="mystery-mark">?</span>':s.art?`<img src="${s.art}" alt="${s.name}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="symbol-placeholder" style="--sc:${s.color}" hidden></span>`:`<span class="symbol-placeholder" style="--sc:${s.color}"></span>`;return `<div class="symbol-cell${classes?' '+classes:''}" data-symbol="${s.id}"><div class="symbol-art">${art}</div><span class="symbol-name">${s.name}</span></div>`}

async function resolveMystery(grid,targetId){const col=grid[1].indexOf('mystery');if(col<0)return;const reel=E.reels.querySelector(`[data-col="${col}"]`),cell=reel?.children?.[1];if(!cell)return;cell.classList.add('mystery-morph');playSfx('reelStop',.7);await wait(520);grid[1][col]=targetId;cell.outerHTML=symbolMarkup(targetId,true);reel.children[1]?.classList.add('mystery-born');markPayline();await wait(260)}
function spinColumn(col,finalGrid){return new Promise(resolve=>{const reel=E.reels.querySelector(`[data-col="${col}"]`);reel.classList.add('spinning');const timer=setInterval(()=>{const ids=activeIds(),temp=Array.from({length:3},()=>pick(ids)),grid=Array.from({length:3},(_,r)=>Array.from({length:3},(_,c)=>c===col?temp[r]:currentGrid[r][c]));renderColumn(col,grid)},58);setTimeout(()=>{clearInterval(timer);renderColumn(col,finalGrid);reel.classList.remove('spinning');reel.classList.add('stopped');playSfx('reelStop',.48);setTimeout(()=>reel.classList.remove('stopped'),230);resolve()},720+col*240)})}
function renderHeader(){const bet=BETS[state.betIndex];E.credit.textContent=fm(state.balance);E.bet.textContent=fm(bet);E.mini.textContent=fm(bet*25);E.major.textContent=fm(bet*200);E.mega.textContent=fm(bet*1000);E.push.disabled=spinning||state.balance<bet;E.lever.setAttribute('aria-disabled',spinning?'true':'false');E.chips.querySelectorAll('.chip-btn').forEach((btn,i)=>{btn.classList.toggle('selected',i===state.betIndex);btn.setAttribute('aria-pressed',String(i===state.betIndex));btn.disabled=spinning})}
function renderHistory(){E.history.innerHTML=state.history.length?state.history.map(x=>{const hasPrize=money(x.payout)>0,result=hasPrize?`奖金 ${fm(x.payout)}`:'未中奖';return`<div class="history-row"><span class="history-label">${x.label}</span><span class="history-bet">-${fm(x.bet)}</span><span class="history-win${hasPrize?'':' zero'}">${result}</span></div>`}).join(''):'<div class="empty">尚无旋转记录</div>'}
function renderStats(){const count=+state.stats.count||0,wins=+state.stats.wins||0,maxPayout=Math.max(money(state.stats.maxPayout),...state.history.map(x=>money(x.payout)));E.count.textContent=count.toLocaleString('zh-CN');E.returns.textContent=wins.toLocaleString('zh-CN');E.winRate.textContent=count?((wins/count)*100).toFixed(1)+'%':'0%';E.maxPayout.textContent=fm(maxPayout);E.spent.textContent=fm(state.stats.spent);E.paid.textContent=fm(state.stats.paid)}
function renderSymbols(){E.symbolGrid.innerHTML=SYMBOLS.map(s=>{const open=!s.unlock||isUnlocked(s.unlock),cls=open?(s.unlock?' is-unlocked':''):' is-locked',name=open?s.name:'未解锁',max=open?`${s.max}×`:'\u{1F512}';return`<div class="symbol-item${cls}" style="--c:${s.color}"><i></i><span>${name}</span><b>${max}</b></div>`}).join('')}
function renderChips(){const colors=[['#62d6c8','#173f4b'],['#7d9bf1','#fff'],['#a986e8','#fff'],['#f17db4','#fff'],['#ff816f','#fff']];E.chips.innerHTML=BETS.map((bet,i)=>`<button class="chip-btn${i===state.betIndex?' selected':''}" type="button" data-index="${i}" aria-pressed="${i===state.betIndex}" aria-label="投注 ${fm(bet)}" style="--chip:${colors[i][0]};--chip-text:${colors[i][1]}"><span>¥${bet}</span></button>`).join('');E.chips.querySelectorAll('.chip-btn').forEach(btn=>btn.onclick=()=>setBet(Number(btn.dataset.index)))}function setBet(index){if(spinning)return false;const previous=state.betIndex;state.betIndex=Math.max(0,Math.min(BETS.length-1,Number(index)||0));if(state.betIndex!==previous)playSfx('chip',.66);save();renderHeader();return true}function setBetAmount(amount){const index=BETS.indexOf(Number(amount));return index<0?false:setBet(index)}
function setLever(progress){leverProgress=Math.max(0,Math.min(1,progress));E.leverArm.style.setProperty('--pull',leverProgress.toFixed(3))}
function returnLever(){E.lever.classList.remove('dragging');setLever(0)}
function autoPull(){if(spinning)return;unlockAudio();if(!leverAudio||leverAudio.ended||leverAudio.paused)leverAudio=playSfx('lever',.58);E.lever.classList.remove('dragging');setLever(1);setTimeout(()=>{returnLever();spin()},230)}
function onLeverDown(e){if(spinning)return;unlockAudio();stopAudio(leverAudio);leverAudio=playSfx('lever',.58);e.preventDefault();leverDrag=true;leverMoved=false;leverStartY=e.clientY;E.lever.classList.add('dragging');try{E.lever.setPointerCapture(e.pointerId)}catch(err){}}
function onLeverMove(e){if(!leverDrag)return;e.preventDefault();const dy=e.clientY-leverStartY;if(Math.abs(dy)>5)leverMoved=true;setLever(dy/145)}
function onLeverUp(e){if(!leverDrag)return;leverDrag=false;try{E.lever.releasePointerCapture(e.pointerId)}catch(err){}const fired=leverProgress>=.72;if(!leverMoved){returnLever();autoPull();return}returnLever();if(fired)setTimeout(spin,120);else{stopAudio(leverAudio);leverAudio=null}}
async function spin(){if(spinning)return;stopAudio(leverAudio);leverAudio=null;const bet=BETS[state.betIndex];if(state.balance<bet){playSfx('noCredit',.8);showToast('角色资金不足');E.score.textContent='余额不足';return}unlockAudio();stopAudio(spinAudio);spinAudio=playSfx('reelSpin',.55,true);spinning=true;E.machine.classList.remove('win-flash');E.score.textContent='旋转中';E.status.textContent='机械转轮正在加速…';const before=state.balance;state.balance=money(state.balance-bet);state.stats.count=(+state.stats.count||0)+1;state.stats.spent=money((+state.stats.spent||0)+bet);save();renderHeader();emit('airp-slot:transaction',{kind:'bet',bet,delta:-bet,before,after:state.balance});const baseMultiplier=weightedOutcome(),special=baseMultiplier===0?rollMilestoneOutcome():null,multiplier=special?.multiplier??baseMultiplier,finalGrid=special?.kind==='mystery'?createMysteryResult(special.symbol):createResult(multiplier,special?.symbol||null);await Promise.all([0,1,2].map(c=>spinColumn(c,finalGrid)));stopAudio(spinAudio);spinAudio=null;if(special?.kind==='mystery')await resolveMystery(finalGrid,special.symbol);currentGrid=finalGrid;const payout=money(bet*multiplier),net=money(payout-bet),hasReturn=payout>0,profitable=net>0,breakEven=net===0;if(hasReturn){state.balance=money(state.balance+payout);state.stats.wins=(+state.stats.wins||0)+1;if(profitable)state.stats.profitWins=(+state.stats.profitWins||0)+1;else if(breakEven)state.stats.breakEven=(+state.stats.breakEven||0)+1;state.stats.paid=money((+state.stats.paid||0)+payout);state.stats.maxPayout=Math.max(money(state.stats.maxPayout),payout);if(special?.kind==='mystery')markPayline();else renderGrid(currentGrid,true);E.machine.classList.add('win-flash');E.score.textContent=fm(payout);const specialText=special?.kind==='mystery'?'云雾问号变形':special?.kind==='gold-grape'?'黄金葡萄':'中央中奖线命中';E.status.textContent=`${specialText} · ${multiplier}× · 本轮奖金 ${fm(payout)}`;showToast(`${specialText} · ${fm(payout)}`);winSfx(multiplier);setTimeout(()=>E.machine.classList.remove('win-flash'),2100)}else{playSfx('lose',.68);renderGrid(currentGrid,false);E.score.textContent='未中奖';E.status.textContent='本轮没有形成三个相同图案'}const result=profitable?'profit':breakEven?'break-even':hasReturn?'partial-loss':'loss',label=hasReturn?`${special?.kind==='mystery'?'云雾问号 → ':''}${MAP[finalGrid[1][0]].name} · ${multiplier}×`:'未中奖';state.history.unshift({bet,payout,net,multiplier,result,special:special?.kind||null,label,time:Date.now()});state.history=state.history.slice(0,HISTORY_LIMIT);save();renderHistory();renderStats();emit('airp-slot:settled',{bet,payout,net,multiplier,result,symbol:finalGrid[1][0],special:special?.kind||null,hasReturn,profitable,breakEven,delta:payout,balance:state.balance});spinning=false;renderHeader()}
function setBalance(v,opt={}){const next=money(v,state.balance);if(next<0)return false;const before=state.balance;state.balance=next;save();renderHeader();if(!opt.silent)emit('airp-slot:balance-set',{before,after:next,delta:money(next-before)});return true}
function reset(opt={}){const balance=opt.keepBalance?state.balance:DEFAULT_BALANCE;state=fresh();state.balance=balance;spinning=false;stopAudio(spinAudio);stopAudio(leverAudio);spinAudio=leverAudio=null;currentGrid=createIdleGrid();setLever(0);save();renderGrid(currentGrid);renderAll();E.score.textContent='准备';E.status.textContent='拉下右侧手柄开始游戏';emit('airp-slot:reset',{keepBalance:!!opt.keepBalance})}
function theme(v){document.body.dataset.theme=THEMES.has(v)?v:'dark'}
function initTheme(){let v='dark';try{const s=localStorage.getItem('kivotos-theme')||localStorage.getItem('theme');if(THEMES.has(s))v=s;const p=parent!==window&&parent.document?.body?.dataset?.theme;if(THEMES.has(p))v=p}catch(e){}theme(v)}
function renderFortune(){const f=currentFortune(),rtp=currentRtp();E.fortune.textContent=`${f?f.tierName:'\u672a\u62bd\u7b7e'} \u00b7 ${Math.round(rtp*100)}%`;E.fortune.style.borderColor=f?.color||'#f2d28b55';E.fortune.style.color=f?.color||'#ffe29c'}function renderAll(){state.balance=readSharedBalance();renderFortune();renderChips();renderHeader();renderHistory();renderStats();renderSymbols()}
E.music.onclick=()=>setMusicEnabled(!audioPrefs.music);E.sfx.onclick=()=>setSfxEnabled(!audioPrefs.sfx);document.addEventListener('pointerdown',unlockAudio,{once:true,capture:true});document.addEventListener('keydown',unlockAudio,{once:true,capture:true});syncAudioUI();E.push.onclick=autoPull;E.lever.addEventListener('pointerdown',onLeverDown);E.lever.addEventListener('pointermove',onLeverMove);E.lever.addEventListener('pointerup',onLeverUp);E.lever.addEventListener('pointercancel',onLeverUp);E.lever.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!spinning){e.preventDefault();autoPull()}});addEventListener('storage',e=>{if([WALLET_KEY,FORTUNE_KEY,FISH_KEY,SCRATCH_KEY].includes(e.key)){state.balance=readSharedBalance();renderAll()}});addEventListener('message',e=>{const d=e.data||{};if(d.type==='kivotos-theme-change'||d.type==='airp-slot:set-theme')theme(d.theme);if(d.type==='airp-slot:set-balance')setBalance(d.balance,{silent:true});if(d.type==='airp-slot:set-profile')setProfile(d.profile);if(d.type==='airp-slot:reset-command')reset({keepBalance:d.keepBalance===true});if(d.type==='airp-slot:set-bet'){if(Number.isInteger(d.index))setBet(d.index);else if(d.amount!=null)setBetAmount(d.amount)}});
window.AIRPSlotMachine=Object.freeze({version:VERSION,getBalance:()=>state.balance,setBalance,getState:()=>JSON.parse(JSON.stringify(state)),getSymbols:()=>JSON.parse(JSON.stringify(SYMBOLS)),getBets:()=>[...BETS],setProfile,spin,pull:autoPull,setBet,setBetAmount,setMusic:setMusicEnabled,setSfx:setSfxEnabled,reset});
initTheme();initReels();renderAll();emit('airp-slot:ready',{bets:BETS,rtp:currentRtp(),symbols:SYMBOLS.map(s=>({id:s.id,name:s.name,art:s.art}))});
})();
