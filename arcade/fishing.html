function loadAudioPrefs(){try{return{music:true,sfx:true,...JSON.parse(localStorage.getItem(AUDIO_PREF_KEY)||'null')}}catch(_){return{music:true,sfx:true}}}function saveAudioPrefs(){try{localStorage.setItem(AUDIO_PREF_KEY,JSON.stringify(audioPrefs))}catch(_){}}function syncAudioUI(){E.music.setAttribute('aria-pressed',String(audioPrefs.music));E.music.textContent=audioPrefs.music?'♫ 音乐':'♫ 静音';E.sfx.setAttribute('aria-pressed',String(audioPrefs.sfx));E.sfx.textContent=audioPrefs.sfx?'◉ 音效':'○ 音效'}function setBgmTrack(i){bgmIndex=(i+BGM_TRACKS.length)%BGM_TRACKS.length;bgmAudio.src=BGM_TRACKS[bgmIndex];bgmAudio.load()}function playBgm(){if(!audioUnlocked||!audioPrefs.music||paused)return;if(!bgmAudio.src)setBgmTrack(bgmIndex);bgmAudio.volume=1;const p=bgmAudio.play();if(p&&p.catch)p.catch(()=>{})}function nextBgm(){setBgmTrack(bgmIndex+1);playBgm()}function unlockAudio(){audioUnlocked=true;playBgm()}function playSfx(name,volume=.72,minGap=0){if(!audioPrefs.sfx||!SFX_AUDIO[name])return null;const now=performance.now();if(minGap&&now-(lastSfx[name]||0)<minGap*1000)return null;lastSfx[name]=now;const a=new Audio(SFX_AUDIO[name]);a.volume=Math.max(0,Math.min(1,volume));a.play().catch(()=>{});return a}function showComboEffect(){if(catchCombo<2){clearTimeout(comboHideTimer);E.combo.classList.remove('active');E.combo.hidden=true;return}clearTimeout(comboHideTimer);E.combo.hidden=false;E.comboCount.textContent=catchCombo;E.combo.dataset.tier=catchCombo>=10?'high':catchCombo>=5?'mid':'low';E.combo.setAttribute('aria-label',catchCombo+' \u8fde\u51fb');E.combo.classList.remove('active');void E.combo.offsetWidth;E.combo.classList.add('active');comboHideTimer=setTimeout(()=>{E.combo.classList.remove('active');setTimeout(()=>{if(!E.combo.classList.contains('active'))E.combo.hidden=true},220)},1500)}function catchSfx(f){const now=performance.now();catchCombo=now-lastCatchAt<=1500?catchCombo+1:1;lastCatchAt=now;playSfx(f.type.special==='clear'||f.type.id==='whale'||f.type.variant=== function cubic(a,b,c,d,t){const u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d}

function spawnFish(forceType=null){const type=forceType||weighted(activeFishTypes()),fromLeft=rand()>.5,pad=type.size*2,startY=between(75,H-145),endY=between(70,H-150),x0=fromLeft?-pad:W+pad,x3=fromLeft?W+pad:-pad,span=fromLeft?W*.34:-W*.34;const f={id:nextFishId++,type,t:0,speed:between(type.speed[0],type.speed[1]),p0:{x:x0,y:startY},p1:{x:x0+span,y:Math.max(55,Math.min(H-135,startY+between(-150,150)))},p2:{x:x3-span,y:Math.max(55,Math.min(H-135,endY+between(-150,150)))},p3:{x:x3,y:endY},x:x0,y:startY,angle:0,alive:true,death:0,hit:0,scale:between(.68,.98),fromLeft,pending:0};fish.push(f);return f}

function initScene(){for(let i=0;i<34;i++)bubbles.push({x:between(10,W-10),y:between(0,H),r:between(2,8),speed:between(8,27),phase:between(0,Math.PI*2)});for(let i=0;i<12;i++){const forced=i===9?TYPE_MAP.shark:i===10?TYPE_MAP.turtle:i===11?TYPE_MAP.whale:null,f=spawnFish(forced);f.t=between(.03,.94);positionFish(f)}}
E.music.onclick=()=>setMusicEnabled(!audioPrefs.music);E.sfx.onclick=()=>setSfxEnabled(!audioPrefs.sfx);document.addEventListener('pointerdown',unlockAudio,{once:true,capture:true});document.addEventListener('keydown',unlockAudio,{once:true,capture:true});syncAudioUI();canvas.addEventListener('pointerdown',onCanvasDown);canvas.addEventListener('pointermove',e=>{pointer=canvasPoint(e)});canvas.addEventListener('contextmenu',e=>e.preventDefault());E.fire.onclick=fire;E.auto.onclick=toggleAuto;E.pause.onclick=()=>pauseGame(!paused);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();fire()}if(e.key==='p'||e.key==='P')pauseGame(!paused)});addEventListener('storage',e=>{if(e.key===WALLET_KEY){const v=readSharedBalance();if(Number.isFinite(v)){state.balance=v;renderHeader()}}if(e.key===FORTUNE_KEY){renderFortune();renderFishTable()}});addEventListener('message',e=>{const d=e.data||{};if(d.type==='kivotos-theme-change'||d.type==='airp-fishing:set-theme')theme(d.theme);if(d.type==='airp-fishing:set-balance')setBalance(d.balance,{silent:true});if(d.type==='airp-fishing:set-profile')setProfile(d.profile);if(d.type==='airp-fishing:set-bet'){if(Number.isInteger(d.index))setBet(d.index);else if(d.amount!=null)setBetAmount(d.amount)}if(d.type==='airp-fishing:pause-command')pauseGame(true);if(d.type==='airp-fishing:resume-command')pauseGame(false);if(d.type==='airp-fishing:reset-command')reset({keepBalance:d.keepBalance===true})});
window.AIRPFishingGame=Object.freeze({version:VERSION,getBalance:()=>state.balance,setBalance,getState:()=>JSON.parse(JSON.stringify(state)),getBets:()=>[...BETS],getBaseRtp:currentRtp,getFishRtp:id=>{const type=TYPE_MAP[id];return type?effectiveFishRtp(type):null},setProfile,spawn:id=>{const type=TYPE_MAP[id];if(!type||type.unlock&&!isUnlocked(type.unlock))return null;return spawnFish(type).id},getFishTypes:()=>FISH_TYPES.map(x=>({...x,baseRtp:currentRtp(),effectiveRtp:effectiveFishRtp(x),captureRate:effectiveFishRtp(x)/x.multiplier})),setBet,setBetAmount,setMusic:setMusicEnabled,setSfx:setSfxEnabled,lockTarget:id=>lockFish(fish.find(f=>f.id===id)),fire,pause:()=>pauseGame(true),resume:()=>pauseGame(false),reset});
initTheme();initScene();renderAll();requestAnimationFrame(loop);emit('airp-fishing:ready',{bets:BETS,rtp:currentRtp(),lowFishRtpOffset:LOW_FISH_RTP_OFFSET,lowFishMaxMultiplier:LOW_FISH_MAX_MULTIPLIER,fish:FISH_TYPES.map(x=>({id:x.id,name:x.name,multiplier:x.multiplier,effectiveRtp:effectiveFishRtp(x),captureRate:effectiveFishRtp(x)/x.multiplier}))});
})();
