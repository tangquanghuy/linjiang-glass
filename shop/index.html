<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIRP 代币商店</title>
<style>
:root{color-scheme:light;--navy:#17223c;--navy2:#263a60;--paper:#f5f3ee;--paper2:#fffdfa;--ink:#27324a;--muted:#68748c;--line:#24345222;--gold:#b87513;--cyan:#147e84;--violet:#7354a9}*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 12% -5%,#927cb23b,transparent 34%),linear-gradient(135deg,#111b32,#233a5b 60%,#102035);color:var(--ink);font:14px/1.5 "Microsoft YaHei UI","Noto Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}.shop{width:min(1260px,calc(100% - 28px));min-height:calc(100dvh - 28px);margin:14px auto;padding:22px 28px 28px;border:1px solid #ffffff52;border-radius:28px;background:var(--paper);box-shadow:0 28px 90px #07122688,inset 0 1px #fff;overflow:hidden}.top{display:flex;align-items:center;gap:14px;padding:3px 0 18px;border-bottom:1px solid var(--line)}.brand{display:grid;place-items:center;width:50px;height:50px;flex:none;border-radius:15px;background:var(--navy);color:#ffe39a;font-size:24px;box-shadow:0 8px 20px #17223c20}.title{min-width:0;flex:1}.title h1{margin:0;color:var(--navy);font-size:24px;letter-spacing:.06em}.title p{margin:3px 0 0;color:var(--muted);font-size:10px}.wallet{display:flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid #bd7b1b55;border-radius:999px;background:#fffaf0;color:var(--gold);font-weight:900}.wallet img{width:23px;height:23px}.wallet b{font:900 17px/1 ui-monospace,Consolas,monospace}.close{width:39px;height:39px;border:1px solid #ffffff55;border-radius:12px;background:var(--navy);color:#fff;cursor:pointer;font-size:21px}.close:hover{background:var(--navy2)}body.is-embedded .close{display:none}.progress{margin:15px 0 12px;border:1px solid #147e8433;border-radius:14px;background:#edf8f6}.progress summary{display:flex;align-items:center;gap:10px;min-height:41px;padding:0 13px;cursor:pointer;list-style:none;font-size:10px}.progress summary::-webkit-details-marker{display:none}.progress summary b{color:var(--cyan)}.progress summary span{color:var(--muted)}.progress summary i{margin-left:auto;color:var(--muted);font-style:normal}.progress[open] summary i{transform:rotate(180deg)}.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 9px 10px}.goal{padding:9px 11px;border:1px solid #1f394329;border-radius:11px;background:#ffffffb8}.goal b{display:block;font-size:10px}.goal span{display:block;margin-top:3px;color:var(--muted);font-size:9px}.goal em{display:block;margin-top:5px;color:var(--gold);font:800 9px/1 ui-monospace,Consolas,monospace;font-style:normal}.goal.is-open{border-color:#147e8460}.goal.is-open em{color:var(--cyan)}.catalog-head{display:flex;align-items:end;justify-content:space-between;margin:18px 0 9px}.catalog-head h2{margin:0;color:var(--navy);font-size:18px}.catalog-head p{margin:3px 0 0;color:var(--muted);font-size:10px}.count{color:var(--muted);font:800 10px/1 ui-monospace,Consolas,monospace}.toolbar{padding:10px;border:1px solid #24345222;border-radius:15px;background:#eae9e4}.toolbar-row{display:flex;align-items:center;gap:7px}.toolbar-row+.toolbar-row{margin-top:8px}.filters{display:flex;align-items:center;gap:6px;min-width:0;overflow-x:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:none;padding:6px 11px;border:1px solid #24345225;border-radius:999px;background:#ffffffa8;color:#5d687e;cursor:pointer;font-size:10px;font-weight:900}.filter.is-active{border-color:var(--navy);background:var(--navy);color:#fff}.grade-filter{width:31px;height:29px;padding:0;border-radius:9px}.search{min-width:160px;flex:1;margin-left:auto;padding:8px 11px;border:1px solid #24345224;border-radius:10px;background:#fff;color:var(--ink);font-size:10px;outline:none}.search:focus{border-color:#7354a988;box-shadow:0 0 0 3px #7354a918}.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.card{position:relative;display:flex;align-items:center;gap:11px;min-width:0;min-height:106px;padding:12px 13px;border:1px solid #2434521f;border-radius:16px;background:var(--paper2);box-shadow:0 5px 15px #17223c0c;cursor:pointer;transition:transform .14s,border-color .14s,box-shadow .14s}.card:hover{transform:translateY(-2px);border-color:#7354a988;box-shadow:0 10px 24px #17223c18}.card:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--accent,#7354a9)}.card.grade-D{--accent:#8e6f43}.card.grade-C{--accent:#147e84}.card.grade-B{--accent:#7354a9}.card.grade-A{--accent:#b15a77}.card.grade-S{--accent:#bd7b1b}.card.is-locked{opacity:.62}.art{display:grid;place-items:center;width:58px;height:58px;flex:none;border:1px solid #2434521b;border-radius:15px;background:linear-gradient(145deg,#f4f2ee,#e5e6e8)}.art img{width:47px;height:47px;object-fit:contain}.copy{min-width:0;flex:1}.name-row{display:flex;align-items:center;gap:6px}.name-row h2{min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--navy);font-size:12px}.grade{flex:none;padding:2px 5px;border:1px solid #bd7b1b50;border-radius:999px;color:#875a17;font-size:8px;font-weight:900}.kind{margin-top:3px;color:var(--cyan);font-size:9px;font-weight:800}.card-foot{display:flex;align-items:center;gap:7px;margin-top:8px}.price{color:var(--gold);font:900 12px/1 ui-monospace,Consolas,monospace}.status{margin-left:auto;color:#8b95a4;font-size:9px}.card:not(.is-locked) .status{color:var(--cyan)}.arrow{font-size:18px;color:#9aa4b5;line-height:1}.empty{grid-column:1/-1;display:grid;place-items:center;min-height:240px;border:1px dashed #24345233;border-radius:18px;color:var(--muted)}.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}.pager button{width:38px;height:34px;border:1px solid #2434522c;border-radius:10px;background:#fff;color:var(--navy);cursor:pointer}.pager button:disabled{opacity:.35}.pager span{min-width:75px;text-align:center;color:var(--muted);font:800 10px/1 ui-monospace,Consolas,monospace}.shade{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:#0810239c;backdrop-filter:blur(8px)}.detail-panel{position:relative;width:min(560px,calc(100vw - 40px));max-height:calc(100dvh - 40px);overflow:auto;padding:18px 20px 20px;border:1px solid #ffffffb8;border-radius:22px;background:#fffdfa;box-shadow:0 28px 90px #06112466,0 2px 10px #06112430;animation:detail-pop .16s ease-out}@keyframes detail-pop{from{opacity:0;transform:translateY(10px) scale(.975)}to{opacity:1;transform:none}}.detail-head{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}.detail-art{display:grid;place-items:center;width:72px;height:72px;flex:none;border-radius:16px;background:linear-gradient(145deg,#eef3f3,#e4e5ea);border:1px solid #2434521c}.detail-art img{width:58px;height:58px;object-fit:contain}.detail-title{min-width:0;flex:1}.detail-title h2{margin:0 0 4px;color:var(--navy);font-size:19px;line-height:1.3}.detail-title p{margin:0;color:var(--muted);font-size:10px}.detail-x{width:36px;height:36px;border:1px solid #24345225;border-radius:10px;background:#fff;color:var(--navy);cursor:pointer;font-size:19px}.detail-effect{margin:12px 0;padding:13px 14px;border-left:4px solid var(--accent,#7354a9);border-radius:0 14px 14px 0;background:#f0f2f4;color:#3f4b60;font-size:12px;line-height:1.75;white-space:pre-wrap}.detail-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 0}.meta{padding:7px 9px;border:1px solid #2434521d;border-radius:10px;background:#f7f6f2}.meta small{display:block;color:var(--muted);font-size:9px}.meta b{display:block;margin-top:3px;color:var(--navy);font-size:11px}.detail-buy{display:flex;align-items:center;gap:10px;padding-top:11px;border-top:1px solid var(--line)}.detail-price{color:var(--gold);font:900 19px/1 ui-monospace,Consolas,monospace}.detail-lock{flex:1;color:var(--muted);font-size:10px}.buy{padding:8px 14px;border:1px solid #147e8466;border-radius:9px;background:#e9f7f5;color:#126b70;cursor:pointer;font-size:10px;font-weight:900}.buy:disabled{background:#eef0f1;color:#8f98a5;border-color:#24345218;cursor:default}.toast{position:fixed;z-index:120;left:50%;bottom:22px;transform:translate(-50%,12px);padding:10px 17px;border:1px solid #ffffff5c;border-radius:999px;background:#17223cf2;color:#fff;box-shadow:0 14px 40px #0009;opacity:0;pointer-events:none;transition:.2s;font-size:11px;font-weight:900}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:980px){.catalog{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.shop{width:calc(100% - 12px);min-height:calc(100dvh - 12px);margin:6px auto;padding:14px 12px 22px;border-radius:20px}.top{gap:8px}.brand{width:43px;height:43px;border-radius:13px;font-size:21px}.title h1{font-size:19px}.title p{display:none}.wallet{padding:6px 9px}.wallet b{font-size:14px}.wallet img{width:19px;height:19px}.goals{grid-template-columns:1fr}.toolbar{padding:8px}.toolbar-row{display:block}.filters{padding-bottom:1px}.search{width:100%;margin:8px 0 0}.catalog{grid-template-columns:1fr;gap:8px}.card{min-height:96px;padding:10px}.art{width:52px;height:52px}.art img{width:42px;height:42px}.shade{padding:10px}.detail-panel{width:100%;max-height:calc(100dvh - 20px);padding:14px;border-radius:18px}.detail-head{align-items:center;gap:10px;padding-bottom:10px}.detail-art{width:60px;height:60px;border-radius:14px}.detail-art img{width:48px;height:48px}.detail-title h2{font-size:16px}.detail-title p{font-size:9px}.detail-effect{margin:10px 0;padding:11px 12px;font-size:11px;line-height:1.7}.detail-meta{gap:5px;margin-top:8px}.meta{padding:6px 7px}.detail-buy{gap:7px}.detail-price{font-size:16px}.detail-lock{font-size:9px}.buy{padding:8px 11px}}
</style>
</head>
<body>
<main class="shop"><header class="top"><span class="brand">🛒</span><div class="title"><h1>代币商店</h1><p>点击商品查看完整信息</p></div><div class="wallet"><img src="assets/token-chip.svg" alt=""><b id="tokenBalance">0</b></div><button class="close" id="close" type="button" aria-label="关闭商店">×</button></header><details class="progress"><summary><b id="progressTitle">代币掉落 0/3</b><span>收集进度</span><i>⌄</i></summary><div class="goals" id="tokenGoals"></div></details><div class="catalog-head"><h2>商品目录</h2><span class="count" id="count">0件</span></div><section class="toolbar"><div class="toolbar-row"><div class="filters" id="categories"></div><input class="search" id="search" type="search" placeholder="搜索商品名称"></div><div class="toolbar-row"><div class="filters" id="grades"></div></div></section><section class="catalog" id="catalog"></section><nav class="pager"><button id="prev" type="button">‹</button><span id="pageText">1 / 1</span><button id="next" type="button">›</button></nav></main><div class="shade" id="shade" hidden><aside class="detail-panel" id="detailPanel"></aside></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';const KEY='airp_arcade_tokens_v1',PROFILE_KEY='airp_arcade_token_progress_v1',PAGE_SIZE=8,CATEGORIES=['全部','消耗品','服装','器具','器材','其他'],GRADES=['全部','D','C','B','A','S'];let products=[],embedded=false,category='全部',grade='全部',query='',page=0,toastTimer=0;try{embedded=parent!==window}catch(_){}if(embedded)document.body.classList.add('is-embedded');const $=id=>document.getElementById(id),money=v=>Math.max(0,Math.floor(Number(v)||0)),readJSON=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')||f}catch(_){return f}},wallet=()=>money(readJSON(KEY,{}).balance),profile=()=>readJSON(PROFILE_KEY,{}),post=(type,extra={})=>{try{parent.postMessage({type:'airp-shop:'+type,...extra},'*')}catch(_){}};function icon(i){return i?.icon?.startsWith('../')?i.icon:`assets/${i.icon}`}function show(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2100)}function state(){const p=profile(),u=p.unlocks||{},a=p.advanced||{};return{p,u,a,games:Object.values(u).filter(Boolean).length,advanced:Object.values(a).filter(Boolean).length}}function ready(i){const s=state();return s.games>=Number(i.unlock?.minGames||0)&&s.advanced>=Number(i.unlock?.minAdvanced||0)}function lockText(i){const s=state();if(s.games<Number(i.unlock?.minGames||0))return`基础掉落阶段 ${s.games}/${i.unlock.minGames}`;if(s.advanced<Number(i.unlock?.minAdvanced||0))return`高级掉落阶段 ${s.advanced}/${i.unlock.minAdvanced}`;return'已解锁'}function displayCategory(i){return i.storageBucket==='消耗品'?'消耗品':i.category}function filtered(){const order={D:0,C:1,B:2,A:3,S:4};return products.filter(i=>(category==='全部'||displayCategory(i)===category)&&(grade==='全部'||i.grade===grade)&&(!query||i.name.toLowerCase().includes(query))).sort((a,b)=>order[a.grade]-order[b.grade]||a.price-b.price)}function filters(){$('categories').innerHTML=CATEGORIES.map(x=>`<button class="filter${x===category?' is-active':''}" data-category="${x}" type="button">${x}</button>`).join('');$('grades').innerHTML=GRADES.map(x=>`<button class="filter grade-filter${x===grade?' is-active':''}" data-grade="${x}" type="button">${x}</button>`).join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;page=0;render()});document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{grade=b.dataset.grade;page=0;render()})}function goals(){const s=state(),c=s.p.collections||{},rows=[['fishing','捕鱼图鉴',Object.keys(c.fishing||{}).filter(k=>k!=='__caught').length,6,'捕获6种基础鱼','累计捕获200次升级'],['scratch','奖金图鉴',Object.keys(c.scratch||{}).length,6,'集齐6种中奖金额','集齐7种金额升级'],['slots','三连图鉴',Object.keys(c.slots||{}).length,6,'集齐6种三连图案','集齐7种图案升级']];$('progressTitle').textContent=`代币掉落 ${s.games}/3 · 高级 ${s.advanced}/3`;$('tokenGoals').innerHTML=rows.map(r=>`<div class="goal${s.u[r[0]]?' is-open':''}"><b>${r[1]}</b><span>${r[4]}；${r[5]}</span><em>${s.u[r[0]]?'已开启':`${Math.min(r[2],r[3])}/${r[3]}`} · ${s.a[r[0]]?'已升级':'未升级'}</em></div>`).join('')}function render(){filters();goals();$('tokenBalance').textContent=wallet().toLocaleString('zh-CN');const list=filtered(),pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));page=Math.min(page,pages-1);const rows=list.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);$('count').textContent=`${list.length}件`;$('pageText').textContent=`${page+1} / ${pages}`;$('prev').disabled=page<=0;$('next').disabled=page>=pages-1;$('catalog').innerHTML=rows.length?rows.map(i=>{const open=ready(i),affordable=wallet()>=i.price;return`<article class="card grade-${i.grade}${open?'':' is-locked'}" data-open="${i.id}" tabindex="0" role="button"><div class="art"><img src="${icon(i)}" alt=""></div><div class="copy"><div class="name-row"><h2>${i.name}</h2><span class="grade">${i.grade}级</span></div><div class="kind">${displayCategory(i)} · ${i.category}</div><div class="card-foot"><span class="price">${i.price}代币</span><span class="status">${open?(affordable?'可兑换':'代币不足'):lockText(i)}</span><span class="arrow">›</span></div></div></article>`}).join(''):'<div class="empty">没有符合条件的商品</div>';document.querySelectorAll('[data-open]').forEach(b=>{b.onclick=()=>openDetail(b.dataset.open);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(b.dataset.open)}}})}function openDetail(id){const i=products.find(x=>x.id===id);if(!i)return;const open=ready(i),affordable=wallet()>=i.price,accent={D:'#8e6f43',C:'#147e84',B:'#7354a9',A:'#b15a77',S:'#bd7b1b'}[i.grade]||'#7354a9';$('detailPanel').style.setProperty('--accent',accent);$('detailPanel').innerHTML=`<header class="detail-head"><div class="detail-art"><img src="${icon(i)}" alt=""></div><div class="detail-title"><h2>${i.name} <span class="grade">${i.grade}级</span></h2><p>${displayCategory(i)} · ${i.category} · ${i.storageBucket}</p></div><button class="detail-x" type="button" data-detail-close>×</button></header><div class="detail-meta"><div class="meta"><small>等级</small><b>${i.grade}级</b></div><div class="meta"><small>价格</small><b>${i.price} 代币</b></div><div class="meta"><small>状态</small><b>${open?(affordable?'可兑换':'代币不足'):'未解锁'}</b></div></div><div class="detail-effect">${i.effect}</div><footer class="detail-buy"><span class="detail-price">${i.price}代币</span><span class="detail-lock">${lockText(i)}</span><button class="buy" data-detail-buy="${i.id}" type="button" ${!embedded||!open||!affordable?'disabled':''}>${open?(affordable?'兑换':'代币不足'):'未解锁'}</button></footer>`;$('shade').hidden=false;$('detailPanel').querySelector('[data-detail-close]').onclick=closeDetail;const b=$('detailPanel').querySelector('[data-detail-buy]');if(b)b.onclick=()=>buy(i.id)}function closeDetail(){$('shade').hidden=true}$('prev').onclick=()=>{if(page>0){page--;render();scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=()=>{page++;render();scrollTo({top:0,behavior:'smooth'})};$('search').oninput=e=>{query=e.target.value.trim().toLowerCase();page=0;render()};$('shade').onclick=e=>{if(e.target===$('shade'))closeDetail()};$('close').onclick=()=>post('close');addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});async function buy(id){const i=products.find(x=>x.id===id);if(!i||!ready(i))return;if(wallet()<i.price){show('代币不足');return}post('purchase',{product:i});show('正在确认兑换…')}addEventListener('storage',e=>{if(e.key===KEY||e.key===PROFILE_KEY)render()});addEventListener('message',e=>{const d=e.data||{};if(d.type==='airp-shop:hello'){render();return}if(d.type==='airp-shop:purchase-result'){if(d.ok){localStorage.setItem(KEY,JSON.stringify({balance:Math.max(0,wallet()-money(d.price)),updatedAt:Date.now()}));show(`已兑换：${d.name}`);closeDetail();render()}else show(d.error||'兑换失败')}});fetch('products.json').then(r=>r.json()).then(d=>{products=d.products||[];render();post('hello')}).catch(()=>show('商品数据读取失败'));})();
</script>
</body>
</html>
