<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酒馆阅读栏嵌入夹具</title>
<style>
  :root {
    --st-bg: #191b22;
    --st-panel: #21232c;
    --st-line: #2e3140;
    --st-text: #d8dae6;
    --st-dim: #8b90a5;
    --st-accent: #8c7ae6;
    --sheldWidth: 80vw;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--st-bg);
    color: var(--st-text);
    font: 13px/1.45 "Segoe UI", "Noto Sans SC", sans-serif;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #controls {
    flex: none;
    z-index: 80;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    padding: 8px 12px;
    background: #12141b;
    border-bottom: 1px solid var(--st-line);
  }
  body.is-headless #controls { display: none; }
  #controls label { color: var(--st-dim); display: flex; gap: 6px; align-items: center; }
  #controls select, #controls button {
    background: var(--st-panel);
    color: var(--st-text);
    border: 1px solid #3a3e52;
    border-radius: 6px;
    padding: 4px 8px;
  }
  #controls button:hover { border-color: var(--st-accent); }
  #top-bar {
    flex: none;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    background: #15171e;
    border-bottom: 1px solid var(--st-line);
    width: var(--sheldWidth);
    max-width: 100%;
    margin: 0 auto;
  }
  #top-bar b { font-weight: 600; letter-spacing: .04em; }
  #top-bar span { color: var(--st-dim); font-size: 12px; }
  #workarea {
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    width: 100%;
    display: block;
    overflow: hidden;
    background: #0f1116;
    position: relative;
  }
  #nav {
    display: none;
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 56px;
    background: #15171e;
    border-right: 1px solid var(--st-line);
  }
  body.has-sidebar #nav { display: block; }
  #sheld {
    width: var(--sheldWidth);
    max-width: 100%;
    height: 100%;
    margin: 0 auto;
    overflow: auto;
    overflow-x: hidden;
    background:
      linear-gradient(180deg, rgba(140, 122, 230, .06), transparent 80px),
      var(--st-panel);
    border-left: 1px solid var(--st-line);
    border-right: 1px solid var(--st-line);
  }
  #reading {
    display: block;
    width: 100%;
    min-height: 100%;
    border: 0;
    background: transparent;
  }
  #chat, .chat {
    padding: 16px 14px 28px;
    max-width: 100%;
    overflow-x: hidden;
  }
  .mes {
    margin: 0 0 14px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.05);
  }
  .mes.user { background: rgba(140, 122, 230, .10); }
  .mes .who { font-size: 11px; color: var(--st-accent); margin-bottom: 6px; }
  .mes .txt { color: var(--st-text); }
  #status {
    display: block;
    width: 100%;
    height: 420px;
    margin: 8px 0 0;
    border: 0;
    background: #05040a;
    overflow: hidden;
  }
  #status-slot { width: 100%; overflow: hidden; }
  #status-slot.is-narrow { margin-left: auto; margin-right: auto; }
  #send_form {
    flex: none;
    height: 48px;
    width: var(--sheldWidth);
    max-width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    padding: 0 12px;
    background: #15171e;
    border-top: 1px solid var(--st-line);
    color: var(--st-dim);
  }
</style>
</head>
<body>
<div id="controls">
  <label>档位
    <select id="preset"></select>
  </label>
  <label>阅读栏
    <select id="sheldVw">
      <option value="50">50vw 最窄</option>
      <option value="60">60vw</option>
      <option value="70">70vw</option>
      <option value="80" selected>80vw 较宽</option>
      <option value="90">90vw 最宽</option>
      <option value="100">100vw 满宽</option>
    </select>
  </label>
  <label>状态槽
    <select id="wrap">
      <option value="">阅读栏同宽</option>
      <option value="140">140px 回归</option>
      <option value="240">240px</option>
      <option value="320">320px</option>
    </select>
  </label>
  <label><input type="checkbox" id="nest"> 阅读栏再套 iframe</label>
  <label><input type="checkbox" id="sidebar"> 桌面侧栏</label>
  <button type="button" id="reload">重载 HUD</button>
  <span id="readout"></span>
</div>
<header id="top-bar">
  <b>SillyTavern</b>
  <span>阅读栏嵌入夹具 · 不连真实酒馆</span>
</header>
<div id="workarea">
  <nav id="nav" aria-hidden="true"></nav>
  <div id="sheld"></div>
</div>
<footer id="send_form">输入框占位 · 滚轮应落到阅读栏而不是 HUD 内层</footer>
<script type="module" src="./tavern-fixture.js"></script>
</body>
</html>
