<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>真实都市 × 直播生态 × 屏幕前后双重认知</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#130f12;
  --paper:#efe6de;
  --muted:rgba(239,230,222,.64);
  --faint:rgba(239,230,222,.38);
  --line:rgba(245,226,213,.16);
  --line-strong:rgba(245,226,213,.28);
  --rose:#c96b78;
  --rose-light:#ef9aa4;
  --gold:#d7b27a;
  --ok:#8bcbb1;
  --bad:#d98b8e;
  --cover:url('https://anchor.bolt.qzz.io/NSFW/%E7%BA%A2%E8%94%B7%E8%96%87/%E8%B6%B3%E4%BA%A42.webp');
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  color:var(--paper);
  font-family:'Noto Sans SC',system-ui,sans-serif;
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--rose-light);outline-offset:3px}

.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;background:#130f12;pointer-events:none}
.ambient::before{content:'';position:absolute;inset:-9%;background-image:var(--cover);background-size:cover;background-position:center 42%;filter:blur(42px) saturate(.56) brightness(.3);transform:scale(1.08)}
.ambient::after{content:'';position:absolute;inset:0;background:radial-gradient(70% 70% at 16% 15%,rgba(170,104,78,.13),transparent 72%),radial-gradient(65% 72% at 89% 65%,rgba(124,37,54,.16),transparent 72%),linear-gradient(115deg,rgba(17,13,16,.84),rgba(17,13,16,.6));box-shadow:inset 0 0 180px rgba(0,0,0,.45)}

.loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#130f12;transition:opacity .55s ease,visibility .55s ease}
.loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-inner{display:grid;justify-items:center;gap:15px;color:var(--faint);font:500 9px/1 'Outfit','Noto Sans SC';letter-spacing:.28em;text-transform:uppercase}
.loader-line{position:relative;width:92px;height:1px;background:rgba(255,255,255,.09);overflow:hidden}
.loader-line::after{content:'';position:absolute;inset:0;width:42%;background:linear-gradient(90deg,transparent,var(--rose-light),transparent);animation:loading 1.15s ease-in-out infinite}
@keyframes loading{from{transform:translateX(-120%)}to{transform:translateX(260%)}}

.page{position:relative;z-index:1;width:min(1220px,calc(100% - 32px));margin:0 auto;padding:24px 0}
.shell{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1.02fr) minmax(430px,.98fr);
  min-height:calc(100vh - 48px);
  overflow:hidden;
  border:1px solid var(--line-strong);
  border-radius:28px;
  background:rgba(19,15,18,.68);
  box-shadow:0 32px 110px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.06);
  backdrop-filter:blur(22px) saturate(1.08);
  -webkit-backdrop-filter:blur(22px) saturate(1.08);
}
.shell::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:28px;box-shadow:inset 0 0 70px rgba(255,225,207,.025)}

.cover-column{position:relative;z-index:1;display:flex;align-items:stretch;justify-content:stretch;padding:0;border-right:1px solid var(--line);background:rgba(8,7,9,.33)}
.cover-frame{position:relative;width:100%;max-width:none;align-self:flex-start;overflow:hidden;border:0;border-radius:0;background:#181316;box-shadow:none}
.cover-frame img{display:block;width:100%;height:auto;max-width:none;object-fit:contain;background:#181316}
.cover-frame::after{content:none}

.content{position:relative;z-index:2;display:flex;flex-direction:column;padding:clamp(34px,4vw,58px) clamp(28px,4.2vw,56px) 28px}
.header{padding-bottom:27px;border-bottom:1px solid var(--line)}
.kicker{display:flex;align-items:center;gap:13px;margin-bottom:18px;color:var(--gold);font:500 11px/1.4 'Outfit','Noto Sans SC';letter-spacing:.18em;text-transform:uppercase}
.kicker::before{content:'';width:32px;height:1px;background:linear-gradient(90deg,var(--rose-light),var(--gold))}
h1{font-family:'Noto Serif SC',serif;font-size:clamp(30px,3.1vw,46px);font-weight:700;line-height:1.35;letter-spacing:.08em}
h1 span{display:block;color:transparent;background:linear-gradient(110deg,#f4e7db 8%,#deb88a 47%,#df8490 92%);-webkit-background-clip:text;background-clip:text}
.header-note{margin-top:14px;color:rgba(239,230,222,.58);font:500 13px/1.6 'Noto Sans SC',sans-serif;letter-spacing:.12em}

.features{display:grid;margin-top:9px}
.feature{display:grid;grid-template-columns:104px 1fr;gap:22px;padding:24px 0;border-bottom:1px solid var(--line)}
.feature-title{display:flex;align-items:flex-start;gap:10px;color:#f2e5dd;font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.feature-title i{margin-top:9px;width:6px;height:6px;border-radius:50%;background:var(--rose-light);box-shadow:0 0 10px rgba(239,154,164,.5)}
.feature p{color:rgba(239,230,222,.72);font-size:15px;line-height:2;text-align:justify}
.decision{position:relative;margin-top:24px;padding:0 0 0 18px;color:rgba(244,233,225,.86);font-family:'Noto Serif SC',serif;font-size:15px;line-height:2}
.decision::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:1px;background:linear-gradient(var(--gold),rgba(201,107,120,.3))}
.decision em{color:var(--rose-light);font-style:normal}

.spacer{flex:1;min-height:24px}
.dep-panel{padding:18px;border:1px solid var(--line);border-radius:15px;background:rgba(7,6,9,.22)}
.dep-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.dep-head b{font-size:13px;font-weight:600;letter-spacing:.1em;color:rgba(244,233,225,.86)}
.dep-tools{display:flex;align-items:center;gap:8px;min-width:0}
.dep-summary{font-size:12px;color:rgba(239,230,222,.58);white-space:nowrap}.dep-summary.all-ok{color:var(--ok)}.dep-summary.has-fail{color:var(--bad)}
.refresh{border:0;background:none;color:rgba(239,230,222,.55);font-size:12px;cursor:pointer}.refresh:hover{color:var(--rose-light)}
.dep-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.dep-item{display:flex;align-items:center;gap:9px;min-width:0;padding:10px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:rgba(239,230,222,.6);font-size:12px}
.dep-item span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dep-dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:#71676a}
.dep-item.checking .dep-dot{background:var(--gold);animation:blink 1.1s infinite}.dep-item.ok{color:rgba(203,238,222,.76)}.dep-item.ok .dep-dot{background:var(--ok);box-shadow:0 0 8px rgba(139,203,177,.55)}.dep-item.fail{color:rgba(235,190,190,.7)}.dep-item.fail .dep-dot{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}

.actions{margin-top:15px}
.enter{width:100%;padding:14px 20px;border:1px solid rgba(247,221,208,.28);border-radius:11px;background:linear-gradient(110deg,rgba(108,45,59,.92),rgba(161,73,88,.9));box-shadow:0 12px 32px rgba(74,19,32,.23),inset 0 1px rgba(255,255,255,.1);font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600;letter-spacing:.2em;cursor:pointer;transition:.2s}
.enter:hover{transform:translateY(-1px);filter:brightness(1.08)}.enter:disabled{opacity:.3;cursor:not-allowed;transform:none;filter:none}.enter.busy{pointer-events:none}
.agreement{margin-top:11px;text-align:center}
.warning{color:rgba(224,175,175,.72);font-size:12px;line-height:1.8}
.agree{display:inline-flex;align-items:center;gap:8px;margin-top:8px;color:rgba(239,230,222,.62);font-size:12px;cursor:pointer;user-select:none}
.agree input{appearance:none;width:16px;height:16px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);border-radius:3px;background:rgba(255,255,255,.03);cursor:pointer}.agree input:checked{background:var(--rose-light);border-color:var(--rose-light)}.agree input:checked::after{content:'✓';color:#2b151a;font-size:11px;font-weight:900}

.toast{position:fixed;z-index:120;left:50%;bottom:24px;transform:translate(-50%,16px);padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:rgba(18,14,17,.91);box-shadow:0 18px 55px rgba(0,0,0,.45);backdrop-filter:blur(16px);color:var(--muted);font-size:11px;opacity:0;pointer-events:none;transition:.24s}.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){
  .page{width:min(700px,calc(100% - 20px));padding:10px 0}
  .shell{display:block;min-height:calc(100vh - 20px);border-radius:22px}
  .cover-column{padding:0;border-right:0;border-bottom:1px solid var(--line)}
  .cover-frame{max-width:none;border-radius:0}
  .content{padding:34px 25px 25px}
  h1{font-size:clamp(28px,7vw,42px)}
  .spacer{min-height:28px}
}
@media(max-width:480px){
  .page{width:calc(100% - 12px);padding:6px 0}.shell{border-radius:18px;min-height:calc(100vh - 12px)}
  .cover-column{padding:0}.cover-frame{border-radius:0}
  .content{padding:28px 18px 20px}.header{padding-bottom:23px}.kicker{font-size:10px;letter-spacing:.13em}h1{font-size:29px;letter-spacing:.055em}.header-note{font-size:12px}
  .feature{grid-template-columns:1fr;gap:9px;padding:20px 0}.feature p{font-size:14px;line-height:1.9}.feature-title{font-size:15px}
  .decision{font-size:14px;padding-left:14px}.dep-list{grid-template-columns:1fr 1fr}.dep-item{font-size:11px;padding:9px}.dep-summary{font-size:11px}.warning,.agree{font-size:11px}
}
@media(prefers-reduced-motion:reduce){.loader-line::after,.dep-item.checking .dep-dot{animation:none}.enter,.toast{transition:none}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<div class="loader" id="loader"><div class="loader-inner"><div class="loader-line"></div><span>Loading cover</span></div></div>

<div class="page">
  <main class="shell">
    <section class="cover-column" aria-label="完整封面图">
      <figure class="cover-frame">
        <img id="coverImage" src="https://anchor.bolt.qzz.io/NSFW/%E7%BA%A2%E8%94%B7%E8%96%87/%E8%B6%B3%E4%BA%A42.webp" alt="封面图">
      </figure>
    </section>

    <section class="content">
      <header class="header">
        <div class="kicker">真实都市 × 直播生态</div>
        <h1><span>临江市生活 - 主播女孩欲望调制</span></h1>
        <p class="header-note">屏幕前后 · 双重认知</p>
      </header>

      <div class="features" aria-label="玩法核心">
        <article class="feature">
          <div class="feature-title"><i></i>线上看播</div>
          <p>弹幕造梗、舰队特权、实时对线、捕捉主播直播时的每一丝微妙异样；</p>
        </article>
        <article class="feature">
          <div class="feature-title"><i></i>都市生活</div>
          <p>打工求职、租房搬家、工坊制药、探索老街水巷与隐秘场所；</p>
        </article>
        <article class="feature">
          <div class="feature-title"><i></i>私密玩法</div>
          <p>从便利店的日常偶遇，到动捕后台的露出、隐奸、憋尿、昏睡等性癖调教与部位开发。</p>
        </article>
      </div>

      <p class="decision">是从“线上单推”到“线下把控”，还是做个默默守护的真爱粉？<em>一切由你决定。</em></p>
      <div class="spacer"></div>

      <section class="dep-panel" aria-labelledby="depTitle">
        <div class="dep-head">
          <b id="depTitle">环境依赖检测</b>
          <div class="dep-tools"><span class="dep-summary" id="depSummary">正在检测…</span><button class="refresh" id="refreshDeps" type="button">↻ 重试</button></div>
        </div>
        <div class="dep-list">
          <div class="dep-item checking" id="dep-mvu"><span class="dep-dot"></span><span>MVU 框架</span></div>
          <div class="dep-item checking" id="dep-prompt"><span class="dep-dot"></span><span>提示词模板</span></div>
          <div class="dep-item checking" id="dep-assets"><span class="dep-dot"></span><span>素材缓存脚本</span></div>
          <div class="dep-item checking" id="dep-aux"><span class="dep-dot"></span><span>辅助计算脚本</span></div>
          <div class="dep-item checking" id="dep-phone"><span class="dep-dot"></span><span>小手机脚本</span></div>
        </div>
      </section>

      <div class="actions">
        <button class="enter" id="enterBtn" type="button" disabled>开始游戏</button>
        <div class="agreement">
          <p class="warning">本作品完全免费，请勿在墙内社区、QQ群传播、讨论相关内容</p>
          <label class="agree"><input id="agreeCheck" type="checkbox"><span>我已阅读并同意以上协议</span></label>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const byId = (id) => document.getElementById(id);
  const loader = byId('loader');
  const cover = byId('coverImage');
  const enterBtn = byId('enterBtn');
  const agreeCheck = byId('agreeCheck');
  const summary = byId('depSummary');
  const toast = byId('toast');
  let toastTimer = 0;

  function reveal(){ loader.classList.add('hide'); setTimeout(() => loader.remove(), 650); }
  if(cover.complete) reveal();
  else {
    cover.addEventListener('load', reveal, {once:true});
    cover.addEventListener('error', reveal, {once:true});
    setTimeout(reveal, 8000);
  }

  function windows(){
    const list=[window];
    try{if(window.parent&&window.parent!==window)list.push(window.parent)}catch(_){}
    try{if(window.top&&!list.includes(window.top))list.push(window.top)}catch(_){}
    return list;
  }
  function find(read){
    for(const win of windows()){
      try{const value=read(win);if(value)return value}catch(_){}
    }
    return null;
  }
  function setDep(id,ok){
    const item=byId('dep-'+id);
    item.classList.remove('checking','ok','fail');
    item.classList.add(ok?'ok':'fail');
    item.title=ok?'已就绪':'未检测到';
    return ok;
  }
  function promptReady(){
    return !!find((win)=>{
      const st=win.SillyTavern;
      const ctx=st&&typeof st.getContext==='function'?st.getContext():null;
      const settings=ctx&&ctx.extensionSettings;
      const ejs=settings&&(settings.EjsTemplate||settings.ejsTemplate);
      return ejs&&ejs.enabled;
    });
  }
  function checkDeps(){
    const results=[
      setDep('mvu',!!find((win)=>win.Mvu&&typeof win.Mvu.getMvuData==='function'&&typeof win.Mvu.replaceMvuData==='function')),
      setDep('prompt',promptReady()),
      setDep('assets',!!find((win)=>win.__素材缓存脚本_loaded__||win.__临江素材缓存_loaded__||(win.LinjiangAssets&&typeof win.LinjiangAssets.url==='function'))),
      setDep('aux',!!find((win)=>win.__管人痴辅助计算_loaded__||(win.LinjiangAux&&typeof win.LinjiangAux.roomMenu==='function'))),
      setDep('phone',!!find((win)=>win.__小手机脚本_loaded__||typeof win.openMobilePhone==='function'))
    ];
    const count=results.filter(Boolean).length;
    summary.className='dep-summary '+(count===results.length?'all-ok':'has-fail');
    summary.textContent=count===results.length?'全部就绪':count+' / '+results.length+' 项就绪';
  }
  byId('refreshDeps').addEventListener('click',()=>{
    document.querySelectorAll('.dep-item').forEach((item)=>{item.classList.remove('ok','fail');item.classList.add('checking')});
    summary.className='dep-summary';summary.textContent='正在检测…';setTimeout(checkDeps,350);
  });
  agreeCheck.addEventListener('change',()=>{enterBtn.disabled=!agreeCheck.checked});

  function api(name){return find((win)=>typeof win[name]==='function'?win[name].bind(win):null)}
  function notify(text){
    toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.remove('show'),2600);
  }
  enterBtn.addEventListener('click',async()=>{
    if(!agreeCheck.checked||enterBtn.classList.contains('busy'))return;
    enterBtn.classList.add('busy');enterBtn.textContent='正在载入…';
    try{
      const getChatMessages=api('getChatMessages');
      const setChatMessage=api('setChatMessage');
      if(!getChatMessages||!setChatMessage)throw new Error('未找到酒馆消息接口');
      const messages=await getChatMessages('0',{include_swipe:true});
      const first=messages&&messages[0];const swipeId=1;
      if(!first||!first.swipes||!first.swipes[swipeId])throw new Error('开场白 2 尚未配置');
      await setChatMessage(first.swipes[swipeId],0,{swipe_id:swipeId,refresh:'display_and_render_current'});
      const toastr=find((win)=>win.toastr&&typeof win.toastr.success==='function'?win.toastr:null);
      if(toastr)toastr.success('已进入游戏');else notify('已进入游戏');
    }catch(error){
      console.error('[封面] 进入失败:',error);
      const message='进入失败：'+(error&&error.message?error.message:'未知错误');
      const toastr=find((win)=>win.toastr&&typeof win.toastr.error==='function'?win.toastr:null);
      if(toastr)toastr.error(message);else notify(message);
      enterBtn.classList.remove('busy');enterBtn.textContent='开始游戏';
    }
  });
  setTimeout(checkDeps,1000);setTimeout(checkDeps,3000);
})();
</script>
</body>
</html>
