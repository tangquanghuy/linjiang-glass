<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临江 · 开局配置</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Outfit:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  /* 视觉沿用开局页 opening.css 的那套令牌，卡片就是那块玻璃壳的一小段截面。
     跟开局页同一次改动：填充退到近乎没有、模糊压低，景深靠 backdrop-filter
     的 brightness() 压暗透过来的光来拿，而不是往上刷一块深紫板。
     这张卡衬的是酒馆聊天背景（深浅都有可能），压暗对两种底都成立，
     刷固定深色只对深色主题成立。 */
  :root {
    --ink: #fff;
    --mute: rgba(255, 255, 255, .82);
    --faint: rgba(255, 255, 255, .70);
    --line: rgba(255, 255, 255, .22);
    --rim: rgba(255, 255, 255, .46);
    --pink: #ffa3c9;
    --blue: #a9d6ff;
    --ok: #9ff0cd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    padding: 2px;
    color: var(--ink);
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #launch {
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 18px 24px;
    padding: 20px 24px;
    border: 1px solid var(--rim);
    border-radius: 22px;
    /* 填充只是一层几乎不存在的白，颜色让背景给 */
    background: linear-gradient(158deg, rgba(255, 255, 255, .10), rgba(186, 198, 255, .05) 46%, rgba(255, 206, 232, .08));
    box-shadow:
      0 22px 60px -28px rgba(12, 8, 30, .55),
      inset 0 1px 0 rgba(255, 255, 255, .58),
      inset 0 -1px 0 rgba(255, 255, 255, .12),
      /* 亮边压在浅色主题上会整条消失，补一圈极淡的外描边当轮廓 */
      0 0 0 1px rgba(28, 22, 58, .10);
    backdrop-filter: blur(8px) saturate(1.5) brightness(.62) contrast(1.05);
    -webkit-backdrop-filter: blur(8px) saturate(1.5) brightness(.62) contrast(1.05);
    /* 玻璃薄了之后白字底下什么都可能滑过去，给文字自己一层贴身暗影兜底 */
    text-shadow: 0 1px 3px rgba(20, 16, 46, .55), 0 0 14px rgba(20, 16, 46, .28);
  }
  #launch::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    /* 一道窄而亮的斜切反光，不是一整片雾——"晶莹"是这么来的 */
    background:
      radial-gradient(56% 120% at 8% 0%, rgba(255, 163, 201, .14), transparent 70%),
      radial-gradient(48% 130% at 96% 4%, rgba(169, 214, 255, .14), transparent 72%),
      linear-gradient(118deg, rgba(255, 255, 255, .30), rgba(255, 255, 255, .05) 16%, transparent 34%, transparent 74%, rgba(255, 255, 255, .14));
  }
  #launch > * { position: relative; }
  /* backdrop-filter 不可用时，压暗那一步就没了，白字会糊在亮底上。
     这种情况退回到不透明深底——闷，但至少读得出来。 */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    #launch {
      background: linear-gradient(135deg, rgba(50, 59, 105, .92), rgba(17, 22, 51, .94) 48%, rgba(51, 36, 74, .9));
    }
  }

  .brand { display: flex; align-items: center; gap: 15px; min-width: 0; }
  .mark {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .62);
    background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .62), rgba(255, 255, 255, .14));
    box-shadow: 0 0 26px rgba(255, 178, 212, .30), inset 0 1px 0 rgba(255, 255, 255, .7);
  }
  .mark img { width: 23px; height: 23px; object-fit: contain; }
  .script {
    flex: 0 0 auto;
    font: 400 30px/1 'Pinyon Script', cursive;
    color: #fff;
    text-shadow: 0 2px 18px rgba(255, 160, 205, .55);
  }
  .copy { min-width: 0; }
  .copy .eyebrow {
    color: var(--faint);
    font: 600 10px/1.4 'Outfit', 'Noto Sans SC', sans-serif;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .copy h1 { margin-top: 4px; font-size: 17px; font-weight: 600; letter-spacing: .1em; }
  .copy p { margin-top: 5px; color: var(--mute); font-size: 12px; line-height: 1.5; }

  #open {
    position: relative;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 12px 24px;
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 999px;
    /* 主按钮反过来做成实心亮片：整张卡都透了，唯一的落点得是不透明的，
       不然"开始配置"跟背景一起飘 */
    background: linear-gradient(135deg, #fff2f8, #e6f1ff 58%, #fff3dd);
    box-shadow: 0 14px 30px -14px rgba(255, 170, 208, .8), inset 0 1px 0 #fff;
    color: #3a2740;
    text-shadow: none;
    font: 600 14px/1 'Noto Sans SC', system-ui, sans-serif;
    letter-spacing: .1em;
    cursor: pointer;
    transition: border-color .18s, box-shadow .18s, transform .18s;
  }
  #open i {
    font-style: normal;
    font-family: 'Outfit', sans-serif;
    opacity: .8;
    transition: transform .18s;
  }
  #open:hover {
    border-color: #fff;
    box-shadow: 0 16px 34px -14px rgba(255, 120, 176, .9), inset 0 1px 0 #fff;
    filter: brightness(1.04);
  }
  #open:hover i { transform: translateX(3px); }
  #open:active { transform: translateY(1px); }

  .steps {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .steps span {
    display: inline-flex;
    align-items: baseline;
    gap: 7px;
    padding: 6px 13px;
    border: 1px solid rgba(255, 255, 255, .26);
    border-radius: 999px;
    /* 小字块用淡深色底 + 自己再压一档亮度：白色底在亮背景上是"提亮"，
       小字会被一起冲掉；压暗才压得住，而且照样透 */
    background: rgba(24, 20, 52, .16);
    backdrop-filter: blur(3px) brightness(.82);
    -webkit-backdrop-filter: blur(3px) brightness(.82);
    color: var(--mute);
    font-size: 12px;
  }
  .steps span em {
    font: 400 10px/1 'Outfit', sans-serif;
    font-style: normal;
    letter-spacing: .12em;
    color: var(--faint);
  }

  #status {
    grid-column: 1 / -1;
    display: none;
    align-items: center;
    gap: 9px;
    padding: 9px 14px;
    border: 1px solid rgba(255, 255, 255, .26);
    border-radius: 12px;
    background: rgba(24, 20, 52, .16);
    backdrop-filter: blur(3px) brightness(.82);
    -webkit-backdrop-filter: blur(3px) brightness(.82);
    color: var(--mute);
    font-size: 12px;
    line-height: 1.5;
  }
  #status.on { display: flex; }
  #status::before {
    content: '';
    flex: 0 0 auto;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 12px var(--blue);
  }
  #status.ok { color: rgba(214, 245, 233, .9); }
  #status.ok::before { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
  #status.warn { color: rgba(255, 214, 236, .9); }
  #status.warn::before { background: var(--pink); box-shadow: 0 0 12px var(--pink); }

  @media (max-width: 520px) {
    #launch { grid-template-columns: minmax(0, 1fr); gap: 13px; padding: 18px; border-radius: 18px; }
    .brand { gap: 12px; align-items: flex-start; }
    .script { display: none; }
    .copy h1 { font-size: 16px; }
    #open { width: 100%; justify-content: center; padding: 11px 18px; }
    .steps { gap: 6px; padding-top: 13px; }
    .steps span { padding: 5px 11px; font-size: 11px; }
  }
</style>
</head>
<body>
<div id="launch">
  <div class="brand">
    <div class="mark"><img src="https://tangquanghuy.github.io/linjiang-glass/assets/mark-sakura.png" alt=""></div>
    <div class="script">Linjiang</div>
    <div class="copy">
      <div class="eyebrow">Opening Profile · 2026</div>
      <h1>在临江开始生活</h1>
      <p>四步定下玩家资料、住所与工作、自定义主播；确认后写回 MVU 与世界书。</p>
    </div>
  </div>
  <button id="open" type="button">开始配置 <i>&rarr;</i></button>
  <div class="steps">
    <span><em>01</em>关于你</span>
    <span><em>02</em>住所与工作</span>
    <span><em>03</em>自定义主播</span>
    <span><em>04</em>确认</span>
  </div>
  <div id="status"></div>
</div>
<script>
(function () {
  /* 粘进角色卡的「开局」楼层。本页与酒馆同源，能摸到 parent.Mvu / TavernHelper；
     开局页本身托管在 GitHub Pages（跨域），只通过 postMessage 和这里说话。
     这里只做三件事：全屏挂起开局页、代跑人设生成、把 commitPreview 写回酒馆。 */
  const OPENING_URL = 'https://tangquanghuy.github.io/linjiang-glass/opening.html';
  // const OPENING_URL = 'http://127.0.0.1:5173/opening.html';
  const CHANNEL = 'linjiang-opening';
  const OVERLAY_ID = 'linjiang-opening-overlay';
  const STYLE_ID = 'linjiang-opening-style';
  const PROFILE_FIELDS = ['一句话定位', '外貌', '公开形象', '真实性格', '说话方式', '直播风格',
    '兴趣与擅长', '生活习惯', '喜恶与雷区', '个人经历', '对观众的态度', '线上线下差异'];

  const statusBox = document.getElementById('status');
  const openBtn = document.getElementById('open');
  const openingOrigin = (() => {
    try { return new URL(OPENING_URL, location.href).origin; }
    catch (e) { return '*'; }
  })();
  let frame = null;

  const say = (text, tone) => {
    statusBox.textContent = text || '';
    statusBox.className = text ? ('on' + (tone ? ' ' + tone : '')) : '';
  };

  const tavernWin = () => {
    try { if (window.top && window.top !== window) return window.top; } catch (e) {}
    try { if (window.parent && window.parent !== window) return window.parent; } catch (e) {}
    return window;
  };

  const getCoreWindow = () => {
    const wins = [];
    try { if (window.parent) wins.push(window.parent); } catch (e) {}
    try { if (window.top && window.top !== window.parent) wins.push(window.top); } catch (e) {}
    wins.push(window);
    for (const win of wins) {
      try { if (win && win.Mvu && typeof win.Mvu.getMvuData === 'function') return win; } catch (e) {}
    }
    for (const win of wins) {
      try { if (win && win.TavernHelper) return win; } catch (e) {}
    }
    return window.parent || window;
  };

  const getMvu = () => {
    const win = getCoreWindow();
    try {
      if (win && win.Mvu && typeof win.Mvu.getMvuData === 'function'
          && typeof win.Mvu.replaceMvuData === 'function') return win.Mvu;
    } catch (e) {}
    return null;
  };

  const getHelper = () => {
    try { return getCoreWindow().TavernHelper || null; } catch (e) { return null; }
  };

  /* ---------- 全屏挂起开局页 ---------- */

  const ensureStyle = (doc) => {
    if (doc.getElementById(STYLE_ID)) return;
    const style = doc.createElement('style');
    style.id = STYLE_ID;
    style.textContent = [
      '#' + OVERLAY_ID + '{position:fixed;left:0;top:0;width:100%;height:100%;',
      'z-index:2147483646;background:#05040a;display:block;}',
      '#' + OVERLAY_ID + ' iframe{display:block;width:100%;height:100%;border:0;background:#05040a;}',
      '#' + OVERLAY_ID + ' .lj-close{position:absolute;right:14px;top:14px;width:36px;height:36px;',
      'display:grid;place-items:center;border:1px solid rgba(232,236,255,.55);border-radius:50%;',
      'background:rgba(24,30,62,.82);color:#fff;font:600 18px/1 system-ui,sans-serif;cursor:pointer;',
      'backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);}',
      '#' + OVERLAY_ID + ' .lj-close:hover{background:rgba(48,58,110,.9);}',
    ].join('');
    doc.head.appendChild(style);
  };

  const closeOverlay = () => {
    const doc = tavernWin().document;
    const box = doc.getElementById(OVERLAY_ID);
    if (box) box.remove();
    frame = null;
    try { tavernWin().removeEventListener('keydown', onKey); } catch (e) {}
  };

  const onKey = (event) => { if (event.key === 'Escape') closeOverlay(); };

  const openOverlay = () => {
    const win = tavernWin();
    const doc = win.document;
    closeOverlay();
    ensureStyle(doc);
    const box = doc.createElement('div');
    box.id = OVERLAY_ID;
    const inner = doc.createElement('iframe');
    inner.title = '临江开局配置';
    inner.loading = 'eager';
    inner.referrerPolicy = 'strict-origin-when-cross-origin';
    inner.allow = 'clipboard-read; clipboard-write; fullscreen';
    inner.src = OPENING_URL;
    const close = doc.createElement('button');
    close.type = 'button';
    close.className = 'lj-close';
    close.textContent = '×';
    close.title = '关闭开局配置';
    /* 内联 onclick 跑在酒馆文档自己的作用域里：本楼层被重绘掉之后，关闭按钮仍然有效。 */
    close.setAttribute('onclick', "this.parentNode && this.parentNode.remove()");
    close.addEventListener('click', closeOverlay);
    box.appendChild(inner);
    box.appendChild(close);
    doc.body.appendChild(box);
    frame = inner;
    try { win.addEventListener('keydown', onKey); } catch (e) {}
    if (getMvu()) say('开局页已打开；完成后点「确认」写回。');
    else say('开局页已打开，但没检测到 MVU，写回会失败。', 'warn');
  };

  /* ---------- 人设生成：代跑酒馆的模型 ---------- */

  const parseProfile = (raw) => {
    let text = String(raw || '').trim();
    text = text.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
    const start = text.indexOf('{');
    const end = text.lastIndexOf('}');
    if (start < 0 || end <= start) throw new Error('模型没有返回 JSON');
    const data = JSON.parse(text.slice(start, end + 1));
    const profile = {};
    for (const key of PROFILE_FIELDS) {
      const value = data[key];
      if (value == null) continue;
      profile[key] = Array.isArray(value) ? value.join('；') : String(value);
    }
    if (!Object.keys(profile).length) throw new Error('JSON 里没有可用字段');
    return profile;
  };

  const generateStreamerProfile = async (input) => {
    const helper = getHelper();
    if (!helper || typeof helper.generateRaw !== 'function') throw new Error('TavernHelper.generateRaw 不可用');
    const d = input || {};
    const brief = [
      '姓名: ' + (d.name || ''),
      '主播网名: ' + (d.handle || ''),
      '年龄: ' + (d.age || ''),
      '住所: ' + (d.home || '未设置'),
      '直播分类: ' + ((d.categories || []).join('、') || '杂谈'),
      '热度: ' + (d.heat != null ? d.heat : '') + (d.heatLabel ? '（' + d.heatLabel + '）' : ''),
      '粉丝数: ' + (d.followers != null ? d.followers : ''),
      '舰长数: ' + (d.captains != null ? d.captains : ''),
      '常用直播时间: ' + (d.hours || '不固定'),
      '气质关键词: ' + (d.tone || '无'),
      '玩家提供的素材: ' + (d.seed || '无'),
    ].join('\n');
    const system = [
      '你在为一部现实向直播题材作品补全一名自定义主播的人设档案。',
      '只输出一个 JSON 对象，不要写解释、不要用代码块。',
      '键必须是且仅是: ' + PROFILE_FIELDS.join('、') + '。',
      '每个值是一段 30~90 字的中文陈述，写具体的事实和习惯，不写夸张评价。',
      '必须与玩家提供的素材保持一致，不要推翻已给定的事实。',
    ].join('\n');
    const result = await helper.generateRaw({
      ordered_prompts: [
        { role: 'system', content: system },
        { role: 'user', content: brief },
      ],
      max_chat_history: 0,
      should_stream: false,
    });
    return { profile: parseProfile(result) };
  };

  /* ---------- 写回 MVU 与世界书 ---------- */

  const isPlain = (value) => !!value && typeof value === 'object' && !Array.isArray(value);

  const deepMerge = (target, source) => {
    for (const [key, value] of Object.entries(source || {})) {
      if (isPlain(value)) {
        if (!isPlain(target[key])) target[key] = {};
        deepMerge(target[key], value);
      } else {
        target[key] = value;
      }
    }
    return target;
  };

  const writeMvu = (stat) => {
    if (!isPlain(stat)) throw new Error('开局数据为空');
    const mvu = getMvu();
    if (!mvu) throw new Error('MVU 未就绪');
    const scopes = [{ type: 'message', message_id: 'latest' }, { type: 'chat' }];
    let written = 0;
    for (const scope of scopes) {
      try {
        const data = mvu.getMvuData(scope);
        if (!data) continue;
        if (!isPlain(data.stat_data)) data.stat_data = {};
        deepMerge(data.stat_data, stat);
        mvu.replaceMvuData(data, scope);
        written += 1;
      } catch (e) {
        console.warn('[临江开局] MVU 写入失败', scope, e);
      }
    }
    if (!written) throw new Error('MVU 写入失败');
    return written;
  };

  const worldbookEntry = (book) => ({
    name: book.name,
    comment: book.name,
    enabled: true,
    keys: book.keys || [],
    key: book.keys || [],
    content: book.content || '',
    strategy: { type: 'selective', keys: book.keys || [], keys_secondary: { logic: 'and_any', keys: [] } },
    position: { type: 'before_character_definition', role: 'system', depth: 4, order: 100 },
    probability: 100,
    recursion: { prevent_incoming: false, prevent_outgoing: false, delay_until: null },
  });

  const targetBookName = async (helper) => {
    try {
      const names = typeof helper.getCharWorldbookNames === 'function'
        ? helper.getCharWorldbookNames('current') : null;
      if (names && names.primary) return names.primary;
      if (names && Array.isArray(names.additional) && names.additional.length) return names.additional[0];
    } catch (e) {}
    for (const fn of ['getOrCreateChatWorldbook', 'getOrCreateChatLorebook']) {
      try {
        if (typeof helper[fn] === 'function') {
          const name = await helper[fn]('current');
          if (name) return name;
        }
      } catch (e) {}
    }
    return null;
  };

  const writeWorldbook = async (book) => {
    if (!book || !book.content) return false;
    const helper = getHelper();
    if (!helper) return false;
    const name = await targetBookName(helper);
    if (!name) return false;
    for (const fn of ['createWorldbookEntries', 'createLorebookEntries']) {
      try {
        if (typeof helper[fn] === 'function') {
          await helper[fn](name, [worldbookEntry(book)]);
          return name;
        }
      } catch (e) {
        console.warn('[临江开局] 世界书写入失败 ' + fn, e);
      }
    }
    return false;
  };

  const stashWorldbookText = (book) => {
    if (!book || !book.content) return false;
    try {
      const win = getCoreWindow();
      const doc = (win && win.document) ? win.document : document;
      const area = doc.getElementById('send_textarea');
      if (!area) return false;
      const current = String(area.value || '').trim();
      if (current.indexOf(book.content) === -1) {
        area.value = current ? (current + '\n\n' + book.content) : book.content;
        area.dispatchEvent(new Event('input', { bubbles: true }));
        area.dispatchEvent(new Event('change', { bubbles: true }));
      }
      return true;
    } catch (e) { return false; }
  };

  const commit = async (payload) => {
    const notes = [];
    try {
      writeMvu(payload && payload.mvu);
      notes.push('开局数据已写入 MVU');
    } catch (error) {
      say('写回失败：' + (error && error.message ? error.message : error), 'warn');
      return;
    }
    if (payload && payload.worldbook) {
      let book = false;
      try { book = await writeWorldbook(payload.worldbook); }
      catch (e) { book = false; }
      if (book) notes.push('人设已写入世界书《' + book + '》');
      else if (stashWorldbookText(payload.worldbook)) notes.push('世界书写入不可用，人设正文已放进输入框');
      else notes.push('世界书写入不可用，请从开局页复制人设正文');
    }
    say(notes.join('；') + '。', 'ok');
    closeOverlay();
  };

  /* ---------- 桥接 ---------- */

  const onMessage = async (event) => {
    const data = event.data;
    if (!data || data.channel !== CHANNEL) return;
    if (!frame || event.source !== frame.contentWindow) return;
    if (openingOrigin !== '*' && event.origin !== openingOrigin) return;

    if (data.kind === 'request') {
      const reply = { channel: CHANNEL, kind: 'response', id: data.id };
      try {
        if (data.action !== 'generateStreamerProfile') throw new Error('未知桥接动作: ' + data.action);
        say('正在用酒馆当前模型生成人设…');
        const payload = await generateStreamerProfile(data.payload || {});
        event.source.postMessage(Object.assign({ ok: true, payload }, reply), event.origin);
        say('人设已由酒馆模型生成。', 'ok');
      } catch (error) {
        event.source.postMessage(Object.assign({
          ok: false, error: error && error.message ? error.message : String(error),
        }, reply), event.origin);
        say('模型生成失败，开局页已用本地模板兜底。', 'warn');
      }
      return;
    }

    if (data.kind === 'event' && data.type === 'commitPreview') {
      await commit(data.payload || {});
    }
  };

  const bind = (win) => {
    try { win.addEventListener('message', onMessage); } catch (e) {}
  };

  bind(window);
  if (tavernWin() !== window) bind(tavernWin());
  openBtn.addEventListener('click', openOverlay);
  if (!getMvu()) say('未检测到 MVU，先让状态栏跑起来再开局。', 'warn');
})();
</script>
</body></html>
