      '时雨羽衣': { color: '#c49a3c', avatar: charAvatar('时雨羽衣'), aliases: ['时雨羽衣'], given_name: '时雨羽衣' },
      '红蔷薇': { color: '#c4332b', avatar: charAvatar('红蔷薇'), aliases: ['红蔷薇'], given_name: '红蔷薇' },
      '斯黛拉': { color: '#8b63b8', avatar: charAvatar('斯黛拉'), aliases: ['斯黛拉', '伊贺栖寅'], given_name: '斯黛拉' },
      '璃亚梦': { color: '#e84390', avatar: charAvatar('璃亚梦'), aliases: ['璃亚梦', '梦见璃亚梦'], given_name: '璃亚梦' }
    };

    // 内置角色名单（有头像的角色常驻，不依赖MVU）
    const BUILTIN_CHAR_NAMES = Object.keys(CHARACTER_CONFIG).filter(name => CHARACTER_CONFIG[name]?.avatar);

    // ==================== MVU 接入层 ====================
    const getCore = () => {
      try {
        const win = window.parent || window;
        const $ = window.jQuery || win.jQuery;
        return { window: win, $, getDB: () => win.AutoCardUpdaterAPI || window.AutoCardUpdaterAPI };
      } catch (e) {
        return { window: window, $: window.jQuery, getDB: () => window.AutoCardUpdaterAPI };
      }
    };

    const mvuState = {
      ready: false, mvu: null,
      check: () => {
        const win = getCore().window;
        if (typeof win.Mvu === 'undefined' || typeof win.Mvu.getMvuData !== 'function' || typeof win.Mvu.replaceMvuData !== 'function') {
          mvuState.ready = false; mvuState.mvu = null; return false;
        }
        mvuState.ready = true; mvuState.mvu = win.Mvu; return true;
      }
    };

    const fetchLatestMvuData = () => {
      let finalData = {};
      try {
        if (mvuState.ready || mvuState.check()) {
          const mvuData = mvuState.mvu.getMvuData({ type: 'message', message_id: 'latest' });
          if (mvuData?.stat_data && Object.keys(mvuData.stat_data).length > 0) {
            finalData = mvuData.stat_data;
          } else {
            const chatData = mvuState.mvu.getMvuData({ type: 'chat' });
            if (chatData?.stat_data && Object.keys(chatData.stat_data).length > 0) finalData = chatData.stat_data;
          }
        }
      } catch (e) { console.warn('[正文美化] MVU:', e); }
      return finalData;
    };

    const applyMvuPatches = (patches) => {
      try {
        if (!mvuState.ready && !mvuState.check()) return false;
        const scopes = [{ type: 'message', message_id: 'latest' }, { type: 'chat' }];
        for (const scope of scopes) {
          const mvuData = mvuState.mvu.getMvuData(scope);
          if (!mvuData?.stat_data || Object.keys(mvuData.stat_data).length === 0) continue;
          patches.forEach(patch => {
            const parts = patch.path.split('/').filter(Boolean);
            if (patch.op === 'replace' || patch.op === 'add') {
              let obj = mvuData.stat_data;
              for (let i = 0; i < parts.length - 1; i++) { if (!obj[parts[i]] || typeof obj[parts[i]] !== 'object') obj[parts[i]] = {}; obj = obj[parts[i]]; }
              obj[parts[parts.length - 1]] = patch.value;
            } else if (patch.op === 'remove') {
              let obj = mvuData.stat_data;
              for (let i = 0; i < parts.length - 1; i++) { if (!obj[parts[i]]) return; obj = obj[parts[i]]; }
              delete obj[parts[parts.length - 1]];
            }
          });
          mvuState.mvu.replaceMvuData(mvuData, scope);
          return true;
        }
        return false;
      } catch (e) { console.warn('[正文美化] MVU patch:', e); return false; }
    };
    // ==================== 直播间 <LiveRoom> ====================
    /* 直播间的表和算法都在 外部部署/V20260826/辅助计算脚本.js（parent.LinjiangAux）：
       礼物价格与人气点数、大航海档位、数量档位、牌子等级公式、名字折叠、以及一切写入。
       本文件同源，直接调，不用 postMessage。
       拿不到脚本时只有关注/取关直接写 MVU，其它消费动作仍保持只读，不在卡片里另算一套。 */
    function lrAux() {
      try {
        const win = window.parent || window;
        const api = win.LinjiangAux || window.LinjiangAux;
        return (api && api.roomAction) ? api : null;
      } catch (e) { return null; }
    }
    const LR_MENU_FALLBACK = { 礼物: [], 大航海: [], 数量档位: [1, 10, 66, 233], 醒目留言档位: [30, 50, 100], 资源域名: 'https://anchor.bolt.qzz.io' };

    /* 图片地址过一遍素材缓存（外部部署/V20260826/素材缓存脚本.js，挂在酒馆窗口上）。
       命中返回 blob: 地址，等于这一张图不出网；没装那个脚本、或者这个源不许跨源
       fetch（图床没给 ACAO）时原样返回远程地址，行为跟以前一样。
       卡片每条消息重渲染一次，所以这层省下来的是每次重渲染的那一轮请求。 */
    function assetUrl(remote) {
      const raw = String(remote || '');
      if (!raw) return raw;
      try {
        const win = window.parent || window;
        const api = win.LinjiangAssets || window.LinjiangAssets;
        return (api && typeof api.url === 'function') ? (api.url(raw) || raw) : raw;
      } catch (e) { return raw; }
    }
    function lrMenu() {
      const aux = lrAux();
      if (!aux) return LR_MENU_FALLBACK;
      try { return aux.roomMenu() || LR_MENU_FALLBACK; } catch (e) { return LR_MENU_FALLBACK; }
    }
    /* 这里原来有一张 LR_HOSTS：每个主播的封面文件名、档期、人气、牌子名。已经删掉——
       本文件只负责展示，不存表也不存数值。现在：
         档期 / 牌子名 / 底盘热度 / 大航海  → 读 MVU 的 系统配置.直播间.<名>
         热度                              → 读 MVU 的 对象信息.<名>.直播.热度
         封面                              → 有插画的角色随机取一张 SFW 通用图；
                                             自定义主播取开局页存进 localStorage 的那张
       主播名单也不再由这张表决定，改成看 对象信息 里有谁。 */
    const LR_TIER = { jian: '舰长', ti: '提督', du: '总督' };
    const LR_TIER_KEY = { '舰长': 'jian', '提督': 'ti', '总督': 'du' };
    const LR_TYPE_KEY = { '普通': 'chat', '舰长': 'chat', '提督': 'chat', '总督': 'chat', '礼物': 'gift', '醒目留言': 'sc', '进入': 'enter', '系统': 'sys' };
    /* 这里原来有六张表：礼物价格、人气点数、礼物图标、大航海档位、数量档位、醒目留言档位。
       全部搬到 辅助计算脚本.js，改从 lrMenu() 取。同一件礼物的价格/点数/图标原来分在
       三张表里，现在是一行。 */
    const LR_DEMO = `主播: 塔菲
主播说: 辛苦了。今晚先把加班那条醒目留言念了。
弹幕:
- 类型: 普通 名字: 云庭7楼 内容: 来了，电梯刚好卡在十三层
- 类型: 舰长 名字: 阿初 内容: 今日发型是认真的
- 类型: 提督 名字: 深海灯 内容: 王牌级杂谈，节奏稳
- 类型: 总督 名字: 临江夜航 内容: 别被火箭带跑
- 类型: 礼物 名字: 鼓岭晚风 礼物: 干杯 数量: 10
- 类型: 醒目留言 名字: 西洲加班人 金额: 30 内容: 加班到现在，求一句辛苦了
- 类型: 进入 名字: 湖滨卡座
- 类型: 系统 内容: 匿名棺 已被禁言`;

    /* 名字折叠（永雏塔菲→塔菲）也归辅助脚本，跟 mvuzod.js 的 GIRL_NAME_ALIAS 同一份。
       脚本没跑起来时原样返回，不在本文件里再存一张别名表。 */
    function lrCanonHost(name) {
      const aux = lrAux();
      const key = String(name || '').trim();
      if (!aux || !aux.canonName) return key;
      try { return aux.canonName(key) || key; } catch (e) { return key; }
    }
    function lrArt(folder, file) {
      return lrMenu().资源域名 + '/' + encodeURIComponent(folder) + '/' + encodeURIComponent(file) + '.webp';
    }
    function lrGiftItem(name) {
      const menu = lrMenu();
      return menu.礼物.find((g) => g.name === name) || menu.大航海.find((g) => g.name === name) || null;
    }
    function lrGiftSrc(name) {
      const item = lrGiftItem(name);
      return item ? item.图标 : '';
    }
    function lrEsc(s) { return escapeHtmlText(s); }
    function lrAttr(s) { return escapeHtmlAttr(s); }
    function lrYen(n) { return '￥' + Number(n || 0).toLocaleString('en-US'); }
    function lrPriceTag(n) { return n ? '¥' + n : '免费'; }
    function lrFormatPop(n) {
      const x = Number(n) || 0;
      if (x >= 10000) return (Math.round(x / 1000) / 10).toFixed(1).replace(/\.0$/, '') + '万';
      if (x >= 1000) return String(Math.round(x / 100) * 100);
      return String(x);
    }
    /* 原来这里有 lrRoundViewers 和 lrBadgeLevel 两个算法，跟 辅助计算脚本.js 里的
       roundNice / badgeLevel 是同一段公式写了两遍。已删——牌子等级现在从
       roomView() 的快照里读，取整由脚本在写回时负责。 */
    function lrParseNum(v) {
      const n = Number(String(v == null ? '' : v).replace(/,/g, ''));
      return Number.isFinite(n) ? n : 0;
    }
    function lrIsTrue(v) {
      if (v === true || v === 1) return true;
      if (typeof v === 'string') {
        const t = v.trim().toLowerCase();
        return t === 'true' || t === '1' || t === '是' || t === 'yes';
      }
      return false;
    }

    function lrReadStat() {
      try { return fetchLatestMvuData() || {}; }
      catch (e) { return {}; }
    }
    function lrPlayer(stat) { return (stat && stat.玩家信息) || {}; }
    function lrGirl(stat, name) { return ((stat && stat.对象信息) || {})[name] || {}; }
    function lrFan(stat, name) { return (lrPlayer(stat).粉丝身份 || {})[name] || {}; }
    /* 直播间封面。
       有插画的角色（IMAGE_LISTS.SFW 里有条目）随机取一张「通用N」——SFW 索引用的是短名，
       所以不需要那个 璃亚梦→梦见璃亚梦 的文件名映射了。
       自定义主播没有插画，取开局页写进 localStorage 的封面（键沿用自定义角色那套
       custom_char_cover_<名>），再退到头像。图片地址一律不进 MVU，太占地方。 */
    const LR_COVER_PREFIX = 'custom_char_cover_';
    function lrPickSfwCover(host) {
      const entry = findImageListEntry('SFW', host, '通用');
      if (!entry || !entry.numbers.length) return '';
      const n = entry.numbers[Math.floor(Math.random() * entry.numbers.length)];
      return lrMenu().资源域名 + '/SFW/' + encodeURIComponent(entry.characterKey) + '/'
        + encodeURIComponent(entry.sceneKey + n) + '.webp';
    }
    function lrCoverSrc(host) {
      const sfw = lrPickSfwCover(host);
      if (sfw) return sfw;
      try {
        const saved = localStorage.getItem(LR_COVER_PREFIX + host);
        if (saved) return saved;
      } catch (e) { /* 隐身模式读不到就退头像 */ }
      const avatar = getAvatarFromCache(host);
      if (avatar) return avatar;
      return lrArt('头像', host);
    }
    function lrRoomCfg(stat, name) { return (((stat && stat.系统配置) || {}).直播间 || {})[name] || {}; }

    /* 主播名单以 MVU 的 对象信息 为准，不再看本文件里的写死表——
       这样开局页新建的自定义主播自动就认得。 */
    function lrKnownHosts(stat) {
      const girls = (stat && stat.对象信息) || {};
      return Object.keys(girls).filter((n) => girls[n] && girls[n].直播);
    }
    function lrPickHost(parsed) {
      const stat = lrReadStat();
      const hosts = lrKnownHosts(stat);
      const has = (n) => !!n && hosts.indexOf(n) >= 0;
      const fromTag = lrCanonHost(parsed.主播);
      if (has(fromTag)) return fromTag;
      const watching = lrCanonHost(lrPlayer(stat).所在直播间);
      if (has(watching)) return watching;
      const girls = (stat && stat.对象信息) || {};
      const live = hosts.find((n) => lrIsTrue(girls[n].直播.开播));
      return live || fromTag || hosts[0] || '塔菲';
    }

    /* 弹幕的语法层（一行 → 字段表）由 辅助计算脚本.js 持有：那边要拿同一份语法
       数弹幕算热度，两边各写一个正则迟早会漂。下面这段是它的兜底实现，只在
       拿不到脚本时用（file:// 直接打开的 demo 就走这条）。
       字段表 → 渲染结构的映射仍然在本文件的 lrParseDanmuLine 里，那是显示层。 */
    function lrSplitLineFields(line) {
      const aux = lrAux();
      if (aux && typeof aux.parseRoomLine === 'function') {
        try { return aux.parseRoomLine(line); } catch (e) { /* 掉回本地实现 */ }
      }
      const text = String(line || '');
      const re = /(类型|名字|礼物|数量|金额|内容|牌子)\s*[:：]/g;
      const hits = [];
      let m;
      while ((m = re.exec(text))) hits.push({ key: m[1], at: m.index, end: m.index + m[0].length });
      if (!hits.length) return null;
      const fields = {};
      for (let i = 0; i < hits.length; i++) {
        const to = i + 1 < hits.length ? hits[i + 1].at : text.length;
        fields[hits[i].key] = text.slice(hits[i].end, to).trim();
      }
      return fields;
    }

    function lrParseDanmuLine(rawLine) {
      const line = String(rawLine || '').replace(/^[-•]\s+/, '').trim();
      if (!line) return null;
      const fields = lrSplitLineFields(line);
      if (!fields || !fields.类型) return null;
      const typeName = fields.类型;
      const kind = LR_TYPE_KEY[typeName] || 'chat';
      const item = {
        type: kind,
        user: fields.名字 || '',
        text: fields.内容 || '',
        // 粉丝牌整串照收（可以是别家主播的牌子，串门观众就靠这个体现），
        // 只把结尾的等级夹到 20 —— 玩家侧 lrBadgeLevel 的上限也是 20，
        // 否则路人随手一个 35 级，玩家再怎么打赏都追不上。
        medal: String(fields.牌子 || '').trim().replace(/(\d+)\s*$/, (m, n) => Math.min(20, +n)),
        gift: fields.礼物 || '',
        n: Math.max(1, parseInt(fields.数量, 10) || 1),
        amount: Math.max(0, parseInt(fields.金额, 10) || 0)
      };
      if (LR_TIER_KEY[typeName]) item.tier = LR_TIER_KEY[typeName];
      if (kind === 'sys') {
        if (!item.text) return null;
        return item;
      }
      if (!item.user) return null;
      if ((kind === 'chat' || kind === 'sc') && !item.text) return null;
      if (kind === 'gift' && !item.gift) return null;
      if (kind === 'gift' && !item.text) item.text = item.gift + ' x' + item.n;
      return item;
    }

    function parseLiveRoom(raw) {
      const decoded = decodeHtmlEntities(String(raw || ''));
      const room = { 主播: '', 主播说: '', 弹幕: [] };
      let inDanmu = false;
      decoded.split(/\r?\n/).forEach((line) => {
        const trimmed = line.trim();
        if (!trimmed) return;
        if (/^弹幕\s*[:：]/.test(trimmed)) { inDanmu = true; return; }
        if (/^主播说\s*[:：]/.test(trimmed)) {
          inDanmu = false;
          room.主播说 = trimmed.replace(/^主播说\s*[:：]\s*/, '');
          return;
        }
        if (/^主播\s*[:：]/.test(trimmed)) {
          inDanmu = false;
          room.主播 = lrCanonHost(trimmed.replace(/^主播\s*[:：]\s*/, ''));
          return;
        }
        if (/^[-•]\s+/.test(trimmed) || inDanmu) {
          const item = lrParseDanmuLine(trimmed);
          if (item) room.弹幕.push(item);
        }
      });
      return room;
    }

    /* 礼物图标只有一个来源：辅助计算脚本 roomMenu().礼物[].图标（ART_HOST 拼出来的绝对地址）。
       原来这里还调了个 lrGiftCdn 做备用域名兜底，那个函数在图标表合并进辅助脚本时就没了，
       留在这儿等于每次画礼物按钮都抛 ReferenceError，整个 processTextContent 直接断掉。 */
    function lrImg(name) {
      const src = lrGiftSrc(name);
      // data-lr-far 留着远程地址：万一 blob: 地址在这个 iframe 里用不了，onerror 回退直连
      return `<img src="${lrAttr(assetUrl(src))}" data-lr-far="${lrAttr(src)}" alt="" loading="lazy" decoding="async"`
        + ` onerror="if(this.dataset.lrFar&&this.src!==this.dataset.lrFar){this.src=this.dataset.lrFar;delete this.dataset.lrFar}else this.style.display='none'">`;
    }

    function renderLiveRoom(raw, idx) {
      const parsed = parseLiveRoom(raw);
      const payload = encodeURIComponent(JSON.stringify(parsed));
      return `<div class="liveroom-wrap"><div class="liveroom" data-lr data-lr-idx="${idx}" data-lr-payload="${payload}">
        <header class="room-h">
          <div class="host">
            <div class="avatar"><img data-lr="avatar" alt="" loading="lazy" decoding="async" onerror="this.parentNode.style.background='#3a2a32'"></div>
            <div class="meta">
              <h1 data-lr="title"></h1>
              <p><span data-lr="name"></span><span data-lr="slot"></span><span data-lr="pop"></span></p>
            </div>
          </div>
          <div class="acts">
            <button class="pause" type="button" data-lr-act="danmu">弹幕 开</button>
            <button class="follow" type="button" data-lr-act="follow">+ 关注</button>
          </div>
        </header>
        <div class="cam" data-lr="cam">
          <img class="feed" data-lr="feed" alt="" loading="lazy" decoding="async" onerror="this.style.display='none'">
          <span class="live" data-lr="live"><i></i>LIVE</span>
          <div class="danmu" data-lr="danmu"></div>
          <div class="toast" data-lr="toast">${lrImg('干杯')}<b></b><span></span></div>
        </div>
        <aside class="side">
          <div class="tabs">
            <button class="tab on" type="button" data-lr-tab="chat">互动</button>
            <button class="tab" type="button" data-lr-tab="navy">大航海</button>
            <button class="tab" type="button" data-lr-tab="rank">高能榜</button>
          </div>
          <div class="pin" data-lr="pin"></div>
          <div class="pane on" data-lr="chat" role="log" aria-live="polite"></div>
          <div class="pane" data-lr="navy"></div>
          <div class="pane" data-lr="rank"></div>
          <form class="send" data-lr="form">
            <input data-lr="say" maxlength="30" placeholder="发个弹幕和主播互动吧" autocomplete="off">
            <div class="send-acts">
              <button class="sc-btn" type="button" data-lr-act="sc">醒目留言</button>
              <button class="go" type="submit">发送</button>
            </div>
          </form>
        </aside>
        <div class="tray">
          <div class="wallet">金钱 <b data-lr="money"></b></div>
          <div class="rail">
            <button class="nudge prev off" type="button" data-lr-act="gift-prev" aria-label="向左看更多礼物"><i><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M8 2 4 6l4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></i></button>
            <div class="pills" data-lr="gifts"></div>
            <button class="nudge next off" type="button" data-lr-act="gift-next" aria-label="向右看更多礼物"><i><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></i></button>
          </div>
        </div>
        <div class="overlay" data-lr="overlay"><div class="dlg" data-lr="dlg" role="dialog" aria-modal="true"></div></div>
      </div></div>`;
    }

    function lrEl(root, key) { return root.querySelector('[data-lr="' + key + '"]'); }

    function lrPrefix(item) {
      return (item.medal ? `<span class="medal">${lrEsc(item.medal)}</span>` : '')
        + (item.tier ? `<span class="bdg ${item.tier}">${LR_TIER[item.tier] || ''}</span>` : '');
    }
    function lrScBand(n) { return n >= 100 ? '100' : n >= 50 ? '50' : '30'; }
    function lrScHold(amount) {
      const n = Number(amount) || 0;
      if (n >= 100) return 5 * 60 * 1000;
      if (n >= 50) return 2 * 60 * 1000;
      return 60 * 1000;
    }
    function lrScHtml(item) {
      return `<div class="sc sc-${lrScBand(item.amount)}"><div class="sc-h"><span>${lrEsc(item.user)}</span><span>¥${item.amount}</span></div><div class="sc-b">${lrEsc(item.text)}</div></div>`;
    }
    function lrHtmlOf(item) {
      if (item.type === 'enter') return `<p class="row enter">${lrEsc(item.user)} 来了</p>`;
      if (item.type === 'sys') return `<p class="row sys">${lrEsc(item.text)}</p>`;
      if (item.type === 'gift') {
        return `<p class="row gift-line"><span class="name">${lrEsc(item.user)}</span>投喂了 <em>${lrEsc(item.gift)}</em> x${item.n}</p>`;
      }
      if (item.type === 'sc') return `<div class="row">${lrScHtml(item)}</div>`;
      return `<p class="row ${item.host ? 'host-say' : ''} ${item.tier || ''}">${lrPrefix(item)}<span class="name">${lrEsc(item.user)}:</span><span>${lrEsc(item.text)}</span></p>`;
    }

    function lrPlayerMedal(state) {
      const lv = state.badge || 0;
      if (!lv) return '';
      // 牌子名来自 MVU 的 系统配置.直播间.<名>.牌子名，本文件不存
      return (state.medal || state.host) + ' ' + lv;
    }
    function lrPlayerTier(state) {
      return LR_TIER_KEY[state.tier] || '';
    }

    function lrPush(state, item, self) {
      const chat = lrEl(state.root, 'chat');
      chat.insertAdjacentHTML('beforeend', lrHtmlOf(item));
      while (chat.children.length > 46) chat.removeChild(chat.firstChild);
      chat.scrollTop = chat.scrollHeight;
      if (item.type === 'sc') lrPinSc(state, item);
      if (item.type === 'gift') lrShowToast(state, item);
      lrSpawnFly(state, item, self);
    }

    function lrLayoutMode(root) {
      const width = root.clientWidth;
      const hostLayout = document.body?.dataset.hostLayout;
      const hostMobile = hostLayout ? hostLayout === 'mobile' : window.innerWidth <= 768;
      if (width <= 440 || (hostMobile && width <= 580)) return 'stacked';
      if (width <= 580) return 'compact';
      return 'wide';
    }

    function lrPlacePin(state) {
      const root = state.root;
      const pin = lrEl(root, 'pin');
      const cam = lrEl(root, 'cam');
      const tabs = root.querySelector('.tabs');
      if (!pin || !cam || !tabs) return;
      const mode = lrLayoutMode(root);
      root.classList.toggle('is-stacked', mode === 'stacked');
      root.classList.toggle('is-compact', mode === 'compact');
      if (mode === 'stacked') {
        if (pin.parentNode !== cam) cam.appendChild(pin);
      } else if (pin.previousElementSibling !== tabs) {
        tabs.after(pin);
      }
    }

    function lrPlayPin(state) {
      lrPlacePin(state);
      cancelAnimationFrame(state.scRaf || 0);
      const pin = lrEl(state.root, 'pin');
      const item = (state.scQueue || []).shift();
      if (!item || !pin) {
        if (pin) {
          pin.className = 'pin';
          pin.innerHTML = '';
          pin.style.opacity = '';
          pin.style.removeProperty('--sc-p');
        }
        state.scCur = null;
        return;
      }
      pin.className = 'pin show sc-' + lrScBand(item.amount);
      pin.style.opacity = '1';
      pin.style.setProperty('--sc-p', 1);
      pin.innerHTML = `<div class="pin-h"><span class="pin-tag">醒目留言</span><span class="pin-user">${lrEsc(item.user)}</span><span class="pin-yen">¥ ${item.amount}.00</span><span class="pin-bar"><span></span></span></div><p class="pin-t">${lrEsc(item.text)}</p>`;
      const hold = lrScHold(item.amount);
      state.scCur = { item, hold, left: hold, last: performance.now() };
      const tick = (now) => {
        if (!state.scCur) return;
        if (!pin.isConnected) { cancelAnimationFrame(state.scRaf); state.scCur = null; return; }
        state.scCur.left -= now - state.scCur.last;
        state.scCur.last = now;
        const p = Math.max(0, state.scCur.left / state.scCur.hold);
        pin.style.setProperty('--sc-p', String(p));
        pin.style.opacity = p < 0.2 ? String(0.28 + (p / 0.2) * 0.72) : '1';
        if (p <= 0) {
          pin.style.opacity = '';
          pin.classList.add('out');
          state.scCur = null;
          setTimeout(() => lrPlayPin(state), 420);
          return;
        }
        state.scRaf = requestAnimationFrame(tick);
      };
      state.scRaf = requestAnimationFrame(tick);
    }
    function lrPinSc(state, item) {
      if (!state.scQueue) state.scQueue = [];
      state.scQueue.push(item);
      if (!state.scCur) lrPlayPin(state);
    }

    function lrShowToast(state, item) {
      const toast = lrEl(state.root, 'toast');
      const img = toast.querySelector('img');
      const far = lrGiftSrc(item.gift);
      img.dataset.lrFar = far;
      img.onerror = () => {
        if (img.dataset.lrFar && img.src !== img.dataset.lrFar) { img.src = img.dataset.lrFar; delete img.dataset.lrFar; }
        else img.style.display = 'none';
      };
      img.style.display = '';
      img.src = assetUrl(far);
      toast.querySelector('b').textContent = item.user;
      toast.querySelector('span').textContent = item.line || (`投喂了 ${item.gift} x${item.n}`);
      toast.classList.add('show');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function lrSpawnFly(state, item, self) {
      const cam = lrEl(state.root, 'cam');
      if (cam.classList.contains('quiet')) return;
      if (item.type !== 'chat' && item.type !== 'gift' && !item.host) return;
      const el = document.createElement('span');
      el.className = 'fly ' + (self ? 'self' : (item.tier || (item.type === 'gift' ? 'gift' : '') || (item.host ? 'self' : '')));
      el.textContent = item.type === 'gift' ? `${item.gift} x${item.n}` : (item.text || '');
      if (!el.textContent) return;
      /* 轨道号按 3 跳着走：相邻两条不会贴在一起，看上去更像真的在飘。
         速度从 5.5~7.6s 放慢到 10~13.5s ——原来一屏挤着十几条、还飘得快，
         叠在主播脸上根本读不完一句。 */
      const lane = state.lane % 9;
      el.style.top = `${4 + lane * 10}%`;
      el.style.animationDuration = `${9 + (state.lane % 7) * 0.5}s`;
      state.lane = (state.lane + 4) % 72;
      lrEl(state.root, 'danmu').appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    /* 公屏喂完之后不能空着——真直播间不会突然一条弹幕都没有。
       这里只往视频层补飞屏（从已经出现过的弹幕里随机挑），不往右侧公屏塞新行，
       免得凭空造出 AI 没写过的发言。卡片被移出 DOM 就自己停。 */
    function lrIdleFly(state) {
      clearTimeout(state.idleTimer);
      const pool = (state.parsed.弹幕 || []).filter((x) => x.type === 'chat' || x.type === 'gift');
      if (!pool.length) return;
      const tick = () => {
        if (!state.root.isConnected) return;
        const cam = lrEl(state.root, 'cam');
        if (cam && !cam.classList.contains('quiet')) {
          lrSpawnFly(state, pool[Math.floor(Math.random() * pool.length)]);
        }
        state.idleTimer = setTimeout(tick, 1600 + Math.random() * 2200);
      };
      state.idleTimer = setTimeout(tick, 1800);
    }

    /* 按真实节奏放弹幕：一条一条排队，每条间隔约 1~1.6s，20 条铺开半分钟左右。
       间隔和飞屏时长（9~12s）配起来，屏上同时最多七八条、九条轨道各占其一，能读完再走。
       原来是 i * 60，20 条 1.2 秒全喷完，公屏一次滚到底、飞屏一次全叠上，
       之后再没有新东西——就是「一上来全飘完然后没东西看」。 */
    function lrPlayQueue(state, list) {
      clearTimeout(state.queueTimer);
      const queue = (list || []).slice();
      const step = () => {
        if (!state.root.isConnected) return;
        const item = queue.shift();
        if (!item) { lrIdleFly(state); return; }
        lrPush(state, item);
        state.queueTimer = setTimeout(step, 980 + Math.random() * 620);
      };
      state.queueTimer = setTimeout(step, 240);
    }

    function lrPaintMoney(state) {
      lrEl(state.root, 'money').textContent = lrYen(state.money);
    }
    function lrPaintFollow(state) {
      const btn = state.root.querySelector('[data-lr-act="follow"]');
      btn.classList.toggle('on', !!state.follow);
      btn.textContent = state.follow ? '已关注' : '+ 关注';
      btn.setAttribute('aria-pressed', state.follow ? 'true' : 'false');
      btn.title = state.follow ? '点击取关' : '点击关注主播';
    }

    function lrSyncFollowFromMvu(state, paint) {
      const next = lrIsTrue(lrFan(lrReadStat(), state.host).关注);
      const changed = next !== state.follow;
      state.follow = next;
      if (paint !== false && changed) lrPaintFollow(state);
      return next;
    }

    function lrWriteFollowDirect(state, follow) {
      const ok = applyMvuPatches([{
        op: 'add',
        path: `/玩家信息/粉丝身份/${state.host}/关注`,
        value: follow === true
      }]);
      if (!ok) return { ok: false, 提示: 'MVU 关注状态写入失败' };
      return { ok: true, 花费: 0, 快照: { 关注: follow === true } };
    }
    function lrPaintPop(state) {
      // 直播间没有人数，顶栏显示的是热度
      lrEl(state.root, 'pop').textContent = '热度 ' + lrFormatPop(state.heat);
    }
    function lrPaintLive(state) {
      lrEl(state.root, 'live').style.display = state.onAir ? '' : 'none';
    }

    function lrPaintNavy(state) {
      const list = (state.navy || []).slice().sort((a, b) => {
        const rank = { du: 0, ti: 1, jian: 2 };
        return (rank[a.tier] ?? 9) - (rank[b.tier] ?? 9);
      });
      lrEl(state.root, 'navy').innerHTML = list.map((g) =>
        `<div class="guard"><span>${lrPrefix(g)}<span class="name ${g.tier || ''}">${lrEsc(g.user)}</span></span><span class="hint" style="padding:0">剩余 ${g.days} 天</span></div>`
      ).join('') + `<div class="join"><p class="hint" style="padding:0 2px 4px">开通大航海：弹幕优先被看见，ID 会被记住。</p>${
        (lrMenu().大航海 || []).map((g) =>
          `<button class="join-btn" type="button" data-lr-act="guard" data-guard="${lrAttr(g.name)}">${lrImg(g.name)}<span>${lrEsc(g.name)} ${g.days} 天</span><em>${lrPriceTag(g.price)}</em></button>`
        ).join('')
      }</div>`;
    }
    function lrPaintRank(state) {
      const rank = (state.rank || []).slice().sort((a, b) => b.score - a.score);
      lrEl(state.root, 'rank').innerHTML = rank.length
        ? rank.map((r, i) => `<div class="rank"><span>${i + 1}. ${lrEsc(r.user)}</span><b>${lrYen(r.score)}</b></div>`).join('')
        : '<p class="hint">这场还没有上榜记录。</p>';
    }
    function lrAddRank(state, user, score) {
      if (!score) return;
      const hit = (state.rank || []).find((r) => r.user === user);
      if (hit) hit.score += score;
      else {
        if (!state.rank) state.rank = [];
        state.rank.push({ user, score });
      }
      lrPaintRank(state);
    }

    function lrSendToChat(text) {
      const content = String(text || '').trim();
      if (!content) return false;
      try {
        const win = window.parent || window;
        const doc = win.document || document;
        const textarea = doc.getElementById('send_textarea');
        const sendBtn = doc.getElementById('send_but');
        if (!textarea || !sendBtn) return false;
        textarea.value = content;
        textarea.dispatchEvent(new Event('input', { bubbles: true }));
        sendBtn.click();
        return true;
      } catch (e) {
        console.warn('[正文美化] 发送到酒馆聊天失败', e);
        return false;
      }
    }

    function lrToast(state, message) {
      const text = String(message || '').trim();
      if (!text || !state) return;
      // 复用直播间已有的提示条，余额不足、MVU 未就绪等失败不会再静默。
      lrShowToast(state, { user: '提示', gift: '干杯', n: 1, line: text });
    }

    function lrSendRoomChat(state, text) {
      const ok = lrSendToChat(text);
      if (!ok) lrToast(state, '发送失败：未找到酒馆聊天输入框');
      return ok;
    }

    /* roomAction 只保留关注/取关。礼物、醒目留言和大航海只向酒馆发送
       一条消费消息，金钱、累计打赏、牌子和热度统一等模型回合更新 MVU。 */
    function lrApplySnapshot(state, snap) {
      if (!snap) return;
      const has = (key) => Object.prototype.hasOwnProperty.call(snap, key);
      if (has('金钱')) state.money = snap.金钱;
      if (has('关注')) state.follow = snap.关注 === true;
      if (has('累计打赏')) state.tipped = snap.累计打赏;
      if (has('牌子等级')) state.badge = snap.牌子等级;
      if (has('牌子档位')) state.tier = snap.牌子档位 || '';
      if (has('牌子剩余天数')) state.days = snap.牌子剩余天数;
      if (has('热度')) state.heat = snap.热度;
      if (has('底盘热度')) state.base = snap.底盘热度;
      if (has('粉丝数')) state.fans = snap.粉丝数;
      if (snap.牌子名) state.medal = snap.牌子名;
      if (Array.isArray(snap.高能榜)) state.rank = snap.高能榜.map((r) => ({ user: r.名字, score: r.本场消费 }));
      if (Array.isArray(snap.大航海?.名单)) state.navy = snap.大航海.名单.map((x) => ({ user: x.名字, tier: LR_TIER_KEY[x.档位] || '', days: x.天数 }));
      lrPaintMoney(state);
      lrPaintPop(state);
      lrPaintFollow(state);
      lrPaintNavy(state);
      lrPaintRank(state);
    }
    /* 这里只服务关注/取关；消费动作不再经过辅助脚本写 MVU。 */
    function lrDoAction(state, action, extra) {
      const aux = lrAux();
      let res = null;
      try {
        if (aux) res = aux.roomAction(Object.assign({ 主播: state.host, 动作: action }, extra || {}));
        else if (action === '关注') res = lrWriteFollowDirect(state, extra?.关注 === true);
        else { lrToast(state, '辅助计算脚本没跑起来，送礼功能暂时不可用'); return false; }
      }
      catch (e) { console.warn('[正文美化] roomAction', e); }
      if (!res || !res.ok) { lrToast(state, (res && res.提示) || '操作没能完成'); return false; }
      lrApplySnapshot(state, res.快照);
      /* 榜一还手是脚本掷骰的结果，卡片只负责把它演出来 */
      if (res.还手) {
        lrPush(state, { type: 'gift', user: res.还手.名字, gift: '情书', n: 1 }, true);
        lrToast(state, res.还手.名字 + ' 反手把榜一抢回去了');
      }
      return res;
    }

    function lrCostOf(pending) {
      if (!pending) return 0;
      if (pending.mode === 'gift') return pending.price * pending.qty;
      if (pending.mode === 'guard') return pending.price;
      return pending.amount;
    }
    function lrSyncDlg(state) {
      const pending = state.pending;
      if (!pending) return;
      const dlg = lrEl(state.root, 'dlg');
      const cost = lrCostOf(pending);
      const broke = state.money < cost;
      const empty = pending.mode === 'sc' && !String(pending.text || '').trim();
      const sum = dlg.querySelector('[data-sum]');
      if (sum) sum.innerHTML = broke ? '<span class="broke">余额不足</span>' : `合计 <b>${lrYen(cost)}</b>`;
      const ok = dlg.querySelector('[data-ok]');
      if (ok) ok.disabled = broke || empty || (pending.mode === 'gift' && pending.qty < 1);
      dlg.querySelectorAll('[data-setqty]').forEach((b) => b.classList.toggle('on', Number(b.dataset.setqty) === pending.qty));
      dlg.querySelectorAll('[data-setamt]').forEach((b) => b.classList.toggle('on', Number(b.dataset.setamt) === pending.amount));
      const qty = dlg.querySelector('[data-qty]');
      if (qty && document.activeElement !== qty) qty.value = pending.qty;
    }
    function lrRenderDlg(state) {
      const pending = state.pending;
      if (!pending) return;
      const dlg = lrEl(state.root, 'dlg');
      if (pending.mode === 'gift') {
        dlg.innerHTML = `<div class="dlg-top"><div class="dlg-ico">${lrImg(pending.name)}</div><div class="dlg-meta"><h3>${lrEsc(pending.name)}</h3><p class="price">${lrPriceTag(pending.price)} / 个</p></div></div>
          <div class="qty-row"><span>数量</span><button type="button" data-step="-1">−</button><input data-qty value="${pending.qty}" inputmode="numeric" maxlength="4" aria-label="赠送数量"><button type="button" data-step="1">+</button></div>
          <div class="chips">${(lrMenu().数量档位 || []).map((n) => `<button type="button" data-setqty="${n}">${n}</button>`).join('')}</div>
          <div class="dlg-foot"><span class="dlg-sum" data-sum></span><button type="button" class="cancel" data-cancel>取消</button><button type="button" class="ok" data-ok>赠送</button></div>`;
      } else if (pending.mode === 'guard') {
        dlg.innerHTML = `<div class="dlg-top"><div class="dlg-ico">${lrImg(pending.name)}</div><div class="dlg-meta"><h3>${lrEsc(pending.name)}</h3><p class="price">${pending.days} 天 · ${lrPriceTag(pending.price)}</p></div></div>
          <div class="dlg-foot"><span class="dlg-sum" data-sum></span><button type="button" class="cancel" data-cancel>取消</button><button type="button" class="ok" data-ok>开通</button></div>`;
      } else {
        dlg.innerHTML = `<div class="dlg-top"><div class="dlg-meta"><h3>醒目留言</h3></div></div>
          <div class="chips">${(lrMenu().醒目留言档位 || []).map((n) => `<button type="button" data-setamt="${n}">¥${n}</button>`).join('')}</div>
          <div class="dlg-sc"><textarea data-sc-text maxlength="40" placeholder="说点什么">${lrEsc(pending.text || '')}</textarea></div>
          <div class="dlg-foot"><span class="dlg-sum" data-sum></span><button type="button" class="cancel" data-cancel>取消</button><button type="button" class="ok hot" data-ok>发送</button></div>`;
      }
      lrSyncDlg(state);
    }
    function lrCloseDlg(state) {
      lrEl(state.root, 'overlay').classList.remove('show');
      state.pending = null;
    }
    function lrOpenDlg(state) {
      lrEl(state.root, 'overlay').classList.add('show');
      lrRenderDlg(state);
      const focus = lrEl(state.root, 'dlg').querySelector('[data-qty], [data-sc-text]');
      if (focus) { focus.focus(); if (focus.select) focus.select(); }
    }

    function lrSendGift(state, name, qty) {
      // 只生成并发送酒馆消息；当前卡片不直接结算金钱、热度或榜单。
      const item = lrGiftItem(name);
      if (!item) return false;
      const count = Math.max(1, Number(qty) || 1);
      const cost = (Number(item.price) || 0) * count;
      if (!lrSendRoomChat(state, `消费${cost}，送出${count}个${name}`)) return false;
      lrPush(state, { type: 'gift', user: '你', gift: name, n: count }, true);
      return true;
    }
    function lrOpenGift(state, name) {
      const gift = lrGiftItem(name);
      if (!gift) return;
      if (!gift.price) { lrSendGift(state, name, 1); return; }
      state.pending = { mode: 'gift', ...gift, qty: 1 };
      lrOpenDlg(state);
    }
    function lrOpenGuard(state, name) {
      const card = (lrMenu().大航海 || []).find((g) => g.name === name);
      if (!card) return;
      state.pending = { mode: 'guard', ...card, tier: LR_TIER_KEY[card.name] || '' };
      lrOpenDlg(state);
    }
    function lrOpenSc(state) {
      state.pending = { mode: 'sc', amount: 30, text: (lrEl(state.root, 'say').value || '').trim() };
      lrOpenDlg(state);
    }
    function lrConfirm(state) {
      const pending = state.pending;
      if (!pending) return;
      const cost = lrCostOf(pending);
      if (state.money < cost) {
        lrToast(state, '余额不足');
        return;
      }
      if (pending.mode === 'sc' && !String(pending.text || '').trim()) {
        lrToast(state, '请输入醒目留言内容');
        return;
      }
      if (pending.mode === 'gift') {
        if (!lrSendGift(state, pending.name, pending.qty)) return;
      } else if (pending.mode === 'guard') {
        // 大航海结算交给这条酒馆消息之后的模型回合。
        if (!lrSendRoomChat(state, `消费${pending.price}，开通${state.host}的${pending.name}`)) return;
        lrShowToast(state, { user: '你', gift: pending.name, line: `开通了 ${pending.name} ${pending.days} 天` });
        lrPush(state, { type: 'sys', text: `你成为了${state.host}的${pending.name}（${pending.days} 天）` }, true);
        lrSpawnFly(state, { type: 'gift', gift: pending.name, n: 1 }, true);
      } else {
        const text = pending.text.trim();
        if (!lrSendRoomChat(state, `消费${pending.amount}，发送价值${pending.amount}的SC：${text}`)) return;
        lrPush(state, { type: 'sc', user: '你', amount: pending.amount, text }, true);
        lrEl(state.root, 'say').value = '';
      }
      lrCloseDlg(state);
    }

    function lrHydrate(root) {
      if (root._lr) return root._lr;
      let parsed = { 主播: '', 主播说: '', 弹幕: [] };
      try { parsed = JSON.parse(decodeURIComponent(root.getAttribute('data-lr-payload') || '') || '{}'); }
      catch (e) { }
      const host = lrPickHost(parsed);
      const stat = lrReadStat();
      const player = lrPlayer(stat);
      const live = (lrGirl(stat, host).直播) || {};
      const fan = lrFan(stat, host);
      const room = lrRoomCfg(stat, host);
      const navySrc = (room.大航海 && Array.isArray(room.大航海.名单)) ? room.大航海.名单 : [];
      const rankSrc = Array.isArray(room.高能榜) ? room.高能榜 : [];
      const state = {
        root, host, parsed, lane: 0, pending: null, toastTimer: 0, swipeMoved: 0,
        queueTimer: 0, idleTimer: 0,
        money: (player.金钱 == null || player.金钱 === '') ? 286450 : lrParseNum(player.金钱),
        follow: lrIsTrue(fan.关注),
        tipped: lrParseNum(fan.累计打赏),
        badge: lrParseNum(fan.牌子等级),
        tier: fan.牌子档位 && fan.牌子档位 !== '无' ? fan.牌子档位 : '',
        days: lrParseNum(fan.牌子剩余天数),
        /* 全部读 MVU，没有本地兜底数值。热度 = 底盘 + 本场虚火，由辅助计算脚本写；
           这里只在两者都为空时退回底盘，避免顶栏显示 0。 */
        medal: room.牌子名 || '',
        slot: room.档期 || '',
        base: lrParseNum(room.底盘热度),
        heat: lrParseNum(live.热度) || lrParseNum(room.底盘热度),
        fans: lrParseNum(live.粉丝数),
        onAir: live.开播 == null ? true : lrIsTrue(live.开播),
        title: live.标题 || '',
        navy: navySrc.map((x) => ({ user: x.名字, tier: LR_TIER_KEY[x.档位] || '', days: lrParseNum(x.天数) })),
        rank: rankSrc.map((x) => ({ user: x.名字, score: lrParseNum(x.本场消费) }))
      };
      if (!state.title) state.title = host + '的直播间';
      if (state.tier && !(state.navy || []).some((g) => g.user === '你')) {
        state.navy = [{ user: '你', tier: LR_TIER_KEY[state.tier], days: state.days || 30 }].concat(state.navy || []);
      }
      root._lr = state;
      return state;
    }

    function lrBindRail(state) {
      const giftsEl = lrEl(state.root, 'gifts');
      const prev = state.root.querySelector('[data-lr-act="gift-prev"]');
      const next = state.root.querySelector('[data-lr-act="gift-next"]');
      const sync = () => {
        const max = giftsEl.scrollWidth - giftsEl.clientWidth;
        prev.classList.toggle('off', max < 8 || giftsEl.scrollLeft < 8);
        next.classList.toggle('off', max < 8 || giftsEl.scrollLeft > max - 8);
      };
      giftsEl.addEventListener('scroll', sync, { passive: true });
      requestAnimationFrame(sync);
      let down = false, x0 = 0, left0 = 0, pressPill = null;
      giftsEl.addEventListener('pointerdown', (e) => {
        if (e.button && e.button !== 0) return;
        down = true;
        pressPill = e.target.closest('.pill');
        x0 = e.clientX;
        left0 = giftsEl.scrollLeft;
        state.swipeMoved = 0;
        giftsEl.setPointerCapture(e.pointerId);
        giftsEl.classList.add('is-drag');
      });
      giftsEl.addEventListener('pointermove', (e) => {
        if (!down) return;
        const dx = e.clientX - x0;
        if (Math.abs(dx) < 10) return;
        state.swipeMoved = Math.max(state.swipeMoved, Math.abs(dx));
        giftsEl.scrollLeft = left0 - dx;
      });
      giftsEl.addEventListener('pointerup', (e) => {
        const pill = pressPill;
        const moved = state.swipeMoved;
        down = false;
        pressPill = null;
        giftsEl.classList.remove('is-drag');
        try { giftsEl.releasePointerCapture(e.pointerId); } catch (err) { }
        if (pill && moved <= 10) {
          if (pill.dataset.kind === 'guard') lrOpenGuard(state, pill.dataset.gift);
          else lrOpenGift(state, pill.dataset.gift);
        }
      });
      giftsEl.addEventListener('pointercancel', () => {
        down = false;
        pressPill = null;
        giftsEl.classList.remove('is-drag');
      });
      giftsEl.addEventListener('wheel', (e) => {
        if (giftsEl.scrollWidth <= giftsEl.clientWidth) return;
        e.preventDefault();
        giftsEl.scrollLeft += e.deltaY + e.deltaX;
      }, { passive: false });
    }

    function mountLiveRoom(root) {
      if (root.dataset.lrReady) return;
      root.dataset.lrReady = '1';
      const state = lrHydrate(root);
      const avatar = lrEl(root, 'avatar');
      const feed = lrEl(root, 'feed');
      avatar.src = lrArt('头像', state.host);
      avatar.alt = state.host;
      feed.src = lrCoverSrc(state.host);
      feed.alt = state.host + '立绘';
      lrEl(root, 'title').textContent = state.title;
      lrEl(root, 'name').textContent = state.host;
      lrEl(root, 'slot').textContent = state.slot;
      lrPaintPop(state);
      lrPaintLive(state);
      lrPaintMoney(state);
      lrPaintFollow(state);
      lrPaintNavy(state);
      lrPaintRank(state);
      const giftsEl = lrEl(root, 'gifts');
      giftsEl.innerHTML = (lrMenu().礼物 || []).map((g) =>
        `<button class="pill" type="button" data-kind="gift" data-gift="${lrAttr(g.name)}">${lrImg(g.name)}<b>${lrEsc(g.name)}</b><em>${lrPriceTag(g.price)}</em></button>`
      ).join('') + (lrMenu().大航海 || []).map((g) =>
        `<button class="pill" type="button" data-kind="guard" data-gift="${lrAttr(g.name)}">${lrImg(g.name)}<b>${lrEsc(g.name)}</b><em>${lrPriceTag(g.price)}</em></button>`
      ).join('');
      lrBindRail(state);
      lrPlacePin(state);
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => lrPlacePin(state)).observe(state.root);
      }
      if (state.parsed.主播说) {
        lrPush(state, { type: 'chat', user: state.host, text: state.parsed.主播说, host: true }, true);
      }
      lrPlayQueue(state, state.parsed.弹幕 || []);
    }

    function lrFromEvent(ev) {
      const root = ev.target && ev.target.closest && ev.target.closest('.liveroom');
      return root ? lrHydrate(root) : null;
    }

    function bindLiveRoomEvents() {
      if (window.__lrBound) return;
      window.__lrBound = true;
      document.addEventListener('click', (ev) => {
        const tab = ev.target.closest('[data-lr-tab]');
        if (tab) {
          const root = tab.closest('.liveroom');
          if (!root) return;
          ev.preventDefault();
          root.querySelectorAll('.tab').forEach((t) => t.classList.remove('on'));
          root.querySelectorAll('.pane').forEach((p) => p.classList.remove('on'));
          tab.classList.add('on');
          const pane = lrEl(root, tab.getAttribute('data-lr-tab'));
          if (pane) pane.classList.add('on');
          return;
        }
        const dlgClick = ev.target.closest('[data-lr="dlg"]');
        if (dlgClick) {
          const state = lrFromEvent(ev);
          if (!state) return;
          if (ev.target.closest('[data-cancel]')) { lrCloseDlg(state); return; }
          if (ev.target.closest('[data-ok]')) { lrConfirm(state); return; }
          const step = ev.target.closest('[data-step]');
          if (step && state.pending && state.pending.mode === 'gift') {
            state.pending.qty = Math.max(1, Math.min(9999, (state.pending.qty || 1) + Number(step.dataset.step)));
            lrSyncDlg(state);
            return;
          }
          const q = ev.target.closest('[data-setqty]');
          if (q && state.pending && state.pending.mode === 'gift') {
            state.pending.qty = Number(q.dataset.setqty);
            lrSyncDlg(state);
            return;
          }
          const a = ev.target.closest('[data-setamt]');
          if (a && state.pending && state.pending.mode === 'sc') {
            state.pending.amount = Number(a.dataset.setamt);
            lrSyncDlg(state);
          }
          return;
        }
        const act = ev.target.closest('[data-lr-act]');
        if (!act) {
          const overlay = ev.target.closest('[data-lr="overlay"]');
          if (overlay && ev.target === overlay) {
            const state = lrFromEvent(ev);
            if (state) lrCloseDlg(state);
          }
          return;
        }
        const state = lrFromEvent(ev);
        if (!state) return;
        const kind = act.getAttribute('data-lr-act');
        if (kind === 'danmu') {
          const quiet = lrEl(state.root, 'cam').classList.toggle('quiet');
          act.textContent = quiet ? '弹幕 关' : '弹幕 开';
        } else if (kind === 'follow') {
          // 点下去时先重读一次，避免卡片挂载后 MVU 被别处修改导致反向操作。
          lrSyncFollowFromMvu(state, false);
          lrDoAction(state, '关注', { 关注: !state.follow });
        } else if (kind === 'sc') {
          ev.preventDefault();
          lrOpenSc(state);
        } else if (kind === 'guard') {
          ev.preventDefault();
          lrOpenGuard(state, act.getAttribute('data-guard'));
        } else if (kind === 'gift-prev') {
          lrEl(state.root, 'gifts').scrollBy({ left: -150, behavior: 'smooth' });
        } else if (kind === 'gift-next') {
          lrEl(state.root, 'gifts').scrollBy({ left: 150, behavior: 'smooth' });
        }
      });
      document.addEventListener('submit', (ev) => {
        const form = ev.target.closest && ev.target.closest('[data-lr="form"]');
        if (!form) return;
        ev.preventDefault();
        const state = lrFromEvent(ev);
        if (!state) return;
        const input = lrEl(state.root, 'say');
        const text = (input.value || '').trim();
        if (!text) return;
        if (!lrSendRoomChat(state, `发送弹幕：${text}`)) return;
        lrPush(state, { type: 'chat', user: '你', tier: lrPlayerTier(state), medal: lrPlayerMedal(state), text }, true);
        input.value = '';
      });
      document.addEventListener('input', (ev) => {
        const dlg = ev.target.closest && ev.target.closest('[data-lr="dlg"]');
        if (!dlg) return;
        const state = lrFromEvent(ev);
        if (!state || !state.pending) return;
        if (ev.target.dataset.qty !== undefined && state.pending.mode === 'gift') {
          state.pending.qty = Math.max(1, Math.min(9999, parseInt(ev.target.value, 10) || 1));
          lrSyncDlg(state);
        }
        if (ev.target.dataset.scText !== undefined && state.pending.mode === 'sc') {
          state.pending.text = ev.target.value;
          lrSyncDlg(state);
        }

        if (ev.key !== 'Escape' && !(ev.key === 'Enter' && !ev.shiftKey)) return;
        const overlay = document.querySelector('.liveroom .overlay.show');
        if (!overlay) return;

      try {

              });

        const fm = trimmed.match(/^(区域|场所|标题|简述|对象|时段|私密度)\s*[:：]\s*(.*)$/);
        if (fm) {
          inOpts = false;
          flush();
          evt[fm[1]] = fm[2].trim();
        }
      });
      flush();
      return evt;
    }

    function evtParseGains(text) {
      return String(text || '').split(/[,，]/).map((part) => {
        part = part.trim();
        if (!part) return null;
        let m = part.match(/^(.+?)\s*([+\-]\d+)\s*$/);
        if (m) return [m[1].trim(), m[2]];
        m = part.match(/^(.+?)\s*(?:→|->|=>|[:：])\s*(.+)$/);
        if (m) return [m[1].trim(), m[2].trim()];
        m = part.match(/^(.+?)(重置|归零)$/);
        if (m) return [m[1].trim(), m[2]];
        return [part, ''];
      }).filter((row) => row && row[0]);
    }

    function evtGainMeta(key) {
      if (EVT_GAIN_MAP[key]) return EVT_GAIN_MAP[key];
      if (/经验$/.test(key)) return ['star', 'gold'];
      return ['sparkle', ''];
    }

    function evtIsSolo(name) {
      const s = String(name || '').trim();
      return !s || s === '无' || s === '独行' || s === 'null' || s === 'none';
    }

    function evtCanonName(name) {
      const raw = String(name || '').trim();
      if (!raw) return '';
      if (typeof normalizeDisplayName === 'function') {
        const n = normalizeDisplayName(raw);
        return n === '角色' ? raw : n;
      }
      return raw;
    }

    /* 预算派生色的运行期版本。角色主色来自 CHARACTER_CONFIG，也可能是 evtCharOf
       兜底生成的 hsl()，形态不固定，所以先用 canvas 把它归一化成 rgb 通道再算派生值。
       CSS 侧只认 --ac-rgb / --ac-wNN（理由见样式里的「预算派生色」说明），所以这里
       必须和 --ac 一起写进 style，否则旧 WebView 上角色环和心情标签会掉回缺省色。 */
    let evtColorCtx;
    function evtColorChannels(value) {
      try {
        if (evtColorCtx === undefined) evtColorCtx = document.createElement('canvas').getContext('2d');
        if (!evtColorCtx) return null;
        evtColorCtx.fillStyle = '#000';
        evtColorCtx.fillStyle = value; // 非法值被忽略，留在 #000
        const s = String(evtColorCtx.fillStyle);
        let m = /^#([0-9a-f]{6})$/i.exec(s);
        if (m) return [parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4, 6), 16)];
        m = /^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i.exec(s);
        if (m) return [Math.round(+m[1]), Math.round(+m[2]), Math.round(+m[3])];
        return null;
      } catch (e) { return null; }
    }

    function evtAcVars(value) {
      const ch = evtColorChannels(value);
      // 取不到通道就只写 --ac，派生值留给 .evt-cast 的缺省色，至少保持整块自洽。
      if (!ch) return '--ac:' + value;
      const h2 = (n) => Math.round(Math.max(0, Math.min(255, n))).toString(16).padStart(2, '0');
      // 与 #fff 按 p 混色：两侧都不透明，预乘退化成普通线性插值
      const w = (p) => '#' + ch.map((c) => h2(c * p + 255 * (1 - p))).join('');
      return '--ac:' + value
        + ';--ac-rgb:' + ch.join(' ')
        + ';--ac-w70:' + w(.70)
        + ';--ac-w34:' + w(.34)
        + ';--ac-w30:' + w(.30);
    }

    function evtCharOf(name) {
      const canon = evtCanonName(name) || name;
      const cfg = (typeof CHARACTER_CONFIG !== 'undefined' && CHARACTER_CONFIG[canon]) || null;
      if (cfg) {
        const avatar = cfg.avatar || (typeof getAvatarFromCache === 'function' ? getAvatarFromCache(canon) : '');
        return { name: canon, color: cfg.color || '#9aa4dd', avatar: avatar || '' };
      }
      const cached = typeof getAvatarFromCache === 'function' ? getAvatarFromCache(canon) : '';
      let h = 0;
      for (const ch of String(canon)) h = (h * 31 + ch.codePointAt(0)) % 360;
      return { name: canon, color: 'hsl(' + h + ' 46% 62%)', avatar: cached || '' };
    }

    function evtReadStat() {
      try {
        const data = fetchLatestMvuData() || {};
        if (data.世界信息 || data.对象信息 || data.玩家信息) return data;
      } catch (e) { }
      if (location.protocol === 'file:') {
        return {
          世界信息: { 时间: { 时段: '暮' }, 位置: { 私密度: 4 } },
          对象信息: EVT_FILE_GIRL,
          玩家信息: { 同行: '塔菲' }
        };
      }
      return {};
    }

    function evtGirl(stat, name) {
      const girls = (stat && stat.对象信息) || {};
      const canon = evtCanonName(name);
      return girls[canon] || girls[name] || {};
    }

    function evtHasStats(girl) {
      return !!(girl && (girl.羁绊 || girl.生理));
    }

    function evtReqNumber(value) {
      if (value == null || value === '') return null;
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    /* 门槛只判断稳定、结构明确的数值字段。
       心情、背包、异常状态等自由文本条件留给正文判断，不参与按钮灰置。 */
    function evtEvalReq(req, girl, player) {
      if (!req) return true;
      const bond = (girl && girl.羁绊) || {};
      const phy = (girl && girl.生理) || {};
      const ctx = {
        好感度: evtReqNumber(bond.好感度),
        顺从度: evtReqNumber(bond.顺从度),
        性欲度: evtReqNumber(phy.性欲度),
        体力: evtReqNumber(player && player.体力),
        对象体力: evtReqNumber(phy.体力),
        尿意: evtReqNumber(phy.尿意),
        金钱: evtReqNumber(player && player.金钱)
      };
      let ok = true;
      let hit = false;
      const re = /(好感度|顺从度|性欲度|对象体力|体力|尿意|金钱)\s*(>=|<=|==|[≥≤=＜＞><])\s*(-?\d+(?:\.\d+)?)/g;
      let m;
      while ((m = re.exec(String(req)))) {
        hit = true;
        const actual = ctx[m[1]];
        const op = String(m[2]).replace('≥', '>=').replace('≤', '<=').replace('＞', '>').replace('＜', '<');
        const expected = Number(m[3]);
        if (actual == null) ok = false;
        else if (op === '>=' && !(actual >= expected)) ok = false;
        else if (op === '<=' && !(actual <= expected)) ok = false;
        else if (op === '>' && !(actual > expected)) ok = false;
        else if (op === '<' && !(actual < expected)) ok = false;
        else if ((op === '=' || op === '==') && actual !== expected) ok = false;
      }
      // 没有可识别数值条件时不由冷代码设锁。
      return hit ? ok : true;
    }

    function evtGainsHtml(list) {
      return list.map(([k, v]) => {
        const meta = evtGainMeta(k);
        const num = /^[+\-]\d/.test(String(v));
        const down = /^-\d/.test(String(v));
        const tone = meta[1] ? ' data-tone="' + meta[1] + '"' : '';
        return '<span class="evt-gain' + (down ? ' down' : '') + '"' + tone + '>'
          + evtIc(meta[0])
          + '<span class="k">' + evtEsc(k) + '</span>'
          + '<span class="v' + (num ? '' : ' word') + '">' + evtEsc(v) + '</span>'
          + '</span>';
      }).join('');
    }

    function evtChoicePayload(option, objectName) {
      const gainText = (option.结算 || []).map(([k, v]) => {
        const value = String(v || '');
        return /^[+\-]\d/.test(value) || value === '重置' || value === '归零'
          ? `${k}${value}`
          : `${k}→${value}`;
      }).join('，');
      return encodeURIComponent(JSON.stringify({
        对象: objectName || '',
        门槛: option.门槛 || '',
        选项: option.选项 || '',
        结算: gainText
      }));
    }

    function evtChoiceData(button) {
      try { return JSON.parse(decodeURIComponent(button.dataset.evtChoice || '')) || {}; }
      catch (err) { console.warn('[正文美化] 突发事件选项解析失败', err); return null; }
    }

    function evtRefreshChoice(button, stat) {
      const payload = evtChoiceData(button);
      if (!payload) return false;
      const data = stat || evtReadStat();
      const player = (data && data.玩家信息) || {};
      let objectName = payload.对象 || '';
      if (evtIsSolo(objectName) && player.同行) objectName = player.同行;
      const girl = evtIsSolo(objectName) ? {} : evtGirl(data, objectName);
      const met = !payload.门槛 || evtEvalReq(payload.门槛, girl, player);
      button.classList.toggle('locked', !met);
      button.disabled = !met;
      button.setAttribute('aria-disabled', met ? 'false' : 'true');
      button.title = met ? '点击选择此行动' : `数值条件未满足：${payload.门槛}`;
      const req = button.querySelector('.evt-req');
      if (req && payload.门槛) {
        req.classList.toggle('met', met);
        req.innerHTML = evtIc(met ? 'check' : 'lock') + evtEsc(payload.门槛);
      }
      return met;
    }

    function evtRefreshChoices(root) {
      const stat = evtReadStat();
      (root || document).querySelectorAll('.evt-opt[data-evt-choice]').forEach((button) => evtRefreshChoice(button, stat));
    }

    function bindSuddenEventEvents() {
      if (window.__suddenEventChoicesBound) return;
      window.__suddenEventChoicesBound = true;
      document.addEventListener('click', (ev) => {
        const button = ev.target.closest && ev.target.closest('.evt-opt[data-evt-choice]');
        if (!button) return;
        // 点击时重新读取 MVU，防止旧卡片按挂载时的过期数值放行。
        if (!evtRefreshChoice(button)) { ev.preventDefault(); return; }
        const payload = evtChoiceData(button);
        if (!payload || !String(payload.选项 || '').trim()) return;
        ev.preventDefault();
        const gains = String(payload.结算 || '').trim();
        const message = `选择突发事件选项：${payload.选项}${gains ? `；结算：${gains}` : ''}`;
        if (!lrSendToChat(message)) console.warn('[正文美化] 突发事件选项发送失败');
      });

      // MVU 更新后，当前页面中已经显示的事件卡也重新计算数值门槛。
      try {
        const win = getCore().window;
        const eventOnFn = win.eventOn || window.eventOn;
        if (typeof eventOnFn === 'function' && (mvuState.ready || mvuState.check())) {
          const eventName = mvuState.mvu?.events?.VARIABLE_UPDATE_ENDED;
          if (eventName) eventOnFn(eventName, () => evtRefreshChoices(document));
        }
      } catch (e) { console.warn('[正文美化] 突发事件 MVU 状态监听失败', e); }
    }

    function evtPips(n) {
      const x = Math.max(0, Math.min(5, Number(n) || 0));
      let h = '';
      for (let i = 1; i <= 5; i++) h += '<s class="' + (i <= x ? 'on' : '') + '"></s>';
      return '<span class="evt-pips">' + h + '</span>';
    }

    function renderSuddenEvent(raw, idx) {
      const parsed = parseSuddenEvent(raw);
      const stat = evtReadStat();
      const world = (stat && stat.世界信息) || {};
      const player = (stat && stat.玩家信息) || {};
      const loc = world.位置 || {};
      const time = world.时间 || {};

      if (evtIsSolo(parsed.对象) && player.同行) parsed.对象 = player.同行;
      const area = parsed.区域 || loc.区域 || '';
      const place = parsed.场所 || loc.场所 || '';
      const phase = parsed.时段 || time.时段 || '';
      const privacy = parsed.私密度 !== '' ? parsed.私密度 : loc.私密度;
      const title = parsed.标题 || place || '突发事件';
      const girl = evtIsSolo(parsed.对象) ? {} : evtGirl(stat, parsed.对象);
      const bond = girl.羁绊 || {};
      const phy = girl.生理 || {};
      const opts = parsed.选项.map((o) => {
        const cat = EVT_CATS.indexOf(o.分类) !== -1 ? o.分类 : (o.分类 || '日常');
        const met = evtEvalReq(o.门槛, girl, player);
        return { 分类: cat, 选项: o.选项, 门槛: o.门槛, 结算: evtParseGains(o.结算), 达成: met };
      });
      const open = opts.filter((o) => !o.门槛 || o.达成);
      const mainCat = (open[open.length - 1] || opts[0] || { 分类: '日常' }).分类;
      const plateHit = evtPlateHit(area);
      const plate = plateHit.file;
      const areaLabel = String(area).replace(/[·.]/g, ' · ').replace(/\s+/g, ' ').trim();

      let castHtml = '';
      let bondsHtml = '';
      if (!evtIsSolo(parsed.对象)) {
        const cc = evtCharOf(parsed.对象);
        const mood = bond.心情 || '';
        const abn = Array.isArray(phy.异常状态) ? phy.异常状态 : [];
        const face = cc.avatar
          ? '<img src="' + evtAttr(cc.avatar) + '" alt="" loading="lazy" onerror="this.remove()"><i>' + evtEsc((cc.name || '?')[0]) + '</i>'
          : '<i>' + evtEsc((cc.name || '?')[0]) + '</i>';
        castHtml = '<div class="evt-cast" style="' + evtAttr(evtAcVars(cc.color)) + '">'
          + '<span class="evt-face">' + face + '</span>'
          + '<div class="evt-who"><span class="nm">' + evtEsc(cc.name) + '<em>同行</em></span>'
          + '<span class="st">'
          + (mood ? '<span class="evt-mood">' + evtIc('smile') + evtEsc(mood) + '</span>' : '')
          + abn.map((s) => '<span class="evt-abn">' + evtIc('sparkle') + evtEsc(s) + '</span>').join('')
          + '</span></div></div>';
        if (evtHasStats(girl)) {
          bondsHtml = '<span class="evt-bond" data-k="好感度">' + evtIc('heart') + '<span class="bk">好感</span><span class="bv">' + evtEsc(bond.好感度 ?? 0) + '</span></span>'
            + '<span class="evt-bond" data-k="顺从度">' + evtIc('sakura') + '<span class="bk">顺从</span><span class="bv">' + evtEsc(bond.顺从度 ?? 0) + '</span></span>';
        }
      }

      const optsHtml = '<ul class="evt-opts">' + opts.map((o) => {
        const locked = !!(o.门槛 && !o.达成);
        const req = o.门槛
          ? '<span class="evt-req' + (o.达成 ? ' met' : '') + '">' + evtIc(o.达成 ? 'check' : 'lock') + evtEsc(o.门槛) + '</span>'
          : '';
        return '<li><button class="evt-opt' + (locked ? ' locked' : '') + '" data-cat="' + evtAttr(o.分类) + '" data-evt-choice="' + evtAttr(evtChoicePayload(o, parsed.对象)) + '" type="button"' + (locked ? ' disabled aria-disabled="true"' : ' aria-disabled="false"') + '>'
          + '<span class="bar"></span><span class="evt-cat">' + evtEsc(o.分类) + '</span>'
          + '<span class="col"><span class="act">' + evtEsc(o.选项) + '</span>'
          + '<span class="sub">' + req + evtGainsHtml(o.结算) + '</span></span>'
          + '<span class="evt-go">' + EVT_IC.go + '</span></button></li>';
      }).join('') + '</ul>';

      const artFocus = evtArtFocus(plateHit);
      /* 主用 Pages 上那份底图（先过素材缓存，命中就是 blob: 不出网），
         失败再退到仓库里的相对路径 —— 那条只在从仓库直接打开这页时有效，
         酒馆的 about:srcdoc 没有 base URL，解析不出来。顺序反过来的话，
         酒馆里每次渲染都要先浪费一次注定失败的请求。 */
      const plateFar = EVT_PLATE_CDN + plate;
      const art = '<div class="evt-art"' + (artFocus ? ' style="' + artFocus + '"' : '') + '><img src="' + evtAttr(assetUrl(plateFar))
        + '" data-evt-far="' + evtAttr(plateFar) + '" data-evt-local="' + evtAttr(EVT_PLATE_LOCAL + plate)
        + '" alt="" loading="lazy" onerror="'
        + 'if(this.dataset.evtFar&&this.src!==this.dataset.evtFar){this.src=this.dataset.evtFar;delete this.dataset.evtFar}'
        + 'else if(this.dataset.evtLocal){this.src=this.dataset.evtLocal;delete this.dataset.evtLocal}'
        + 'else this.remove()"></div>';

      return '<div class="evt-wrap"><div class="evt evt-a" data-cat="' + evtAttr(mainCat) + '" data-evt-idx="' + (idx || 0) + '"><div class="evt-glass">'
        + '<div class="evt-edge"></div>'
        + '<div class="stage">'
        + art
        + (place ? '<span class="plate">' + evtIc('mapPin') + evtEsc(place) + '</span>' : '')
        + castHtml
        + '<div class="spacer"></div>'
        + '<div class="head">'
        + '<span class="evt-eyebrow">' + evtIc('sparkle') + '突发事件' + (areaLabel ? '<s>/</s>' + evtEsc(areaLabel) : '') + '</span>'
        + '<h3 class="evt-title">' + evtEsc(title) + '</h3>'
        + '<div class="evt-metas">'
        + (phase ? '<span class="evt-mp">' + evtIc('moon') + evtEsc(phase) + '</span>' : '')
        + (privacy !== '' && privacy != null ? '<span class="evt-mp">私密' + evtPips(privacy) + '</span>' : '')
        + bondsHtml
        + '</div>'
        + (parsed.简述 ? '<p class="evt-brief">' + evtEsc(parsed.简述) + '</p>' : '')
        + '</div></div>'
        + '<div class="body">' + optsHtml + '</div>'
        + '</div></div></div>';
    }

    function initEvtCards() {
      bindSuddenEventEvents();
      const content = document.getElementById('readingContent');
      const raw = content && (content.textContent || '');
      const slotOpen = ENABLE_DEMO_CONTENT && (location.protocol === 'file:' || (typeof ST_UNREPLACED !== 'undefined' && raw && raw.indexOf(ST_UNREPLACED) !== -1));
      if (content && !content.querySelector('.evt') && slotOpen) {
        content.insertAdjacentHTML('beforeend', renderSuddenEvent(EVT_DEMO, 0));
      }
      evtRefreshChoices(document);
    }

    const AVATAR_CACHE_PREFIX = 'custom_char_avatar_';
    const CHAR_CACHE_KEY = 'custom_char_cache';

    function getAllCachedChars() {
      try {
        const raw = localStorage.getItem(CHAR_CACHE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) { return {}; }
    }

    function saveCachedChars(chars) {
      try {
        localStorage.setItem(CHAR_CACHE_KEY, JSON.stringify(chars));
        return true;
      } catch (e) {
        console.warn('Custom character cache write failed:', e);
        return false;
      }
    }

    function normalizeAvatarNetworkUrl(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      try {
        const url = new URL(raw, window.location.href);
        return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : '';
      } catch (e) { return ''; }
    }

    function isLocalAvatarData(value) {
      return /^data:image\//i.test(String(value || ''));
    }

    function estimateAvatarStorageBytes(value) {
      return String(value || '').length * 2;
    }

    function getLocalAvatarCacheUsageBytes(excludeName = '') {
      let total = 0;
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i) || '';
          if (!key.startsWith(AVATAR_CACHE_PREFIX)) continue;
          const name = key.slice(AVATAR_CACHE_PREFIX.length);
          if (excludeName && name === excludeName) continue;
          const value = localStorage.getItem(key) || '';
          if (isLocalAvatarData(value)) total += estimateAvatarStorageBytes(value);
        }
      } catch (e) { }
      return total;
    }

    function formatAvatarBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    }

    function updateAvatarStorageHint() {
      const hint = document.getElementById('customCharStorageHint');
      if (!hint || typeof AVATAR_CACHE_TOTAL_MAX_BYTES === 'undefined') return;
      const used = getLocalAvatarCacheUsageBytes();
      hint.textContent = '\u672c\u5730\u5934\u50cf\u7f13\u5b58\uff1a' + formatAvatarBytes(used) + ' / ' + formatAvatarBytes(AVATAR_CACHE_TOTAL_MAX_BYTES) + '\uff1b\u7f51\u7edc\u94fe\u63a5\u4e0d\u8ba1\u5165\u4e0a\u9650';
    }

    function saveAvatarToCache(charName, avatarValue) {
      const value = String(avatarValue || '');
      if (isLocalAvatarData(value)) {
        const projected = getLocalAvatarCacheUsageBytes(charName) + estimateAvatarStorageBytes(value);
        if (projected > AVATAR_CACHE_TOTAL_MAX_BYTES) return { ok: false, reason: 'limit', projected };
      }
      try {
        localStorage.setItem(AVATAR_CACHE_PREFIX + charName, value);
        return { ok: true };
      } catch (e) {
        console.warn('Avatar cache write failed:', e);
        return { ok: false, reason: 'storage', error: e };
      }
    }

    function getAvatarFromCache(charName) {
      try { return localStorage.getItem(AVATAR_CACHE_PREFIX + charName) || ''; } catch (e) { return ''; }
    }

    function removeAvatarFromCache(charName) {
      try { localStorage.removeItem(AVATAR_CACHE_PREFIX + charName); } catch (e) { }
      updateAvatarStorageHint();
    }

    // ==================== 浏览器缓存角色 ====================
    function injectCustomCharCSS(name, color) {
      if (!color) return;
      const styleId = 'custom-char-css-' + name;
      if (document.getElementById(styleId)) document.getElementById(styleId).remove();
      const style = document.createElement('style');
      style.id = styleId;
      const darkColor = lightenColor(color, 50);
      style.textContent = `.char-${CSS.escape(name)} .character-name .name-main { color: ${color} }
.name-initial-${CSS.escape(name)} { color: ${color}; }
body[data-theme="dark"] .char-${CSS.escape(name)} .character-name .name-main { color: ${darkColor} }
body[data-theme="dark"] .name-initial-${CSS.escape(name)} { color: ${darkColor}; }`;
      document.head.appendChild(style);
    }

    function lightenColor(hex, amount) {
      const num = parseInt(hex.replace('#', ''), 16);
      let r = Math.min(255, (num >> 16) + amount);
      let g = Math.min(255, ((num >> 8) & 0xff) + amount);
      let b = Math.min(255, (num & 0xff) + amount);
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    Object.entries(CHARACTER_CONFIG).forEach(([name, cfg]) => {
      if (cfg?.color) injectCustomCharCSS(name, cfg.color);
    });

    const AVATAR_UPLOAD_MAX_BYTES = 5 * 1024 * 1024; // 上传文件上限 5MB
    const AVATAR_STORAGE_TARGET_BYTES = 480 * 1024; // 单头像建议占用，避免撑爆 localStorage
    const AVATAR_CACHE_TOTAL_MAX_BYTES = 4 * 1024 * 1024;
    const AVATAR_MAX_DIMENSION = 1024; // 超过该边长才缩放
    const AVATAR_MIN_DIMENSION = 256; // 压缩兜底最小边长

    function estimateDataUrlBytes(dataUrl) {
      const commaIndex = dataUrl.indexOf(',');
      if (commaIndex < 0) return 0;
      const base64 = dataUrl.slice(commaIndex + 1);
      const padding = (base64.match(/=+$/) || [''])[0].length;
      return Math.floor(base64.length * 3 / 4) - padding;
    }

    function encodeAvatarDataUrl(img) {
      const srcMaxSide = Math.max(img.width, img.height);
      let scale = srcMaxSide > AVATAR_MAX_DIMENSION ? AVATAR_MAX_DIMENSION / srcMaxSide : 1;
      let fallbackDataUrl = '';

      while (scale > 0) {
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        if (!ctx) break;
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);

        const qualitySteps = [0.98, 0.95, 0.92, 0.88, 0.84, 0.8];
        let bestAtThisScale = '';
        for (const q of qualitySteps) {
          const candidate = canvas.toDataURL('image/webp', q);
          bestAtThisScale = candidate;
          if (estimateDataUrlBytes(candidate) <= AVATAR_STORAGE_TARGET_BYTES) {
            return candidate;
          }
        }
        fallbackDataUrl = bestAtThisScale;

        if (Math.max(w, h) <= AVATAR_MIN_DIMENSION) break;
        scale *= 0.85;
      }
      return fallbackDataUrl;
    }

    function initAvatarUpload() {
      const uploadBtn = document.getElementById('customCharUploadBtn');
      const fileInput = document.getElementById('customCharFileInput');

      const preview = document.getElementById('customCharAvatarPreview');

      if (urlInput) urlInput.addEventListener('change', function () {
        const normalized = normalizeAvatarNetworkUrl(this.value);
        if (!this.value.trim()) {
          if (_pendingAvatarKind === 'url') {
            _pendingAvatarData = ''; _pendingAvatarKind = '';
            preview.removeAttribute('src'); preview.style.display = 'none';
          }
          return;
        }
        if (!normalized) { showSettingsMessage('请输入有效的 http/https 头像链接'); return; }
        const probe = new Image();
        probe.onload = function () {
          _pendingAvatarData = normalized; _pendingAvatarKind = 'url';
          preview.src = normalized; preview.style.display = 'block';
          uploadBtn.textContent = '🌐 已选择网络头像';
        };
        probe.onerror = function () { showSettingsMessage('头像链接加载失败，请检查地址'); };
        probe.src = normalized;
      });

      fileInput.addEventListener('change', function () {
        const file = this.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) { showSettingsMessage('请选择图片文件'); this.value = ''; return; }
        if (file.size > AVATAR_UPLOAD_MAX_BYTES) { showSettingsMessage('图片不能超过 5MB'); this.value = ''; return; }
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            const original = String(e.target?.result || '');
            const needTranscode = file.size > AVATAR_STORAGE_TARGET_BYTES || Math.max(img.width, img.height) > AVATAR_MAX_DIMENSION;
            const encoded = needTranscode ? encodeAvatarDataUrl(img) : original;
            if (!encoded) { showSettingsMessage('头像处理失败，请换一张图片'); fileInput.value = ''; return; }
            if (getLocalAvatarCacheUsageBytes() + estimateAvatarStorageBytes(encoded) > AVATAR_CACHE_TOTAL_MAX_BYTES) {
              showSettingsMessage('本地头像缓存将超过 ' + formatAvatarBytes(AVATAR_CACHE_TOTAL_MAX_BYTES) + '，请删除旧头像或改用网络链接');
              fileInput.value = ''; return;
            }
            _pendingAvatarData = encoded; _pendingAvatarKind = 'local';
            if (urlInput) urlInput.value = '';
            preview.src = encoded; preview.style.display = 'block';
            uploadBtn.textContent = '✅ 已选择本地头像';
            updateAvatarStorageHint();
          };
          img.onerror = function () { showSettingsMessage('无法读取图片，请换一张'); fileInput.value = ''; };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function normalizeDisplayName(raw) {
      const s = String(raw || '').trim()
        .replace(/^[\s"'""''「」『』《》〈〉()（）【】\[\]]+|[\s"'""''「」『』《》〈〉()（）【】\[\]]+$/g, '');

      // 1. 优先尝试精确匹配
      for (const [name, config] of Object.entries(CHARACTER_CONFIG)) {
        if (config.aliases && config.aliases.some(alias =>
          alias.toLowerCase() === s.toLowerCase() ||
          new RegExp(`^${alias}$`, 'i').test(s)
        )) {
          return name;
        }
      }

      // 2. 尝试模糊匹配（包含别名），取最长匹配
      // 解决类似“视频中的蕾雅”这样的情况
      let bestMatch = null;
      let maxLen = 0;

      for (const [name, config] of Object.entries(CHARACTER_CONFIG)) {
        if (!config.aliases) continue;
        for (const alias of config.aliases) {
          // 跳过单字符别名（如'我'、'你'），避免误匹配
          if (alias.length < 2) continue;
          if (s.includes(alias)) {
            if (alias.length > maxLen) {
              maxLen = alias.length;
              bestMatch = name;
            }
          }
        }
      }

      if (bestMatch) return bestMatch;

      return s || '角色';
    }

        character: entry.characterKey,

      try { if (window.parent) targets.push(window.parent); } catch (e) {}
      try { if (window.top && !targets.includes(window.top)) targets.push(window.top); } catch (e) {}
      const send = () => targets.forEach(target => {

      });

        const fileName = safeDecodeURIComponent(parts[ci + 2]).replace(/\.webp$/i, '');
        const match = fileName.match(/^(.+?)(\d+)$/);

        try { unlocked = JSON.parse(localStorage.getItem('unlocked_cg') || '{}') || {}; } catch (e) {}
        if (!unlocked[entry.characterKey]) unlocked[entry.characterKey] = {};
        const previous = Number(unlocked[entry.characterKey][entry.sceneKey]) || 0;
        if (previous < entry.maxNumber) {

          try { localStorage.setItem('unlocked_cg', JSON.stringify(unlocked)); } catch (e) {}

      const restore = () => { img.style.opacity = '1'; };
      img.style.opacity = '0.5';
      try {
        const parts = (img.currentSrc || img.src).split('/');
        const ci = parts.findIndex(part => part === 'NSFW' || part === 'SFW');
        if (ci < 0 || ci + 2 >= parts.length) { restore(); return; }
        const character = safeDecodeURIComponent(parts[ci + 1]);
        const fileName = safeDecodeURIComponent(parts[ci + 2]).replace(/\.webp(?:[?#].*)?$/i, '');
        const match = fileName.match(/^(.+?)(\d+)$/);
        const type = match ? match[1] : fileName;

        const entry = findImageListEntry(parts[ci], character, type);
        if (!entry || !entry.maxNumber) { restore(); return; }
        const pool = entry.numbers.filter(n => n !== current);

    // 处理对话内容（支持双语格式）

    function formatDialogueEmphasis(html) {
      const emRegex = /(?<!\*)\*(?!\*)([^*\n]+?)\*(?!\*)/g;

    function processDialogueContent(dialogue) {
      // 移除对话内容中的角色名标记 {角色名}
      dialogue = dialogue.replace(/\{[^}]+\}/g, '').trim();

      // 支持多种双语格式：
      // 「日文」（中文）、「日文」(中文)、『日文』（中文）、【日文】（中文）
      const patterns = [
        { regex: /「([^」]+)」（([^）]+)）/g, type: 'standard' },
        { regex: /「([^」]+)」\(([^)]+)\)/g, type: 'halfwidth' },
        { regex: /『([^』]+)』（([^）]+)）/g, type: 'alternate' },
        { regex: /【([^】]+)】（([^）]+)）/g, type: 'square' }
      ];

      let result = dialogue;
      patterns.forEach(({ regex }) => {
        result = result.replace(regex, (match, text1, text2) => {
          return `<div class="bilingual-dialogue">
        <div class="primary-text">「${text1}」</div>
        <div class="dialogue-divider"></div>
        <div class="secondary-text">（${text2}）</div>

      if (result === dialogue &&

    function wrapInlineDialogueQuote(segment) {
      if (!segment) return '';
      const pairs = {
        '「': '」',
        '『': '』',
        '【': '】',
        '“': '”',
        '"': '"'
      };
      const open = segment[0];
      const close = segment[segment.length - 1];
      const expectedClose = pairs[open];
      if (!expectedClose || expectedClose !== close || segment.length < 2) {
        return escapeHtmlText(segment);
      }
      const inner = segment.slice(1, -1);
      return `<span class="inline-dialogue-quote"><span class="quote-mark">${escapeHtmlText(open)}</span>${escapeHtmlText(inner)}<span class="quote-mark">${escapeHtmlText(close)}</span></span>`;

    // 星号内不允许换行/星号，未配对的孤立星号原样转义输出。
    function escapeWithNarrationEmphasis(text) {
      const src = String(text || '');
      const emRegex = /(?<!\*)\*(?!\*)([^*\n]+?)\*(?!\*)/g;
      let out = '';
      let last = 0;
      let m;
      while ((m = emRegex.exec(src)) !== null) {
        out += escapeHtmlText(src.slice(last, m.index));
        out += '<em class="narration-em">' + escapeHtmlText(m[1]) + '</em>';
        last = m.index + m[0].length;
      }
      out += escapeHtmlText(src.slice(last));
      return out;
    }

    function highlightInlineDialogueQuotes(text) {
      const source = decodeHtmlEntities(String(text || ''));
      const quoteRegex = /「[^」\n]+」|『[^』\n]+』|【[^】\n]+】|“[^”\n]+”|"[^"\n]+"/g;
      let result = '';
      let lastIndex = 0;
      let match;

      while ((match = quoteRegex.exec(source)) !== null) {
        result += escapeWithNarrationEmphasis(source.slice(lastIndex, match.index));
        result += wrapInlineDialogueQuote(match[0]);
        lastIndex = match.index + match[0].length;
      }

      result += escapeWithNarrationEmphasis(source.slice(lastIndex));
      return result;
    }

    document.addEventListener('click', function (e) {

        const imgTopAbs = imgRect.top + scrollY;

        modalImage.onload = adjustPosition;

      matches.sort((a, b) => a.index - b.index);

      for (let i = matches.length - 1; i > 0; i--) {
        const prev = matches[i - 1];
        if (matches[i].index < prev.index + prev.length) {
          if (matches[i].length > prev.length) matches.splice(i - 1, 1);
          else matches.splice(i, 1);
        }
      }

      // === Phase 2: 文本处理 - 只处理受支持标签，占位符原样保留 ===

      let lastIndex = 0;

      // 以前会顺着 forEach 冒到 processTextContent 外面，整篇正文都不写回 DOM，
      // 页面直接白掉。现在每张卡片各自 try，出事只打日志，那一段退回纯文本排版。
      const renderTag = (match) => {
        try {
          if (match.type === 'image-tag') return renderImageTag(match);
          if (match.type === 'html-img') return createInteractiveImageContainer(match.content);
          if (match.type === 'live-room') return renderLiveRoom(match.content, htmlParts.length);
          if (match.type === 'sudden-event') return renderSuddenEvent(match.content, htmlParts.length);
        } catch (err) {
          console.error('[正文美化] 卡片渲染失败，已退回纯文本：' + match.type, err);
        }
        return processParagraphs(match.raw || match.content || '');
      };
      matches.forEach(match => {
        const beforeText = rawText.substring(lastIndex, match.index);
        if (beforeText.trim()) htmlParts.push(processParagraphs(beforeText));
        htmlParts.push(renderTag(match));
        lastIndex = match.index + match.length;
      });

      if (remainingText.trim()) htmlParts.push(processParagraphs(remainingText));

      if (preservedBlocks.length > 0) {
        const walker = document.createTreeWalker(workDiv, NodeFilter.SHOW_TEXT, null, false);

                parent.parentNode.removeChild(parent);

                parent.insertBefore(block.wrapper, tn);
                if (parts[1]) parent.insertBefore(document.createTextNode(parts[1]), tn);
                parent.removeChild(tn);

            }

            .replace(/^```[^\n]*\r?\n?/, '')
            .replace(/\r?\n?```\s*$/, '');
